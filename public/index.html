<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus Digital — Premium Subscriptions & Digital Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: {
              800: '#161b26',
              900: '#0d1117',
              950: '#06090e'
            },
            admin: {
              border: 'rgba(255, 255, 255, 0.08)'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #06090e; color: #f8fafc; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .custom-loader-container { display: flex; gap: 4px; align-items: center; justify-content: center; }
    .custom-loader-line { width: 4px; height: 24px; background: #10b981; border-radius: 4px; animation: loaderPulse 1s ease-in-out infinite; }
    .custom-loader-line:nth-child(2) { animation-delay: 0.1s; }
    .custom-loader-line:nth-child(3) { animation-delay: 0.2s; }
    .custom-loader-line:nth-child(4) { animation-delay: 0.3s; }
    .custom-loader-line:nth-child(5) { animation-delay: 0.4s; }
    .custom-loader-line:nth-child(6) { animation-delay: 0.5s; }
    @keyframes loaderPulse { 0%, 100% { transform: scaleY(0.3); opacity: 0.4; } 50% { transform: scaleY(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fadeIn { animation: fadeIn 0.25s ease-out forwards; }
    .admin-card { background: rgba(13, 17, 23, 0.85); border: 1px solid rgba(255, 255, 255, 0.07); }
  </style>
</head>
<body class="bg-surface-950 text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-gray-950">

  <!-- ================= STOREFRONT LAYOUT ================= -->
  <div id="storeLayout" class="min-h-screen flex flex-col justify-between">
    
    <!-- Top Navbar -->
    <header class="sticky top-0 z-40 bg-surface-950/80 backdrop-blur-xl border-b border-white/5 px-4 py-3">
      <div class="max-w-xl mx-auto flex items-center justify-between gap-3">
        
        <!-- Left: Menu Drawer Trigger -->
        <button onclick="toggleStoreNavMenu()" class="w-10 h-10 rounded-2xl bg-surface-900 border border-white/5 flex items-center justify-center text-slate-300 hover:text-white transition-all cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <!-- Center: Brand Logo / Home -->
        <div onclick="navigate('home')" class="flex items-center gap-2 cursor-pointer">
          <div class="w-8 h-8 rounded-xl bg-emerald-500 text-gray-950 flex items-center justify-center font-black font-mono text-sm shadow-md shadow-emerald-500/20">
            N
          </div>
          <span class="font-black text-sm tracking-tight text-white">NEXUS</span>
        </div>

        <!-- Right: Cart Trigger with Count Badge -->
        <button onclick="navigate('cart')" class="relative w-10 h-10 rounded-2xl bg-surface-900 border border-white/5 flex items-center justify-center text-slate-300 hover:text-white transition-all cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span id="cartBadgeCount" class="hidden absolute -top-1 -right-1 w-5 h-5 rounded-full bg-emerald-500 text-gray-950 text-[10px] font-mono font-black flex items-center justify-center shadow-lg shadow-emerald-500/30">0</span>
        </button>

      </div>
    </header>

    <!-- Slide-out Drawer Navigation -->
    <div id="storeNavDrawer" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm transition-opacity" onclick="toggleStoreNavMenu()">
      <div class="w-72 max-w-[80vw] h-full bg-surface-900 border-r border-white/10 p-6 space-y-6 flex flex-col justify-between" onclick="event.stopPropagation()">
        
        <div class="space-y-6">
          <div class="flex items-center justify-between border-b border-white/5 pb-4">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-xl bg-emerald-500 text-gray-950 flex items-center justify-center font-black font-mono text-sm">N</div>
              <span class="font-black text-sm text-white">NEXUS VAULT</span>
            </div>
            <button onclick="toggleStoreNavMenu()" class="text-slate-400 hover:text-white p-1">✕</button>
          </div>

          <nav class="space-y-2 font-mono text-xs">
            <button onclick="navigate('home'); toggleStoreNavMenu();" class="w-full p-3 rounded-xl bg-white/5 hover:bg-emerald-500/10 hover:text-emerald-400 text-left font-bold flex items-center gap-3 transition-colors">
              <span>🏠</span> <span>Featured Store</span>
            </button>
            <button onclick="navigate('cart'); toggleStoreNavMenu();" class="w-full p-3 rounded-xl bg-white/5 hover:bg-emerald-500/10 hover:text-emerald-400 text-left font-bold flex items-center gap-3 transition-colors">
              <span>🛒</span> <span>Your Cart</span>
            </button>
            <button onclick="navigate('orders'); toggleStoreNavMenu();" class="w-full p-3 rounded-xl bg-white/5 hover:bg-emerald-500/10 hover:text-emerald-400 text-left font-bold flex items-center gap-3 transition-colors">
              <span>📦</span> <span>Purchased Vault</span>
            </button>
            <button onclick="navigate('account'); toggleStoreNavMenu();" class="w-full p-3 rounded-xl bg-white/5 hover:bg-emerald-500/10 hover:text-emerald-400 text-left font-bold flex items-center gap-3 transition-colors">
              <span>👤</span> <span>Customer Account</span>
            </button>
          </nav>
        </div>

        <div class="pt-4 border-t border-white/5">
          <button onclick="navigate('admin-center'); toggleStoreNavMenu();" class="w-full py-2.5 rounded-xl bg-surface-950 border border-white/5 text-slate-500 hover:text-emerald-400 text-[10px] font-mono font-bold transition-colors flex items-center justify-center gap-2">
            <span>🔒</span> <span>Admin Portal</span>
          </button>
        </div>

      </div>
    </div>

    <!-- Main Dynamic Content Area -->
    <main id="mainStoreContent" class="flex-1 w-full max-w-xl mx-auto px-4 py-4"></main>

  </div>

  <!-- ================= ADMIN LAYOUT ================= -->
  <div id="adminLayout" class="hidden min-h-screen flex-col bg-surface-950">
    <header class="sticky top-0 z-40 bg-surface-900/90 backdrop-blur-xl border-b border-admin-border px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="toggleAdminNavMenu()" class="text-slate-300 hover:text-white p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="font-black text-sm font-mono text-white tracking-wider">ADMIN CONSOLE</span>
      </div>
      <button onclick="navigate('home')" class="px-3 py-1 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 font-mono text-[10px] font-bold">
        Storefront ↗
      </button>
    </header>

    <div class="flex-1 flex">
      <!-- Admin Sidebar Drawer -->
      <aside id="adminSideNav" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm lg:relative lg:block lg:w-64 lg:bg-surface-900 lg:border-r lg:border-admin-border" onclick="toggleAdminNavMenu()">
        <div class="w-64 h-full bg-surface-900 p-5 space-y-2 font-mono text-xs" onclick="event.stopPropagation()">
          <div class="text-[10px] text-slate-500 uppercase font-bold px-3 py-2">Navigation</div>
          <button onclick="navigate('admin-dashboard'); toggleAdminNavMenu();" class="w-full p-2.5 rounded-xl hover:bg-white/5 text-left text-slate-300 hover:text-emerald-400 font-bold block">Dashboard</button>
          <button onclick="navigate('admin-products'); toggleAdminNavMenu();" class="w-full p-2.5 rounded-xl hover:bg-white/5 text-left text-slate-300 hover:text-emerald-400 font-bold block">Product Studio</button>
          <button onclick="navigate('admin-transactions'); toggleAdminNavMenu();" class="w-full p-2.5 rounded-xl hover:bg-white/5 text-left text-slate-300 hover:text-emerald-400 font-bold block">Transactions</button>
          <button onclick="navigate('admin-subscriptions'); toggleAdminNavMenu();" class="w-full p-2.5 rounded-xl hover:bg-white/5 text-left text-slate-300 hover:text-emerald-400 font-bold block">Subscriptions</button>
          <button onclick="navigate('admin-slots'); toggleAdminNavMenu();" class="w-full p-2.5 rounded-xl hover:bg-white/5 text-left text-slate-300 hover:text-emerald-400 font-bold block">Inventory Slots</button>
          <button onclick="navigate('admin-customers'); toggleAdminNavMenu();" class="w-full p-2.5 rounded-xl hover:bg-white/5 text-left text-slate-300 hover:text-emerald-400 font-bold block">Customers</button>
          <button onclick="navigate('admin-payment-settings'); toggleAdminNavMenu();" class="w-full p-2.5 rounded-xl hover:bg-white/5 text-left text-slate-300 hover:text-emerald-400 font-bold block">Payment Gateway</button>
          <button onclick="navigate('admin-status'); toggleAdminNavMenu();" class="w-full p-2.5 rounded-xl hover:bg-white/5 text-left text-slate-300 hover:text-emerald-400 font-bold block">Website Status</button>
        </div>
      </aside>

      <main id="adminMainContent" class="flex-1 p-4 lg:p-8 max-w-5xl mx-auto w-full"></main>
    </div>
  </div>

  <!-- Global Modal Box Container -->
  <div id="globalModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md items-center justify-center p-4">
    <div id="globalModalContent" class="bg-surface-900 rounded-3xl p-6 border border-white/10 max-w-lg w-full max-h-[90vh] overflow-y-auto relative shadow-2xl"></div>
  </div>

  <!-- JavaScript Application Modules -->
  <script src="/js/app.js?v=2.1"></script>
  <script src="/js/store-home.js?v=2.1"></script>
  <script src="/js/store-product.js?v=2.1"></script>
  <script src="/js/store-cart.js?v=2.1"></script>
  <script src="/js/store-checkout.js?v=2.1"></script>
  <script src="/js/store-orders.js?v=2.1"></script>
  <script src="/js/store-auth.js?v=2.1"></script>
  <script src="/js/dashboard.js?v=2.1"></script>
  <script src="/js/product-studio.js?v=2.1"></script>
  <script src="/js/transactions.js?v=2.1"></script>
  <script src="/js/subscriptions.js?v=2.1"></script>
  <script src="/js/slots.js?v=2.1"></script>
  <script src="/js/customers.js?v=2.1"></script>
  <script src="/js/payment-settings.js?v=2.1"></script>
  <script src="/js/website-status.js?v=2.1"></script>

  <script>
    function toggleStoreNavMenu() {
      const d = document.getElementById('storeNavDrawer');
      d.classList.toggle('hidden');
    }
    function toggleAdminNavMenu() {
      const d = document.getElementById('adminSideNav');
      if (window.innerWidth < 1024) d.classList.toggle('hidden');
    }
  </script>
</body>
</html>
