<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS DIGITAL — Digital Goods & Subscriptions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: { 500: '#10b981', 600: '#059669' },
            surface: { 800: '#111827', 900: '#0b0f19', 950: '#030712' },
            admin: { sidebar: '#090d16', bg: '#05070d', card: '#0f1422', border: '#1c2438' }
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
    .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: linear-gradient(135deg, rgba(31, 41, 55, 0.45) 0%, rgba(17, 24, 39, 0.6) 100%); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); transition: all 0.25s; }
    .glass-card:hover { border-color: rgba(16, 185, 129, 0.4); transform: translateY(-4px); }
    .admin-card { background-color: #0f1422; border: 1px solid #1c2438; }
    .auth-glow { box-shadow: 0 0 50px -10px rgba(16, 185, 129, 0.15); }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 999px; }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <div id="toastHub" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
  <div id="appBackdrop" onclick="closeAllDrawers()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden transition-opacity duration-200"></div>
  <div id="mainViewport" class="flex flex-1 min-h-screen"></div>

  <!-- Global Modal -->
  <div id="globalModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass max-w-3xl w-full rounded-3xl p-6 relative max-h-[90vh] overflow-y-auto custom-scroll" id="globalModalContent"></div>
  </div>

  <script>
    const state = {
      sessionId: 'sess_' + Math.random().toString(36).substring(2, 12),
      user: JSON.parse(localStorage.getItem('nexus_user') || 'null'),
      token: localStorage.getItem('nexus_token') || '',
      adminToken: localStorage.getItem('nexus_admin_token') || '',
      adminUsername: localStorage.getItem('nexus_admin_user') || '',
      cart: JSON.parse(localStorage.getItem('nexus_cart') || '[]'),
      currentView: 'home',
      adminSection: 'dashboard',
      paymentSettings: null,
      slotFilterProduct: 'ALL',
      slotFilterStatus: 'ALL',
      authScreen: 'register',
      loadedProducts: [],
      loadedSlots: [],
      loadedSubs: []
    };

    const SVG_EYE = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const SVG_EYE_OFF = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`;
    const SVG_SPINNER = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 inline-block text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;

    function showToast(message, type = 'success') {
      const hub = document.getElementById('toastHub');
      const toast = document.createElement('div');
      const colors = type === 'success' ? 'bg-emerald-500 text-gray-950' : 'bg-rose-500 text-white';
      toast.className = `px-5 py-3 rounded-2xl font-bold text-xs shadow-2xl flex items-center gap-2 transform transition-all duration-300 opacity-0 ${colors}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span> <span>${message}</span>`;
      hub.appendChild(toast);
      setTimeout(() => toast.classList.remove('opacity-0'), 10);
      setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3200);
    }

    async function fetchJSON(url, options = {}) {
      try {
        const res = await fetch(url, options);
        if (res.status === 401 || res.status === 403) {
          if (url.includes('/api/admin/')) adminSignOut();
          throw new Error('Session expired or unauthorized');
        }
        const contentType = res.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          throw new Error('Service synchronizing. Please retry.');
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
        return data;
      } catch (err) { throw err; }
    }

    function closeAllDrawers() {
      document.getElementById('appBackdrop').classList.add('hidden');
      const cSide = document.getElementById('customerSidebar');
      if (cSide) cSide.classList.add('-translate-x-full');
      const aSide = document.getElementById('adminSidebar');
      if (aSide) aSide.classList.add('-translate-x-full');
      document.getElementById('globalModal').classList.add('hidden');
    }

    function toggleCustomerDrawer(open) {
      const side = document.getElementById('customerSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) { side.classList.remove('-translate-x-full'); drop.classList.remove('hidden'); }
      else { side.classList.add('-translate-x-full'); drop.classList.add('hidden'); }
    }

    function toggleAdminDrawer(open) {
      const side = document.getElementById('adminSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) { side.classList.remove('-translate-x-full'); drop.classList.remove('hidden'); }
      else { side.classList.add('-translate-x-full'); drop.classList.add('hidden'); }
    }

    function sendHeartbeat(action = '') {
      fetch('/api/presence/heartbeat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: state.sessionId, page: state.currentView, action })
      }).catch(() => {});
    }
    setInterval(sendHeartbeat, 15000);

    function navigate(view, params = {}) {
      state.currentView = view;
      closeAllDrawers();
      sendHeartbeat();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const viewport = document.getElementById('mainViewport');
      if (view === 'admin-center') {
        if (!state.adminToken) renderAdminLogin(viewport);
        else renderAdminSaaSLayout(viewport);
        return;
      }
      renderStorefrontLayout(viewport, view, params);
    }

    // =========================================================================
    // STOREFRONT LAYOUT & CATALOG
    // =========================================================================
    function renderStorefrontLayout(viewport, view, params) {
      viewport.innerHTML = `
        <div class="flex flex-1 min-h-screen relative w-full bg-surface-950">
          <aside id="customerSidebar" class="fixed lg:static top-0 bottom-0 left-0 w-64 bg-surface-900 border-r border-white/5 z-50 flex flex-col justify-between transition-transform duration-300 -translate-x-full lg:translate-x-0">
            <div>
              <div class="p-6 border-b border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
                  <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center font-black text-gray-950 shadow-lg shadow-emerald-500/20">N</div>
                  <div>
                    <span class="font-extrabold text-sm tracking-wider text-white block">NEXUS</span>
                    <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">DIGITAL VAULT</span>
                  </div>
                </div>
                <button onclick="toggleCustomerDrawer(false)" class="lg:hidden text-slate-400 p-1">✕</button>
              </div>

              <nav class="p-4 space-y-1.5 text-xs font-semibold">
                <button onclick="navigate('home')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>🏠</span> <span>Home</span></button>
                <button onclick="navigate('products')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>🛍</span> <span>All Products</span></button>
                <button onclick="navigate('cart')" class="w-full flex items-center justify-between px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all">
                  <div class="flex items-center gap-3"><span>🛒</span> <span>My Cart</span></div>
                  <span class="cart-count-badge px-2 py-0.5 rounded-full text-[10px] font-black bg-emerald-500 text-gray-950">${state.cart.length}</span>
                </button>
                <button onclick="navigate('orders')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>📦</span> <span>Purchased Items</span></button>
                <button onclick="navigate('account')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>👤</span> <span>${state.user ? '@' + state.user.username : 'Account'}</span></button>
              </nav>
            </div>

            <div class="p-4 border-t border-white/5">
              <button onclick="navigate('admin-center')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold text-slate-400 bg-white/[0.03] hover:bg-emerald-500/10 hover:text-emerald-400 border border-white/5 transition-all">
                <span>🔐</span> <span>Admin Panel</span>
              </button>
            </div>
          </aside>

          <div class="flex-1 flex flex-col min-w-0">
            <header class="sticky top-0 z-30 glass border-b border-white/5 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <button onclick="toggleCustomerDrawer(true)" class="lg:hidden p-2 rounded-xl bg-white/5 text-slate-300">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div class="relative w-48 sm:w-80">
                  <input type="text" oninput="handleStoreSearch(this.value)" placeholder="Search products..." class="w-full pl-9 pr-4 py-2 rounded-xl bg-surface-900 border border-white/10 text-xs text-white placeholder-slate-500 focus:border-emerald-500 outline-none">
                  <svg class="w-4 h-4 text-slate-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <button onclick="navigate('cart')" class="relative p-2.5 rounded-xl bg-surface-900 border border-white/5 text-slate-300">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                  <span class="cart-count-badge absolute -top-1 -right-1 w-5 h-5 rounded-full bg-emerald-500 text-gray-950 text-[10px] font-black flex items-center justify-center">${state.cart.length}</span>
                </button>
              </div>
            </header>

            <main id="storeContent" class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto space-y-8"></main>
          </div>
        </div>
      `;

      const storeContent = document.getElementById('storeContent');
      switch(view) {
        case 'home':
        case 'products': renderStoreProducts(storeContent, params); break;
        case 'product-details': renderStoreProductDetails(storeContent, params.id || params.slug); break;
        case 'cart': renderStoreCart(storeContent); break;
        case 'checkout': renderStoreCheckout(storeContent); break;
        case 'orders': renderStoreOrders(storeContent); break;
        case 'account': renderStoreAccount(storeContent); break;
      }
    }

    async function renderStoreProducts(container, filters = {}) {
      container.innerHTML = '<div class="text-center py-16 text-slate-500 font-bold animate-pulse">Loading catalog...</div>';
      let queryUrl = '/api/products?';
      if (filters.search) queryUrl += `search=${encodeURIComponent(filters.search)}&`;

      try {
        const data = await fetchJSON(queryUrl);
        const products = Array.isArray(data) ? data : [];

        container.innerHTML = `
          <div class="space-y-6">
            <div>
              <h1 class="text-xl font-black text-white">${filters.title || 'Digital Products & Subscriptions'}</h1>
              <p class="text-xs text-slate-400">${products.length} products available</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              ${products.map(p => `
                <div class="glass-card rounded-3xl overflow-hidden flex flex-col justify-between border border-white/5 relative group cursor-pointer" onclick="navigate('product-details', { id: '${p._id}' })">
                  <span class="absolute top-3 left-3 z-10 px-2.5 py-1 rounded-full ${p.product_type === 'SUBSCRIPTION' ? 'bg-indigo-500' : 'bg-emerald-500'} text-white font-black text-[10px] uppercase">
                    ${p.product_type === 'SUBSCRIPTION' ? '🔄 Subscription' : '⚡ One-Time'}
                  </span>

                  <div>
                    <div class="h-48 w-full overflow-hidden bg-surface-900">
                      <img src="${p.images && p.images[0] ? p.images[0] : 'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    </div>
                    <div class="p-5 space-y-2">
                      <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">${p.category || 'Digital Good'}</span>
                      <h3 class="text-sm font-bold text-white line-clamp-1 group-hover:text-emerald-400 transition-colors">${p.name}</h3>
                      <p class="text-xs text-slate-400 line-clamp-2">${p.short_description || p.description}</p>
                    </div>
                  </div>

                  <div class="px-5 pb-5 pt-2 flex items-center justify-between border-t border-white/5" onclick="event.stopPropagation()">
                    <div>
                      <div class="flex items-center gap-2">
                        <span class="text-base font-black text-white">₹${p.sale_price}</span>
                        ${p.original_price > p.sale_price ? `<span class="text-xs text-slate-500 line-through">₹${p.original_price}</span>` : ''}
                      </div>
                    </div>
                    <button onclick="navigate('product-details', { id: '${p._id}' })" class="px-4 py-2 rounded-xl bg-emerald-500 text-gray-950 font-black text-xs uppercase shadow-lg shadow-emerald-500/20 active:scale-95">
                      View Details
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="glass p-8 text-center text-rose-400 text-xs">${err.message}</div>`;
      }
    }

    let selectedSubDuration = '1_MONTH';
    let currentSelectedPrice = 199;

    async function renderStoreProductDetails(container, identifier) {
      container.innerHTML = '<div class="text-center py-20 text-slate-500 font-bold animate-pulse">Loading product details...</div>';
      try {
        const p = await fetchJSON(`/api/products/${identifier}`);
        selectedSubDuration = '1_MONTH';
        currentSelectedPrice = p.product_type === 'SUBSCRIPTION' ? (p.subscription_pricing?.one_month || p.sale_price) : p.sale_price;
        const imagesList = p.images && p.images.length ? p.images : ['https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800'];
        const savings = p.original_price > currentSelectedPrice ? p.original_price - currentSelectedPrice : 0;
        const isAvailable = p.in_stock;

        sendHeartbeat(`product_view_${p.name}`);

        container.innerHTML = `
          <div class="space-y-12">
            <div class="flex items-center justify-between text-xs text-slate-400">
              <button onclick="navigate('products')" class="hover:text-white flex items-center gap-1">← Back to Catalog</button>
              <div class="flex items-center gap-2">
                <span class="text-emerald-400 font-bold">${p.category || 'Digital Good'}</span>
                <span>/</span>
                <span class="font-mono text-slate-500">SKU: ${p.sku}</span>
              </div>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              <div class="lg:col-span-7 space-y-4">
                <div class="h-72 sm:h-96 rounded-3xl overflow-hidden glass border border-white/10 relative">
                  <img id="detailMainImage" src="${imagesList[0]}" class="w-full h-full object-cover">
                  ${p.discount_percentage > 0 ? `
                    <span class="absolute top-4 left-4 px-3 py-1.5 rounded-full bg-rose-500 text-white font-black text-xs uppercase shadow-xl">
                      ${p.discount_percentage}% OFF
                    </span>
                  ` : ''}
                </div>
              </div>

              <div class="lg:col-span-5 space-y-6">
                <div>
                  <span class="px-3 py-1 rounded-full ${p.product_type === 'SUBSCRIPTION' ? 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30'} border font-bold text-[10px] uppercase">
                    ${p.product_type === 'SUBSCRIPTION' ? '🔄 Subscription Product' : '⚡ One-Time Digital Purchase'}
                  </span>
                  <h1 class="text-2xl sm:text-3xl font-black text-white mt-2">${p.name}</h1>
                  <p class="text-xs text-slate-400 mt-1">${p.short_description || ''}</p>
                </div>

                ${p.product_type === 'SUBSCRIPTION' ? `
                  <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-300">Choose Subscription Duration:</label>
                    <div class="grid grid-cols-3 gap-2">
                      <button onclick="pickDuration('1_MONTH', ${p.subscription_pricing?.one_month || 199})" id="dur-1_MONTH" class="dur-btn p-3 rounded-2xl border-2 border-emerald-500 bg-emerald-500/10 text-center">
                        <span class="text-xs font-black text-white block">1 Month</span>
                        <span class="text-[11px] font-mono text-emerald-400">₹${p.subscription_pricing?.one_month || 199}</span>
                      </button>
                      <button onclick="pickDuration('6_MONTHS', ${p.subscription_pricing?.six_months || 899})" id="dur-6_MONTHS" class="dur-btn p-3 rounded-2xl border border-white/10 glass text-center">
                        <span class="text-xs font-black text-white block">6 Months</span>
                        <span class="text-[11px] font-mono text-emerald-400">₹${p.subscription_pricing?.six_months || 899}</span>
                      </button>
                      <button onclick="pickDuration('1_YEAR', ${p.subscription_pricing?.one_year || 1499})" id="dur-1_YEAR" class="dur-btn p-3 rounded-2xl border border-white/10 glass text-center">
                        <span class="text-xs font-black text-white block">1 Year</span>
                        <span class="text-[11px] font-mono text-emerald-400">₹${p.subscription_pricing?.one_year || 1499}</span>
                      </button>
                    </div>
                  </div>
                ` : ''}

                <div class="p-5 rounded-3xl glass border border-white/5 space-y-1">
                  <div class="flex items-center gap-3">
                    <span class="text-3xl font-black text-white" id="displayActivePrice">₹${currentSelectedPrice}</span>
                    ${p.original_price > currentSelectedPrice ? `<span class="text-sm text-slate-500 line-through">₹${p.original_price}</span>` : ''}
                    ${savings > 0 ? `<span class="px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-bold" id="detailSavingsBadge">You Save ₹${savings}</span>` : ''}
                  </div>
                  <span class="text-xs ${isAvailable ? 'text-emerald-400' : 'text-rose-400'} font-bold block pt-1">
                    ${isAvailable ? '● Available' : '✕ Out of Stock'}
                  </span>
                </div>

                <div class="space-y-3">
                  <button onclick="buyNowStore('${p._id}', '${p.name.replace(/'/g, "\\'")}', '${p.product_type}')" ${!isAvailable ? 'disabled' : ''} class="w-full py-4 rounded-2xl ${isAvailable ? 'bg-emerald-500 text-gray-950 font-black' : 'bg-gray-800 text-gray-500 cursor-not-allowed'} text-xs uppercase tracking-wider shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
                    ${isAvailable ? '⚡ Buy Now & Pay (UPI / Crypto)' : 'Currently Out of Stock'}
                  </button>
                  <button onclick="addToCart('${p._id}', '${p.name.replace(/'/g, "\\'")}', ${currentSelectedPrice}, '${imagesList[0]}', '${p.delivery_type}')" ${!isAvailable ? 'disabled' : ''} class="w-full py-4 rounded-2xl glass hover:bg-white/10 text-white font-bold text-xs uppercase tracking-wider transition-all">
                    Add to Cart
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="glass p-8 text-center text-rose-400 text-xs">${err.message}</div>`;
      }
    }

    function pickDuration(dur, price) {
      selectedSubDuration = dur;
      currentSelectedPrice = price;
      document.getElementById('displayActivePrice').textContent = `₹${price}`;
      document.querySelectorAll('.dur-btn').forEach(b => b.className = 'dur-btn p-3 rounded-2xl border border-white/10 glass text-center');
      document.getElementById(`dur-${dur}`).className = 'dur-btn p-3 rounded-2xl border-2 border-emerald-500 bg-emerald-500/10 text-center';
    }

    function buyNowStore(id, name, product_type) {
      state.cart = [{
        product_id: id,
        name: name + (product_type === 'SUBSCRIPTION' ? ` (${selectedSubDuration.replace('_', ' ')})` : ''),
        price: currentSelectedPrice,
        product_type: product_type,
        duration: product_type === 'SUBSCRIPTION' ? selectedSubDuration : 'ONE_TIME'
      }];
      localStorage.setItem('nexus_cart', JSON.stringify(state.cart));
      navigate('checkout');
    }

    function addToCart(product_id, name, price, image, delivery_type) {
      state.cart = [{ product_id, name, price, image, delivery_type, duration: '1_MONTH' }];

    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = SVG_EYE_OFF;
        btn.classList.add('text-emerald-400');
        btn.setAttribute('aria-label', 'Hide password');
      } else {
        input.type = 'password';
        btn.innerHTML = SVG_EYE;
        btn.classList.remove('text-emerald-400');
        btn.setAttribute('aria-label', 'Show password');
      }
    }

    let usernameCheckTimer = null;
    let isUsernameAvailable = false;

    function validateUsernameLive(val) {
      clearTimeout(usernameCheckTimer);
      const msg = document.getElementById('regUsernameMsg');
      const clean = val.toLowerCase().trim();

      if (!clean || clean.length < 3) {
        msg.innerHTML = '<span class="text-slate-500">Min 3 chars</span>';
        isUsernameAvailable = false; return;
      }
      if (!/^[a-zA-Z0-9_]+$/.test(clean)) {
        msg.innerHTML = '<span class="text-rose-400">✕ Invalid chars</span>';
        isUsernameAvailable = false; return;
      }

      msg.innerHTML = '<span class="text-slate-400 animate-pulse">Checking...</span>';

      usernameCheckTimer = setTimeout(async () => {
        try {
          const res = await fetchJSON(`/api/auth/check-username?username=${encodeURIComponent(clean)}`);
          if (res.available) {
            msg.innerHTML = '<span class="text-emerald-400 font-bold">✓ Available</span>';
            isUsernameAvailable = true;
          } else {
            msg.innerHTML = `<span class="text-rose-400 font-bold">✕ Taken</span>`;
            isUsernameAvailable = false;
          }
        } catch (e) {
          msg.innerHTML = '<span class="text-rose-400">✕ Error</span>';
          isUsernameAvailable = false;
        }
      }, 350);
    }

    function checkPasswordStrength(val) {
      const badge = document.getElementById('passStrengthBadge');
      if (!badge) return;
      if (!val) { badge.textContent = ''; return; }

      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Za-z]/.test(val) && /[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val) && val.length >= 10) score++;

      if (score <= 1) { badge.textContent = 'Weak'; badge.className = 'font-bold text-rose-400 text-[9px]'; } 
      else if (score === 2) { badge.textContent = 'Medium'; badge.className = 'font-bold text-amber-400 text-[9px]'; } 
      else { badge.textContent = 'Strong'; badge.className = 'font-bold text-emerald-400 text-[9px]'; }
      checkPasswordMatch();
    }

    function checkPasswordMatch() {
      const p1 = document.getElementById('regPassword')?.value;
      const p2 = document.getElementById('regConfirmPassword')?.value;
      const msg = document.getElementById('confirmPassMsg');
      if (!msg || !p2) { if (msg) msg.textContent = ''; return; }

      if (p1 === p2) msg.innerHTML = '<span class="text-emerald-400">✓ Passwords match</span>';
      else msg.innerHTML = '<span class="text-rose-400">✕ Passwords do not match</span>';
    }

    async function handleCustomerRegister(e, returnView) {
      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const name = document.getElementById('regName').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPass = document.getElementById('regConfirmPassword').value;
      const btn = document.getElementById('regSubmitBtn');

      if (password !== confirmPass) return showToast('Passwords do not match.', 'error');
      if (!isUsernameAvailable) return showToast('Please select an available username.', 'error');

      btn.disabled = true;
      btn.innerHTML = `${SVG_SPINNER} Creating...`;

      try {
        const data = await fetchJSON('/api/auth/customer/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, name, email, password })
        });
        state.token = data.token;
        state.user = data.user;
        localStorage.setItem('nexus_token', data.token);
        localStorage.setItem('nexus_user', JSON.stringify(data.user));
        
        showToast(`✓ Welcome to Nexus Digital, @${data.user.username}!`);
        navigate(returnView);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = 'Create Account';
        showToast(err.message, 'error');
      }
    }

      if (!content) return;

      document.querySelectorAll('[id^="adnav-"]').forEach(b => b.classList.remove('bg-emerald-500/10', 'text-emerald-400'));
      const active = document.getElementById(`adnav-${sec}`);
      if (active) active.classList.add('bg-emerald-500/10', 'text-emerald-400');

      switch(sec) {
        case 'dashboard': renderAdminOverview(content); break;
        case 'products': renderAdminProductsStudio(content); break;
        case 'slots': renderAdminAccountSlots(content); break;
        case 'subscriptions': renderAdminSubscriptions(content); break;
        case 'transactions': renderAdminTransactions(content); break;
        case 'customers': renderAdminCustomers(content); break;
        case 'payment-settings': renderAdminPaymentSettings(content); break;
        case 'system-monitor': renderAdminSystemMonitor(content); break;

    async function handleMasterProductSubmit(e, productId) {
      e.preventDefault();

        name: document.getElementById('studioName').value,
        short_description: document.getElementById('studioShortDesc').value,
        product_type: document.getElementById('studioProductType').value,

        sale_price: Number(document.getElementById('studioSalePrice').value),
        status: document.getElementById('studioStatus').value

      try {
        await fetchJSON(isNew ? '/api/admin/products' : `/api/admin/products/${productId}`, {
          method: isNew ? 'POST' : 'PUT',

      modal.classList.remove('hidden'); modal.classList.add('flex');
      content.innerHTML = `
        <button onclick="document.getElementById('globalModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
        <div class="space-y-6 font-mono text-xs">
          <h2 class="text-lg font-black text-white font-sans">${s.product_name}</h2>
          <div class="p-4 bg-surface-950 border border-admin-border rounded-2xl space-y-2">
            <div class="flex justify-between"><span>Customer:</span><span class="text-white">${s.user_id?.username}</span></div>
            <div class="flex justify-between"><span>Slot:</span><span class="text-emerald-400">${s.assigned_slot_id?.account_label || 'N/A'}</span></div>
            <div class="flex justify-between"><span>Time Left:</span><span class="text-emerald-400 font-bold">${s.time_remaining_text}</span></div>
            <div class="flex justify-between"><span>Expires:</span><span class="text-white">${new Date(s.expires_at).toLocaleString()}</span></div>
          </div>
          <div class="flex justify-end gap-2 pt-2 border-t border-admin-border">
            <button onclick="openExtendModal('${s._id}')" class="px-3 py-2 rounded-xl bg-emerald-500/10 text-emerald-400 font-bold">+ Extend</button>
          </div>
        </div>
      `;
    }

    function openExtendModal(subId) {
      const modal = document.getElementById('globalModal');
      const content = document.getElementById('globalModalContent');
      content.innerHTML = `
        <button onclick="document.getElementById('globalModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
        <div class="space-y-5 font-mono text-xs">
          <h3 class="text-base font-black text-white font-sans">Extend Subscription</h3>
          <form onsubmit="handleExtendSubmit(event, '${subId}')" class="space-y-4">
            <select id="extendTypeSelect" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-white">
              <option value="1_MONTH">+ 1 Month Extension</option>
              <option value="6_MONTHS">+ 6 Months Extension</option>
              <option value="1_YEAR">+ 1 Year Extension</option>
            </select>
            <button type="submit" class="w-full py-4 rounded-2xl bg-emerald-500 text-gray-950 font-black uppercase font-sans shadow-lg active:scale-95 transition-all">Confirm Extension</button>
          </form>
        </div>
      `;
    }

    async function handleExtendSubmit(e, subId) {
      e.preventDefault();
      try {
        await fetchJSON(`/api/admin/subscriptions/${subId}/extend`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.adminToken}` },
          body: JSON.stringify({ extend_type: document.getElementById('extendTypeSelect').value })
        });
        showToast('Subscription extended successfully!');
        document.getElementById('globalModal').classList.add('hidden');
        renderAdminSubscriptions(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    // 5. TRANSACTIONS QUEUE
    async function renderAdminTransactions(container) {
      container.innerHTML = '<div class="text-center py-12 text-slate-500 font-mono">Loading transactions...</div>';
      try {
        const data = await fetchJSON('/api/admin/transactions', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        const txns = Array.isArray(data) ? data : [];
        container.innerHTML = `
          <div class="space-y-6 font-mono text-xs">
            <h2 class="text-lg font-black text-white font-sans">Transactions Queue</h2>
            <div class="admin-card rounded-3xl p-6">
              <div class="overflow-x-auto">
                <table class="w-full text-left min-w-[780px]">
                  <thead><tr class="border-b border-admin-border text-slate-500"><th class="pb-3">TXN</th><th class="pb-3">Customer</th><th class="pb-3">Amount</th><th class="pb-3">Assign Slot</th><th class="pb-3 text-right">Actions</th></tr></thead>
                  <tbody class="divide-y divide-admin-border">
                    ${txns.length === 0 ? `<tr><td colspan="5" class="py-8 text-center text-slate-500">No transactions in queue.</td></tr>` : txns.map(t => `
                      <tr>
                        <td class="py-3.5"><span class="font-bold text-white block">${t.txn_id}</span></td>
                        <td class="py-3.5 text-slate-300">${t.customer_name}</td>
                        <td class="py-3.5 text-emerald-400 font-bold">₹${t.amount}</td>
                        <td class="py-3.5">
                          ${t.status === 'PROCESSING' ? `
                            <select id="slotSelect-${t._id}" class="px-3 py-1.5 rounded-xl bg-surface-950 border border-admin-border text-[11px] text-emerald-400 max-w-[200px]">
                              ${(t.available_slots || []).map(s => `<option value="${s._id}">${s.account_label}</option>`).join('')}
                            </select>
                          ` : '<span class="text-slate-500">Assigned</span>'}
                        </td>
                        <td class="py-3.5 text-right space-x-2">
                          ${t.status === 'PROCESSING' ? `
                            <button onclick="confirmAndAssignTransaction('${t._id}')" class="px-3 py-1.5 rounded-lg bg-emerald-500 text-gray-950 font-black">Confirm</button>
                            <button onclick="rejectTransaction('${t._id}')" class="px-3 py-1.5 rounded-lg bg-rose-500/20 text-rose-400 font-bold">Reject</button>
                          ` : `<span class="px-2 py-0.5 rounded text-[10px] ${t.status === 'CONFIRMED' ? 'text-emerald-400 bg-emerald-500/10' : 'text-rose-400 bg-rose-500/10'}">${t.status}</span>`}
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      } catch (err) { container.innerHTML = `<div class="admin-card p-8 text-center text-rose-400 text-xs font-mono">Transactions Error: ${err.message}</div>`; }
    }

    async function confirmAndAssignTransaction(id) {
      const selectEl = document.getElementById(`slotSelect-${id}`);
      const slot_id = selectEl ? selectEl.value : null;
      if (!confirm('Confirm this payment and bind account slot?')) return;
      try {
        await fetchJSON(`/api/admin/transactions/${id}/confirm-and-assign`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.adminToken}` },
          body: JSON.stringify({ slot_id })
        });
        showToast('Subscription activated and account slot bound!');
        renderAdminTransactions(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function rejectTransaction(id) {
      if (!confirm('Reject transaction?')) return;
      try {
        await fetchJSON(`/api/admin/transactions/${id}/reject`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.adminToken}` },
          body: JSON.stringify({ reason: 'Rejected by Admin' })
        });
        showToast('Transaction rejected');
        renderAdminTransactions(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    // 6. CUSTOMERS DIRECTORY
    async function renderAdminCustomers(container) {
      container.innerHTML = '<div class="text-center py-16 text-slate-500 font-mono animate-pulse">Loading directory...</div>';
      try {
        const data = await fetchJSON('/api/admin/customers/list', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        const customers = Array.isArray(data) ? data : [];
        container.innerHTML = `
          <div class="space-y-6 font-mono text-xs">
            <h1 class="text-xl font-black text-white font-sans">Registered Customers</h1>
            <div class="admin-card rounded-3xl p-6">
              <table class="w-full text-left">
                <thead><tr class="border-b border-admin-border text-slate-500"><th class="pb-3">Username</th><th class="pb-3">Orders</th><th class="pb-3">Active Subs</th></tr></thead>
                <tbody class="divide-y divide-admin-border">${customers.map(c => `
                  <tr><td class="py-3 font-bold text-white">@${c.username || c.name}</td><td class="py-3 text-emerald-400">${c.orders_count || 0}</td><td class="py-3 text-slate-400">${(c.active_subscriptions || []).length} Active</td></tr>
                `).join('')}</tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) { container.innerHTML = `<div class="admin-card p-8 text-center text-rose-400 text-xs font-mono">${err.message}</div>`; }
    }

    // 7. PAYMENT SETTINGS
    async function renderAdminPaymentSettings(container) {
      try {
        const s = await fetchJSON('/api/admin/payment-settings', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        container.innerHTML = `
          <div class="max-w-xl space-y-6 font-mono text-xs">
            <h1 class="text-xl font-black text-white font-sans">Payment Settings</h1>
            <form onsubmit="saveAdminPaymentSettings(event)" class="admin-card rounded-3xl p-6 space-y-4">
              <div><label class="text-slate-400 block mb-1">UPI ID</label><input type="text" id="admUpiId" value="${s.upi_id || ''}" class="w-full px-4 py-3 bg-surface-950 border border-admin-border text-white rounded-xl"></div>
              <div><label class="text-slate-400 block mb-1">UPI QR Code URL</label><input type="text" id="admUpiQr" value="${s.upi_qr_url || ''}" class="w-full px-4 py-3 bg-surface-950 border border-admin-border text-white rounded-xl"></div>
              <button type="submit" class="w-full py-4 bg-emerald-500 text-gray-950 font-black rounded-2xl uppercase">Save Settings</button>
            </form>
          </div>
        `;
      } catch (e) { container.innerHTML = `<div class="admin-card p-8 text-rose-400 text-xs font-mono">${e.message}</div>`; }
    }

    async function saveAdminPaymentSettings(e) {
      e.preventDefault();
      try {
        await fetchJSON('/api/admin/payment-settings', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.adminToken}` },
          body: JSON.stringify({
            upi_id: document.getElementById('admUpiId').value,
            upi_qr_url: document.getElementById('admUpiQr').value
          })
        });
        showToast('Payment settings saved!');
      } catch (err) { showToast(err.message, 'error'); }
    }

    // 8. SYSTEM MONITOR
    async function renderAdminSystemMonitor(container) {
      container.innerHTML = '<div class="text-center py-16 text-slate-500 font-mono animate-pulse">Running live diagnostics...</div>';
      try {
        const data = await fetchJSON('/api/admin/system/infrastructure', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        container.innerHTML = `
          <div class="space-y-6 font-mono text-xs">
            <h1 class="text-xl font-black text-white font-sans">Website & Infrastructure Status</h1>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <div class="admin-card p-5 rounded-2xl"><span class="text-slate-500 uppercase text-[10px]">Memory RSS</span><div class="text-2xl font-black text-white">${data.server?.service_memory_rss_mb || 0} MB</div></div>
              <div class="admin-card p-5 rounded-2xl"><span class="text-slate-500 uppercase text-[10px]">DB Status</span><div class="text-2xl font-black text-emerald-400">${data.database?.status || 'Online'}</div></div>
              <div class="admin-card p-5 rounded-2xl"><span class="text-slate-500 uppercase text-[10px]">DB Ping</span><div class="text-2xl font-black text-white">${data.database?.ping_latency_ms || 12} ms</div></div>
              <div class="admin-card p-5 rounded-2xl"><span class="text-slate-500 uppercase text-[10px]">Uptime</span><div class="text-lg font-black text-emerald-400 mt-1">${data.server?.uptime_formatted || 'Live'}</div></div>
            </div>
          </div>
        `;
      } catch (e) { container.innerHTML = `<div class="admin-card p-8 text-center text-rose-400 text-xs font-mono">${e.message}</div>`; }
    }

    function adminSignOut() {
      state.adminToken = '';
      state.adminUsername = '';
      localStorage.removeItem('nexus_admin_token');
      localStorage.removeItem('nexus_admin_user');
      navigate('home');
    }

    document.addEventListener('DOMContentLoaded', () => {
      navigate('home');
    });
  </script>
</body>
</html>
