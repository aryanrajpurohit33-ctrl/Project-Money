<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS DIGITAL — Digital Marketplace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: { 500: '#10b981', 600: '#059669' },
            surface: { 800: '#111827', 900: '#0b0f19', 950: '#030712' }
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
    .glass {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(31, 41, 55, 0.45) 0%, rgba(17, 24, 39, 0.6) 100%);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      border-color: rgba(16, 185, 129, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7);
    }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <div id="toastHub" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
  <div id="drawerOverlay" onclick="toggleSidebar(false)" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden transition-opacity"></div>

  <div class="flex flex-1 min-h-screen relative">
    
    <!-- Sidebar -->
    <aside id="mainSidebar" class="fixed lg:static top-0 bottom-0 left-0 w-64 bg-surface-900 border-r border-white/5 z-50 flex flex-col justify-between transition-transform duration-300 -translate-x-full lg:translate-x-0">
      <div>
        <div class="p-6 border-b border-white/5 flex items-center justify-between">
          <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center font-black text-gray-950 shadow-lg shadow-emerald-500/20">N</div>
            <div>
              <span class="font-extrabold text-sm tracking-wider text-white block">NEXUS</span>
              <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">DIGITAL STORE</span>
            </div>
          </div>
          <button onclick="toggleSidebar(false)" class="lg:hidden text-slate-400 hover:text-white p-1">✕</button>
        </div>

        <nav class="p-4 space-y-1.5 text-xs font-semibold">
          <button onclick="navigate('home')" id="nav-home" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition-all"><span>🏠</span> <span>Home</span></button>
          <button onclick="navigate('products')" id="nav-products" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition-all"><span>🛍</span> <span>All Products</span></button>
          <button onclick="navigate('cart')" id="nav-cart" class="nav-btn w-full flex items-center justify-between px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition-all">
            <div class="flex items-center gap-3"><span>🛒</span> <span>My Cart</span></div>
            <span id="cartCountBadge" class="px-2 py-0.5 rounded-full text-[10px] font-black bg-emerald-500 text-gray-950">0</span>
          </button>
          <button onclick="navigate('orders')" id="nav-orders" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition-all"><span>📦</span> <span>Purchased Goods</span></button>
          <button onclick="navigate('account')" id="nav-account" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition-all"><span>👤</span> <span id="navAccountLabel">My Account</span></button>
        </nav>
      </div>

      <div class="p-4 border-t border-white/5 space-y-2">
        <button onclick="navigate('admin')" id="nav-admin" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold text-slate-400 bg-white/[0.03] hover:bg-emerald-500/10 hover:text-emerald-400 border border-white/5 transition-all">
          <span>🔐</span> <span>Admin Console</span>
        </button>
      </div>
    </aside>

    <!-- Main Content App Viewport -->
    <div class="flex-1 flex flex-col min-w-0 bg-surface-950">
      <header class="sticky top-0 z-30 glass border-b border-white/5 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <button onclick="toggleSidebar(true)" class="lg:hidden p-2 rounded-xl bg-white/5 text-slate-300 hover:text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="relative w-48 sm:w-80">
            <input type="text" id="globalSearchInput" oninput="handleGlobalSearch(this.value)" placeholder="Search products, accounts, keys..." class="w-full pl-9 pr-4 py-2 rounded-xl bg-surface-900 border border-white/10 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
            <svg class="w-4 h-4 text-slate-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="navigate('cart')" class="relative p-2.5 rounded-xl bg-surface-900 border border-white/5 hover:border-emerald-500/40 text-slate-300">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
            <span id="topCartCount" class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-emerald-500 text-gray-950 text-[10px] font-black flex items-center justify-center">0</span>
          </button>
        </div>
      </header>

      <main id="appRoot" class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto space-y-8"></main>
    </div>
  </div>

  <div id="productModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass max-w-2xl w-full rounded-3xl p-6 relative max-h-[90vh] overflow-y-auto custom-scroll" id="productModalContent"></div>
  </div>

  <script>
    const state = {
      user: JSON.parse(localStorage.getItem('nexus_user') || 'null'),
      token: localStorage.getItem('nexus_token') || '',
      adminToken: localStorage.getItem('nexus_admin_token') || '',
      adminUsername: localStorage.getItem('nexus_admin_user') || '',
      cart: JSON.parse(localStorage.getItem('nexus_cart') || '[]'),
      appliedCoupon: null,
      currentView: 'home',
      currentProduct: null
    };

    function showToast(message, type = 'success') {
      const hub = document.getElementById('toastHub');
      const toast = document.createElement('div');
      const colors = type === 'success' ? 'bg-emerald-500 text-gray-950' : 'bg-rose-500 text-white';
      toast.className = `px-5 py-3 rounded-2xl font-bold text-xs shadow-2xl flex items-center gap-2 transform transition-all duration-300 translate-y-[-10px] opacity-0 ${colors}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span> <span>${message}</span>`;
      hub.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-[-10px]', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-x-full');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function toggleSidebar(open) {
      const sidebar = document.getElementById('mainSidebar');
      const overlay = document.getElementById('drawerOverlay');
      if (open) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      }
    }

    function updateCartBadges() {
      const count = state.cart.length;
      document.getElementById('cartCountBadge').textContent = count;
      document.getElementById('topCartCount').textContent = count;
      localStorage.setItem('nexus_cart', JSON.stringify(state.cart));
    }

    function navigate(view, params = {}) {
      state.currentView = view;
      toggleSidebar(false);
      window.scrollTo({ top: 0, behavior: 'smooth' });

      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('bg-emerald-500/10', 'text-emerald-400'));
      const active = document.getElementById(`nav-${view}`);
      if (active) active.classList.add('bg-emerald-500/10', 'text-emerald-400');

      const root = document.getElementById('appRoot');
      switch(view) {
        case 'home': renderHomeView(root); break;
        case 'products': renderProductsView(root, params); break;
        case 'product-details': renderProductDetailsPage(root, params.id); break;
        case 'cart': renderCartView(root); break;
        case 'checkout': renderCheckoutView(root); break;
        case 'orders': renderOrdersView(root); break;
        case 'account': renderAccountView(root); break;
        case 'admin':
          if (state.adminToken) renderAdminDashboard(root);
          else renderAdminLoginView(root);
          break;
        case 'admin-edit-product':
          renderAdminEditProductPage(root, params.id);
          break;
      }
    }

    async function renderHomeView(root) {
      root.innerHTML = '<div class="text-center py-20 text-slate-500 font-bold animate-pulse">Loading digital marketplace...</div>';
      try {
        const prodRes = await fetch('/api/products');
        const allProducts = await prodRes.json();

        root.innerHTML = `
          <div class="relative rounded-3xl overflow-hidden glass p-8 sm:p-14 border border-emerald-500/20 bg-gradient-to-r from-emerald-950/40 via-surface-900 to-surface-950">
            <div class="max-w-2xl space-y-4">
              <span class="px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-black uppercase inline-block">⚡ Instant Automated Delivery</span>
              <h1 class="text-3xl sm:text-5xl font-black tracking-tight text-white leading-tight">Unlock Premium <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200">Digital Goods</span></h1>
              <p class="text-xs sm:text-sm text-slate-400 leading-relaxed">Genuine license keys, accounts, software source codes, and development assets. Unlocked immediately upon purchase.</p>
              <div class="pt-2">
                <button onclick="navigate('products')" class="px-7 py-3.5 rounded-2xl bg-emerald-500 text-gray-950 font-black text-xs uppercase tracking-wider shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">Browse Catalog</button>
              </div>
            </div>
          </div>

          <section class="space-y-4">
            <h2 class="text-lg font-black text-white">All Digital Products</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              ${allProducts.map(p => renderProductCardHTML(p)).join('')}
            </div>
          </section>
        `;
      } catch (err) {
        root.innerHTML = `<div class="glass p-8 text-center text-rose-400 text-xs">${err.message}</div>`;
      }
    }

    function renderProductCardHTML(p) {
      return `
        <div class="glass-card rounded-3xl overflow-hidden flex flex-col justify-between border border-white/5 relative group cursor-pointer" onclick="navigate('product-details', { id: '${p._id}' })">
          ${p.discount_percentage > 0 ? `<span class="absolute top-3 left-3 z-10 px-2.5 py-1 rounded-full bg-rose-500 text-white font-black text-[10px] uppercase">${p.discount_percentage}% OFF</span>` : ''}
          <span class="absolute top-3 right-3 z-10 px-2.5 py-1 rounded-full bg-surface-950/80 border border-white/10 text-emerald-400 font-bold text-[9px] uppercase">${p.delivery_type.replace('_', ' ')}</span>
          
          <div>
            <div class="h-44 w-full overflow-hidden bg-surface-900">
              <img src="${p.images[0] || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            </div>
            <div class="p-5 space-y-2">
              <h3 class="text-sm font-bold text-white line-clamp-1 group-hover:text-emerald-400 transition-colors">${p.name}</h3>
              <p class="text-xs text-slate-400 line-clamp-2">${p.short_description || p.description}</p>
            </div>
          </div>

          <div class="px-5 pb-5 pt-2 flex items-center justify-between border-t border-white/5" onclick="event.stopPropagation()">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-base font-black text-white">₹${p.sale_price}</span>
                ${p.original_price > p.sale_price ? `<span class="text-xs text-slate-500 line-through">₹${p.original_price}</span>` : ''}
              </div>
              <span class="text-[10px] ${p.in_stock ? 'text-emerald-400' : 'text-rose-400'} font-bold block">${p.in_stock ? '● In Stock' : '✕ Out of Stock'}</span>
            </div>
            <button onclick="addToCart('${p._id}', '${p.name.replace(/'/g, "\\'")}', ${p.sale_price}, '${p.images[0]}', '${p.delivery_type}')" ${!p.in_stock ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl ${p.in_stock ? 'bg-emerald-500 text-gray-950' : 'bg-gray-800 text-gray-500 cursor-not-allowed'} font-black text-xs uppercase">Add</button>
          </div>
        </div>
      `;
    }

    async function renderProductDetailsPage(root, productId) {
      root.innerHTML = '<div class="text-center py-20 text-slate-500 font-bold animate-pulse">Loading verified digital asset...</div>';
      try {
        const res = await fetch(`/api/products/${productId}`);
        const p = await res.json();
        if (!res.ok) throw new Error(p.error);

        state.currentProduct = p;
        const mainImage = p.images && p.images.length ? p.images[0] : 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800';

        root.innerHTML = `
          <div class="space-y-12">
            <div class="flex items-center justify-between text-xs text-slate-400">
              <button onclick="navigate('products')" class="flex items-center gap-2 hover:text-white">
                <span>←</span> <span>Back to Products</span>
              </button>
              <div class="flex items-center gap-2">
                <span class="font-mono text-slate-500">SKU: ${p.sku}</span>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              <div class="lg:col-span-7 space-y-4">
                <div class="h-72 sm:h-96 w-full rounded-3xl overflow-hidden glass border border-white/10 relative">
                  <img id="mainDetailImage" src="${mainImage}" class="w-full h-full object-cover">
                  ${p.discount_percentage > 0 ? `
                    <span class="absolute top-4 left-4 px-3 py-1.5 rounded-full bg-rose-500 text-white font-black text-xs uppercase shadow-xl">
                      ${p.discount_percentage}% OFF
                    </span>
                  ` : ''}
                </div>

                ${p.images && p.images.length > 1 ? `
                  <div class="flex gap-3 overflow-x-auto pb-2">
                    ${p.images.map((img) => `
                      <img onclick="document.getElementById('mainDetailImage').src = '${img}'" src="${img}" class="w-20 h-20 rounded-2xl object-cover glass cursor-pointer border border-white/10 hover:border-emerald-400 transition-all">
                    `).join('')}
                  </div>
                ` : ''}
              </div>

              <div class="lg:col-span-5 space-y-6">
                <div class="space-y-2">
                  <span class="px-3 py-1 rounded-full bg-surface-900 border border-white/10 text-emerald-400 font-bold text-[10px] uppercase tracking-wider inline-block">
                    ${p.delivery_type.replace('_', ' ')}
                  </span>
                  <h1 class="text-2xl sm:text-3xl font-black text-white leading-snug">${p.name}</h1>
                  <p class="text-xs sm:text-sm text-slate-400 leading-relaxed">${p.short_description || ''}</p>
                </div>

                <div class="p-5 rounded-3xl glass border border-white/5 space-y-2">
                  <div class="flex items-center gap-3">
                    <span class="text-3xl font-black text-white">₹${p.sale_price}</span>
                    ${p.original_price > p.sale_price ? `<span class="text-sm text-slate-500 line-through">₹${p.original_price}</span>` : ''}
                  </div>
                  <div class="flex items-center justify-between text-xs pt-1">
                    <span class="${p.in_stock ? 'text-emerald-400' : 'text-rose-400'} font-bold">
                      ${p.in_stock ? `● ${p.stock_count} licenses ready for instant delivery` : '✕ Currently Out of Stock'}
                    </span>
                  </div>
                </div>

                <div class="space-y-3">
                  <button onclick="buyNow('${p._id}', '${p.name.replace(/'/g, "\\'")}', ${p.sale_price}, '${mainImage}', '${p.delivery_type}')" ${!p.in_stock ? 'disabled' : ''} class="w-full py-4 rounded-2xl ${p.in_stock ? 'bg-emerald-500 hover:bg-emerald-400 text-gray-950' : 'bg-gray-800 text-gray-500'} font-black text-xs uppercase tracking-wider shadow-xl shadow-emerald-500/20 active:scale-95 transition-all">
                    ${p.in_stock ? '⚡ Buy Now & Unlock Instantly' : 'Out of Stock'}
                  </button>
                  <button onclick="addToCart('${p._id}', '${p.name.replace(/'/g, "\\'")}', ${p.sale_price}, '${mainImage}', '${p.delivery_type}')" ${!p.in_stock ? 'disabled' : ''} class="w-full py-4 rounded-2xl glass hover:bg-white/10 text-white font-bold text-xs uppercase tracking-wider active:scale-95 transition-all">
                    Add To Cart
                  </button>
                </div>

                <div class="grid grid-cols-2 gap-3 text-[11px] text-slate-400 pt-2">
                  <div class="flex items-center gap-2"><span>🛡️</span> <span>Verified Product</span></div>
                  <div class="flex items-center gap-2"><span>⚡</span> <span>Instant Cloud Access</span></div>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
              <div class="lg:col-span-8 space-y-8">
                <div class="glass rounded-3xl p-6 sm:p-8 space-y-4">
                  <h3 class="text-sm font-black text-white uppercase tracking-wider">Product Overview</h3>
                  <div class="text-xs text-slate-300 leading-relaxed whitespace-pre-line">${p.description}</div>
                </div>

                ${p.features && p.features.length ? `
                  <div class="glass rounded-3xl p-6 sm:p-8 space-y-4">
                    <h3 class="text-sm font-black text-white uppercase tracking-wider">Key Features</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      ${p.features.map(f => `
                        <div class="flex items-center gap-3 p-3 rounded-2xl bg-surface-950 text-xs text-slate-300">
                          <span class="text-emerald-400 font-black">✓</span> <span>${f}</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}

                ${p.whats_included && p.whats_included.length ? `
                  <div class="glass rounded-3xl p-6 sm:p-8 space-y-4">
                    <h3 class="text-sm font-black text-white uppercase tracking-wider">What's Included</h3>
                    <div class="space-y-2">
                      ${p.whats_included.map(item => `
                        <div class="p-3 rounded-2xl bg-surface-950 text-xs text-slate-300 flex items-center gap-3">
                          <span class="text-emerald-400">📦</span> <span>${item}</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}
              </div>

              <div class="lg:col-span-4 space-y-6">
                ${p.specifications && p.specifications.length ? `
                  <div class="glass rounded-3xl p-6 space-y-4">
                    <h3 class="text-sm font-black text-white uppercase tracking-wider">Product Specifications</h3>
                    <div class="overflow-x-auto">
                      <table class="w-full text-left text-xs">
                        <tbody class="divide-y divide-white/5">
                          ${p.specifications.map(s => `
                            <tr>
                              <td class="py-2.5 text-slate-400 font-medium">${s.label}</td>
                              <td class="py-2.5 text-white font-bold text-right">${s.value}</td>
                            </tr>
                          `).join('')}
                        </tbody>
                      </table>
                    </div>
                  </div>
                ` : ''}

                ${p.faqs && p.faqs.length ? `
                  <div class="glass rounded-3xl p-6 space-y-4">
                    <h3 class="text-sm font-black text-white uppercase tracking-wider">Frequently Asked Questions</h3>
                    <div class="space-y-3 text-xs">
                      ${p.faqs.map(faq => `
                        <div class="p-3 rounded-2xl bg-surface-950 space-y-1">
                          <h4 class="font-bold text-white">${faq.question}</h4>
                          <p class="text-slate-400 leading-relaxed">${faq.answer}</p>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        root.innerHTML = `<div class="glass p-8 text-center text-rose-400 text-xs">${err.message}</div>`;
      }
    }

    function buyNow(id, name, price, image, delivery_type) {
      addToCart(id, name, price, image, delivery_type);
      navigate('checkout');
    }

    async function renderProductsView(root, filters = {}) {
      let queryUrl = '/api/products?';
      if (filters.search) queryUrl += `search=${encodeURIComponent(filters.search)}&`;

      const res = await fetch(queryUrl);
      const products = await res.json();

      root.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h1 class="text-xl font-black text-white">${filters.title || 'All Digital Products'}</h1>
              <p class="text-xs text-slate-400">${products.length} products available</p>
            </div>
          </div>
          ${products.length === 0 ? `<div class="glass rounded-3xl p-16 text-center text-xs text-slate-400">No products found.</div>` : `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              ${products.map(p => renderProductCardHTML(p)).join('')}

    function calculateDiscountPreview() {
      const orig = Number(document.getElementById('edOrigPrice').value) || 0;
      const sale = Number(document.getElementById('edSalePrice').value) || 0;
      const disc = orig > 0 ? Math.round(((orig - sale) / orig) * 100) : 0;
      document.getElementById('edDiscountBadge').textContent = `${disc}% OFF`;
    }

    async function saveProductChanges(e, productId) {
      e.preventDefault();
      const isNew = productId === 'new';

      const payload = {
        name: document.getElementById('edName').value,
        short_description: document.getElementById('edShortDesc').value,
        description: document.getElementById('edDesc').value,
        category: 'Digital Goods',
        sku: document.getElementById('edSku').value,
        status: document.getElementById('edStatus').value,
        original_price: Number(document.getElementById('edOrigPrice').value),
        sale_price: Number(document.getElementById('edSalePrice').value),
        delivery_type: document.getElementById('edDeliveryType').value,
        images: document.getElementById('edImages').value.split(',').map(s => s.trim()).filter(Boolean),
        features: document.getElementById('edFeatures').value.split('\n').map(s => s.trim()).filter(Boolean),
        whats_included: document.getElementById('edIncluded').value.split('\n').map(s => s.trim()).filter(Boolean)
      };

      try {
        const url = isNew ? '/api/admin/products' : `/api/admin/products/${productId}`;
        const method = isNew ? 'POST' : 'PUT';

        const res = await fetch(url, {
          method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.adminToken}`
          },
          body: JSON.stringify(payload)
        });
        const saved = await res.json();
        if (!res.ok) throw new Error(saved.error);

        showToast('Product successfully saved!');
        navigate('product-details', { id: saved._id });
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function duplicateProduct(id) {
      try {
        const res = await fetch(`/api/admin/products/${id}/duplicate`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${state.adminToken}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showToast('Product cloned as Draft!');
        renderAdminDashboard(document.getElementById('appRoot'));
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Permanently delete this product and associated inventory?')) return;
      try {
        await fetch(`/api/admin/products/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${state.adminToken}` }
        });
        showToast('Product deleted');
        renderAdminDashboard(document.getElementById('appRoot'));
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function renderAddInventoryModal(productId, productName, deliveryType) {
      const modal = document.getElementById('productModal');
      const container = document.getElementById('productModalContent');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      let fields = '';
      if (deliveryType === 'EMAIL_PASSWORD') {
        fields = `
          <input type="email" id="invEmail" required placeholder="Account Email" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-white">
          <input type="text" id="invPassword" required placeholder="Account Password" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-white">
        `;
      } else if (deliveryType === 'LICENSE_KEY') {
        fields = `
          <input type="text" id="invKey" required placeholder="Activation License Key" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-white">
        `;
      } else {
        fields = `
          <input type="url" id="invUrl" required placeholder="Product Access URL" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-white">
        `;
      }

      container.innerHTML = `
        <button onclick="document.getElementById('productModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400">✕</button>
        <h2 class="text-base font-black text-white mb-2">Add Stock: ${productName}</h2>
        <p class="text-xs text-emerald-400 mb-4 font-mono">${deliveryType}</p>
        <form onsubmit="submitInventoryStock(event, '${productId}', '${deliveryType}')" class="space-y-3 text-xs">
          ${fields}
          <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-500 text-gray-950 font-black uppercase">Save Stock Unit</button>
        </form>
      `;
    }

    async function submitInventoryStock(e, productId, deliveryType) {
      e.preventDefault();
      const payload = { delivery_type: deliveryType };
      if (deliveryType === 'EMAIL_PASSWORD') {
        payload.email = document.getElementById('invEmail').value;
        payload.password = document.getElementById('invPassword').value;
      } else if (deliveryType === 'LICENSE_KEY') {
        payload.license_key = document.getElementById('invKey').value;
      } else {
        payload.delivery_url = document.getElementById('invUrl').value;
      }

      try {
        const res = await fetch(`/api/admin/inventory/${productId}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.adminToken}`
          },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error((await res.json()).error);
        showToast('Stock attached successfully!');
        document.getElementById('productModal').classList.add('hidden');
        renderAdminDashboard(document.getElementById('appRoot'));
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function addToCart(product_id, name, price, image, delivery_type) {
      const exists = state.cart.find(i => i.product_id === product_id);
      if (exists) return showToast('Item already in your cart', 'error');
      state.cart.push({ product_id, name, price, image, delivery_type });
      updateCartBadges();
      showToast(`Added "${name}" to cart`);
    }

    function removeFromCart(idx) {
      state.cart.splice(idx, 1);
      updateCartBadges();
      renderCartView(document.getElementById('appRoot'));

    async function applyCheckoutCoupon() {
      const code = document.getElementById('couponInput').value.trim();
      const subtotal = state.cart.reduce((a, b) => a + b.price, 0);
      try {
        const res = await fetch('/api/cart/validate-coupon', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, subtotal })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        state.appliedCoupon = data;
        document.getElementById('couponStatus').innerHTML = `<span class="text-emerald-400 font-bold">✓ Coupon Applied! Discount: ₹${data.discount_amount}</span>`;
        document.getElementById('summaryFinalTotal').textContent = `₹${data.final_total}`;
      } catch (err) {
        document.getElementById('couponStatus').innerHTML = `<span class="text-rose-400 font-bold">✕ ${err.message}</span>`;
      }
    }

    async function executeOrder() {
      const btn = document.getElementById('payOrderBtn');
      btn.disabled = true;
      btn.textContent = 'Processing transaction...';
      try {
        const res = await fetch('/api/checkout/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
          body: JSON.stringify({ items: state.cart, coupon_code: state.appliedCoupon ? state.appliedCoupon.code : '' })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        state.cart = [];
        state.appliedCoupon = null;
        updateCartBadges();
        showToast('Purchase completed!');
        navigate('orders');
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Confirm & Unlock Assets';
        showToast(err.message, 'error');
      }
    }

                    <div class="flex justify-between text-xs text-slate-400"><span>Order #${o._id.slice(-6).toUpperCase()}</span> <span class="text-emerald-400 font-bold">PAID ₹${o.total_amount}</span></div>
                    <div class="space-y-2">
                      ${o.items.map(item => `
                        <div class="p-4 rounded-2xl bg-surface-950 border border-white/5 space-y-2">
                          <h4 class="text-xs font-bold text-white">${item.name}</h4>
                          ${renderDeliveryPayloadHTML(item)}
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        `;
      } catch (err) {
        root.innerHTML = `<div class="glass p-8 text-center text-rose-400 text-xs">${err.message}</div>`;
      }
    }

    function renderDeliveryPayloadHTML(item) {
      const d = item.delivered_data || {};
      if (item.delivery_type === 'EMAIL_PASSWORD') {
        return `<div class="p-3 rounded-xl bg-surface-900 text-xs font-mono text-white flex justify-between"><span>Email: ${d.email} | Pass: ${d.password}</span> <button onclick="navigator.clipboard.writeText('${d.email} : ${d.password}'); showToast('Copied!')" class="text-emerald-400">Copy</button></div>`;
      } else if (item.delivery_type === 'LICENSE_KEY') {
        return `<div class="p-3 rounded-xl bg-surface-900 text-xs font-mono text-emerald-400 flex justify-between"><span>Key: ${d.license_key}</span> <button onclick="navigator.clipboard.writeText('${d.license_key}'); showToast('Key copied!')" class="text-emerald-400 font-bold">Copy Key</button></div>`;
      } else if (item.delivery_type === 'STANDARD_LINK') {
        return `<a href="${d.url}" target="_blank" class="inline-block px-4 py-2 rounded-xl bg-emerald-500 text-gray-950 font-bold text-xs">Open Product URL ↗</a>`;
      }
      return `<div class="text-xs text-slate-300">${d.custom_text || ''}</div>`;
    }

    function renderCustomerAuthModal(root, returnView = 'home') {
      root.innerHTML = `
        <div class="max-w-md mx-auto glass rounded-3xl p-8 space-y-4">
          <h2 class="text-lg font-black text-white text-center">Customer Account</h2>
          <form onsubmit="handleCustomerLogin(event, '${returnView}')" class="space-y-3">
            <input type="email" id="loginEmail" required placeholder="Email" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-xs text-white">
            <input type="password" id="loginPass" required placeholder="Password" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-xs text-white">
            <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-500 text-gray-950 font-black text-xs uppercase">Sign In</button>
          </form>
          <hr class="border-white/5">
          <form onsubmit="handleCustomerRegister(event, '${returnView}')" class="space-y-3">
            <input type="text" id="regName" required placeholder="Full Name" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-xs text-white">
            <input type="email" id="regEmail" required placeholder="Email" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-xs text-white">
            <input type="password" id="regPass" required placeholder="Password" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-xs text-white">
            <button type="submit" class="w-full py-3.5 rounded-xl bg-white/10 text-white font-black text-xs uppercase">Create Account</button>
          </form>
        </div>
      `;
    }

    async function handleCustomerLogin(e, returnView) {
      e.preventDefault();
      try {
        const res = await fetch('/api/auth/customer/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('loginEmail').value, password: document.getElementById('loginPass').value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        state.token = data.token;
        state.user = data.user;
        localStorage.setItem('nexus_token', data.token);
        localStorage.setItem('nexus_user', JSON.stringify(data.user));
        document.getElementById('navAccountLabel').textContent = data.user.name;
        showToast('Logged in!');
        navigate(returnView);
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function handleCustomerRegister(e, returnView) {
      e.preventDefault();
      try {
        const res = await fetch('/api/auth/customer/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: document.getElementById('regName').value, email: document.getElementById('regEmail').value, password: document.getElementById('regPass').value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        state.token = data.token;
        state.user = data.user;
        localStorage.setItem('nexus_token', data.token);
        localStorage.setItem('nexus_user', JSON.stringify(data.user));
        document.getElementById('navAccountLabel').textContent = data.user.name;
        showToast('Account registered!');
        navigate(returnView);
      } catch (err) { showToast(err.message, 'error'); }
    }

    function renderAccountView(root) {
      if (!state.token) return renderCustomerAuthModal(root, 'account');
      root.innerHTML = `
        <div class="max-w-2xl mx-auto glass rounded-3xl p-8 space-y-4">
          <div class="flex justify-between items-center">
            <h1 class="text-xl font-black text-white">${state.user.name}</h1>
            <button onclick="customerLogout()" class="px-4 py-2 rounded-xl bg-rose-500/10 text-rose-400 text-xs font-bold">Logout</button>
          </div>
          <p class="text-xs text-slate-400 font-mono">${state.user.email}</p>
        </div>
      `;
    }

    function customerLogout() {
      state.token = '';
      state.user = null;
      localStorage.removeItem('nexus_token');
      localStorage.removeItem('nexus_user');
      document.getElementById('navAccountLabel').textContent = 'My Account';
      navigate('home');
    }

    function renderAdminLoginView(root) {
      root.innerHTML = `
        <div class="max-w-sm mx-auto glass rounded-3xl p-8 space-y-4 border border-emerald-500/20">
          <h2 class="text-lg font-black text-white text-center">Admin Console</h2>
          <form onsubmit="handleAdminLogin(event)" class="space-y-3">
            <input type="text" id="adminUserInput" placeholder="Username (Aryan)" required class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-xs text-white">
            <input type="password" id="adminPassInput" placeholder="Password (5669)" required class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-xs text-white">
            <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-500 text-gray-950 font-black text-xs uppercase">Authenticate</button>
          </form>
        </div>
      `;
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('adminUserInput').value, password: document.getElementById('adminPassInput').value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        state.adminToken = data.token;
        state.adminUsername = data.username;
        localStorage.setItem('nexus_admin_token', data.token);
        localStorage.setItem('nexus_admin_user', data.username);
        showToast('Admin Authenticated');
        renderAdminDashboard(document.getElementById('appRoot'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    function adminLogout() {
      state.adminToken = '';
      state.adminUsername = '';
      localStorage.removeItem('nexus_admin_token');
      localStorage.removeItem('nexus_admin_user');
      navigate('home');
    }

    function handleGlobalSearch(val) {
      if (!val.trim()) return renderProductsView(document.getElementById('appRoot'));
      navigate('products', { search: val, title: `Search results for "${val}"` });
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateCartBadges();
      if (state.user) document.getElementById('navAccountLabel').textContent = state.user.name;
      navigate('home');
    });
  </script>
</body>
</html>
