<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS DIGITAL — Digital Goods & Subscriptions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: { 500: '#10b981', 600: '#059669' },
            surface: { 800: '#111827', 900: '#0b0f19', 950: '#030712' },
            admin: { sidebar: '#090d16', bg: '#05070d', card: '#0f1422', border: '#1c2438' }
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
    .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: linear-gradient(135deg, rgba(31, 41, 55, 0.45) 0%, rgba(17, 24, 39, 0.6) 100%); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); transition: all 0.25s; }
    .glass-card:hover { border-color: rgba(16, 185, 129, 0.4); transform: translateY(-4px); }
    .admin-card { background-color: #0f1422; border: 1px solid #1c2438; }
    .auth-glow { box-shadow: 0 0 50px -10px rgba(16, 185, 129, 0.15); }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <div id="toastHub" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
  <div id="appBackdrop" onclick="closeAllDrawers()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden transition-opacity duration-200"></div>
  <div id="mainViewport" class="flex flex-1 min-h-screen"></div>

  <div id="globalModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass max-w-4xl w-full rounded-3xl p-6 relative max-h-[90vh] overflow-y-auto custom-scroll" id="globalModalContent"></div>
  </div>

  <script>
    const state = {
      sessionId: 'sess_' + Math.random().toString(36).substring(2, 12),
      user: JSON.parse(localStorage.getItem('nexus_user') || 'null'),
      token: localStorage.getItem('nexus_token') || '',
      adminToken: localStorage.getItem('nexus_admin_token') || '',
      adminUsername: localStorage.getItem('nexus_admin_user') || '',
      cart: JSON.parse(localStorage.getItem('nexus_cart') || '[]'),
      currentView: 'home',
      adminSection: 'products',
      authScreen: 'register',
      loadedProducts: []
    };

    const SVG_EYE = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const SVG_EYE_OFF = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`;
    const SVG_SPINNER = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 inline-block text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;

    function showToast(message, type = 'success') {
      const hub = document.getElementById('toastHub');
      const toast = document.createElement('div');
      const colors = type === 'success' ? 'bg-emerald-500 text-gray-950' : 'bg-rose-500 text-white';
      toast.className = `px-5 py-3 rounded-2xl font-bold text-xs shadow-2xl flex items-center gap-2 transform transition-all duration-300 opacity-0 ${colors}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span> <span>${message}</span>`;
      hub.appendChild(toast);
      setTimeout(() => toast.classList.remove('opacity-0'), 10);
      setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3200);
    }

    async function fetchJSON(url, options = {}) {
      try {
        const res = await fetch(url, options);
        if (res.status === 401 || res.status === 403) {
          if (url.includes('/api/admin/')) adminSignOut();
          throw new Error('Session expired or unauthorized');
        }
        const contentType = res.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) throw new Error('Service synchronizing.');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
        return data;
      } catch (err) { throw err; }
    }

    function closeAllDrawers() {
      document.getElementById('appBackdrop').classList.add('hidden');
      const cSide = document.getElementById('customerSidebar');
      if (cSide) cSide.classList.add('-translate-x-full');
      const aSide = document.getElementById('adminSidebar');
      if (aSide) aSide.classList.add('-translate-x-full');
      document.getElementById('globalModal').classList.add('hidden');
    }

    function toggleCustomerDrawer(open) {
      const side = document.getElementById('customerSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) { side.classList.remove('-translate-x-full'); drop.classList.remove('hidden'); }
      else { side.classList.add('-translate-x-full'); drop.classList.add('hidden'); }
    }

    function toggleAdminDrawer(open) {
      const side = document.getElementById('adminSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) { side.classList.remove('-translate-x-full'); drop.classList.remove('hidden'); }
      else { side.classList.add('-translate-x-full'); drop.classList.add('hidden'); }
    }

    function navigate(view, params = {}) {
      state.currentView = view;
      closeAllDrawers();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const viewport = document.getElementById('mainViewport');
      if (view === 'admin-center') {
        if (!state.adminToken) renderAdminLogin(viewport);
        else renderAdminSaaSLayout(viewport);
        return;
      }
      renderStorefrontLayout(viewport, view, params);
    }

    // =========================================================================
    // STOREFRONT LAYOUT & CATALOG
    // =========================================================================
    function renderStorefrontLayout(viewport, view, params) {
      viewport.innerHTML = `
        <div class="flex flex-1 min-h-screen relative w-full bg-surface-950">
          <aside id="customerSidebar" class="fixed lg:static top-0 bottom-0 left-0 w-64 bg-surface-900 border-r border-white/5 z-50 flex flex-col justify-between transition-transform duration-300 -translate-x-full lg:translate-x-0">
            <div>
              <div class="p-6 border-b border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
                  <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center font-black text-gray-950">N</div>
                  <div><span class="font-extrabold text-sm text-white block">NEXUS</span><span class="text-[10px] font-bold text-emerald-400">DIGITAL VAULT</span></div>
                </div>
                <button onclick="toggleCustomerDrawer(false)" class="lg:hidden text-slate-400">✕</button>
              </div>
              <nav class="p-4 space-y-1.5 text-xs font-semibold">
                <button onclick="navigate('home')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>🏠</span> Home</button>
                <button onclick="navigate('products')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>🛍</span> All Products</button>
                <button onclick="navigate('orders')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>📦</span> Purchased Items</button>
                <button onclick="navigate('account')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>👤</span> Account</button>
              </nav>
            </div>
            <div class="p-4 border-t border-white/5">
              <button onclick="navigate('admin-center')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold text-slate-400 bg-white/[0.03] hover:text-emerald-400 border border-white/5">🔐 Admin Panel</button>
            </div>
          </aside>
          <div class="flex-1 flex flex-col min-w-0">
            <header class="sticky top-0 z-30 glass border-b border-white/5 px-4 sm:px-8 py-3.5 flex items-center justify-between">
              <button onclick="toggleCustomerDrawer(true)" class="lg:hidden p-2 rounded-xl bg-white/5 text-slate-300">☰</button>
              <div class="text-xs font-bold text-white">NEXUS DIGITAL STOREFRONT</div>
            </header>
            <main id="storeContent" class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto space-y-8"></main>
          </div>
        </div>
      `;
      const storeContent = document.getElementById('storeContent');
      if (view === 'home' || view === 'products') renderStoreProducts(storeContent, params);
      else if (view === 'product-details') renderStoreProductDetails(storeContent, params.id);
      else if (view === 'orders') renderStoreOrders(storeContent);
      else if (view === 'account') renderStoreAccount(storeContent);
    }

    async function renderStoreProducts(container) {
      const data = await fetchJSON('/api/products');
      container.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          ${data.map(p => `
            <div class="glass-card rounded-3xl overflow-hidden cursor-pointer p-5 space-y-3" onclick="navigate('product-details', { id: '${p._id}' })">
              <img src="${p.images?.[0] || 'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=500'}" class="w-full h-40 object-cover rounded-2xl">
              <h3 class="text-white font-bold">${p.name}</h3>
              <div class="flex justify-between items-center"><span class="text-emerald-400 font-black">₹${p.sale_price}</span><span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full">${p.product_type}</span></div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function renderStoreProductDetails(container, id) {
      const p = await fetchJSON(`/api/products/${id}`);
      container.innerHTML = `
        <div class="max-w-xl mx-auto glass rounded-3xl p-8 space-y-6">
          <button onclick="navigate('products')" class="text-xs text-slate-400">← Back</button>
          <h1 class="text-2xl font-black text-white">${p.name}</h1>
          <p class="text-xs text-slate-300">${p.description}</p>
          <div class="text-3xl font-black text-emerald-400">₹${p.sale_price}</div>
          <button onclick="showToast('Added to cart!')" class="w-full py-4 bg-emerald-500 text-gray-950 font-black rounded-2xl uppercase">Buy Now</button>
        </div>
      `;
    }

    async function renderStoreOrders(container) {
      if (!state.token) return renderCustomerAuthPrompt(container, 'orders');
      const orders = await fetchJSON('/api/customer/orders', { headers: { 'Authorization': `Bearer ${state.token}` } });
      container.innerHTML = `<div class="space-y-4"><h1 class="text-xl font-black text-white">Purchased Items</h1>${orders.map(o => `<div class="glass p-4 rounded-2xl text-white font-mono text-xs">${o.order_number} - ₹${o.total_amount}</div>`).join('')}</div>`;
    }

    function renderStoreAccount(container) {
      if (!state.token) return renderCustomerAuthPrompt(container, 'account');
      container.innerHTML = `<div class="glass p-8 rounded-3xl max-w-md mx-auto text-center space-y-4"><h1 class="text-xl font-black text-white">@${state.user.username}</h1><button onclick="customerLogout()" class="px-4 py-2 bg-rose-500/20 text-rose-400 rounded-xl font-bold text-xs">Logout</button></div>`;
    }

    function customerLogout() {
      localStorage.removeItem('nexus_token'); localStorage.removeItem('nexus_user');
      state.token = ''; state.user = null; navigate('home'); showToast('Logged out');
    }

    function renderCustomerAuthPrompt(container, returnView) {
      container.innerHTML = `<div class="glass max-w-md mx-auto p-8 rounded-3xl text-center text-white text-xs">Customer authentication portal active. Please login via storefront.</div>`;
    }

    // =========================================================================
    // ADMIN SAAS CONTROL CENTER & REDESIGNED PRODUCT STUDIO
    // =========================================================================
    function renderAdminLogin(viewport) {
      viewport.innerHTML = `
        <div class="min-h-screen w-full bg-admin-bg flex items-center justify-center p-4">
          <div class="admin-card max-w-md w-full rounded-3xl p-8 space-y-6 shadow-2xl border border-admin-border">
            <div class="text-center space-y-1">
              <h2 class="text-xl font-black text-white tracking-wider font-sans">NEXUS CONTROL CENTER</h2>
              <p class="text-xs text-slate-400">Admin Authorization Portal</p>
            </div>
            <form onsubmit="handleAdminAuth(event)" class="space-y-4">
              <input type="text" id="admUser" required placeholder="Username (Aryan)" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-xs text-white outline-none focus:border-emerald-500 font-mono">
              <input type="password" id="admPass" required placeholder="Password (5669)" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-xs text-white outline-none focus:border-emerald-500 font-mono">
              <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-500 text-gray-950 font-black text-xs uppercase tracking-wider font-sans">Authorize Session</button>
            </form>
          </div>
        </div>
      `;
    }

    async function handleAdminAuth(e) {
      e.preventDefault();
      try {
        const data = await fetchJSON('/api/admin/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('admUser').value, password: document.getElementById('admPass').value })
        });
        state.adminToken = data.token; state.adminUsername = data.username;
        localStorage.setItem('nexus_admin_token', data.token); localStorage.setItem('nexus_admin_user', data.username);
        showToast('Admin Authorized'); navigate('admin-center');
      } catch (err) { showToast(err.message, 'error'); }
    }

    function renderAdminSaaSLayout(viewport) {
      viewport.innerHTML = `
        <div class="flex flex-1 min-h-screen w-full bg-admin-bg font-sans text-slate-200 relative">
          <aside id="adminSidebar" class="fixed lg:static top-0 bottom-0 left-0 w-64 bg-admin-sidebar border-r border-admin-border flex flex-col justify-between z-50 transition-transform duration-300 -translate-x-full lg:translate-x-0">
            <div>
              <div class="p-6 border-b border-admin-border flex items-center justify-between">
                <div><span class="text-xs font-black text-emerald-400 uppercase tracking-widest block font-mono">NEXUS CONTROL</span><span class="text-sm font-bold text-white">Admin Hub</span></div>
                <button onclick="toggleAdminDrawer(false)" class="lg:hidden text-slate-400">✕</button>
              </div>
              <nav class="p-4 space-y-1 text-xs font-bold font-mono">
                <button onclick="switchAdminSection('dashboard')" id="adnav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">📊 Overview Dashboard</button>
                <button onclick="switchAdminSection('products')" id="adnav-products" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">📦 Product Studio</button>
                <button onclick="switchAdminSection('slots')" id="adnav-slots" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">🔐 Account Slots</button>
                <button onclick="switchAdminSection('subscriptions')" id="adnav-subscriptions" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">👥 Subscriptions Suite</button>
                <button onclick="switchAdminSection('transactions')" id="adnav-transactions" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">💳 Transactions</button>
                <button onclick="switchAdminSection('customers')" id="adnav-customers" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">👤 Customers</button>
                <button onclick="switchAdminSection('payment-settings')" id="adnav-payment-settings" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">💰 Payment Gateway</button>
                <button onclick="switchAdminSection('system-monitor')" id="adnav-system-monitor" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">🌐 Website Status</button>
              </nav>
            </div>
            <div class="p-4 border-t border-admin-border space-y-2">
              <button onclick="navigate('home')" class="w-full py-2.5 rounded-xl bg-white/5 text-slate-400 hover:text-white text-xs font-bold">👁 Customer Store</button>
              <button onclick="adminSignOut()" class="w-full py-2.5 rounded-xl bg-rose-500/10 text-rose-400 text-xs font-bold">🚪 End Session</button>
            </div>
          </aside>
          <div class="flex-1 flex flex-col min-w-0">
            <header class="h-16 border-b border-admin-border bg-admin-sidebar/50 px-4 sm:px-8 flex items-center justify-between">
              <button onclick="toggleAdminDrawer(true)" class="lg:hidden p-2 rounded-xl bg-white/5 text-slate-300">☰</button>
              <span class="text-xs text-slate-400 font-mono">Admin: ${state.adminUsername}</span>
            </header>
            <main id="adminMainContent" class="flex-1 p-4 sm:p-8 space-y-8 max-w-7xl w-full mx-auto"></main>
          </div>
        </div>
      `;
      switchAdminSection(state.adminSection || 'products');
    }

    function switchAdminSection(sec) {
      state.adminSection = sec; closeAllDrawers();
      const content = document.getElementById('adminMainContent');
      if (!content) return;
      document.querySelectorAll('[id^="adnav-"]').forEach(b => b.classList.remove('bg-emerald-500/10', 'text-emerald-400'));
      const active = document.getElementById(`adnav-${sec}`);
      if (active) active.classList.add('bg-emerald-500/10', 'text-emerald-400');

      if (sec === 'products') renderAdminProductsStudio(content);
      else if (sec === 'dashboard') renderAdminOverview(content);
      else if (sec === 'slots') renderAdminAccountSlots(content);
      else if (sec === 'subscriptions') renderAdminSubscriptions(content);
      else if (sec === 'transactions') renderAdminTransactions(content);
      else if (sec === 'customers') renderAdminCustomers(content);
      else if (sec === 'payment-settings') renderAdminPaymentSettings(content);
      else if (sec === 'system-monitor') renderAdminSystemMonitor(content);
    }

    async function safeFetchAdminProducts() {
      try {
        const data = await fetchJSON('/api/admin/products', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        return Array.isArray(data) ? data : [];
      } catch (e) { return []; }
    }

    // =========================================================================
    // REDESIGNED PRODUCT STUDIO (CLEAN 2-COLUMN DESKTOP / MOBILE RESPONSIVE)
    // =========================================================================
    async function renderAdminProductsStudio(container) {
      container.innerHTML = '<div class="text-center py-16 text-slate-500 font-mono animate-pulse">Loading Product Studio...</div>';
      try {
        const products = await safeFetchAdminProducts();
        const publishedCount = products.filter(p => p.status === 'active').length;
        const draftCount = products.filter(p => p.status === 'draft').length;
        const outOfStockCount = products.filter(p => p.status === 'out_of_stock').length;

        container.innerHTML = `
          <div class="space-y-8 font-mono text-xs pb-12">
            <!-- Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h1 class="text-2xl font-black text-white font-sans tracking-tight">Product Studio</h1>
                <p class="text-slate-400 mt-0.5">Manage your products, pricing, availability and digital delivery.</p>
              </div>
              <button onclick="openProductStudioModal('new')" class="px-5 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-black text-xs uppercase tracking-wider font-sans shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
                + Add Product
              </button>
            </div>

            <!-- Summary Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div class="admin-card p-5 rounded-3xl space-y-1"><span class="text-slate-400 block text-[10px] uppercase font-bold">Total Products</span><div class="text-2xl font-black text-white">${products.length}</div></div>
              <div class="admin-card p-5 rounded-3xl space-y-1"><span class="text-slate-400 block text-[10px] uppercase font-bold">Published</span><div class="text-2xl font-black text-emerald-400">${publishedCount}</div></div>
              <div class="admin-card p-5 rounded-3xl space-y-1"><span class="text-slate-400 block text-[10px] uppercase font-bold">Drafts</span><div class="text-2xl font-black text-amber-400">${draftCount}</div></div>
              <div class="admin-card p-5 rounded-3xl space-y-1"><span class="text-slate-400 block text-[10px] uppercase font-bold">Out of Stock</span><div class="text-2xl font-black text-rose-400">${outOfStockCount}</div></div>
            </div>

            <!-- Search Bar -->
            <div class="admin-card rounded-2xl p-4 flex gap-3 items-center">
              <input type="text" oninput="filterProductStudioTable(this.value)" placeholder="Search products by name, SKU, or category..." class="w-full px-4 py-2.5 rounded-xl bg-surface-950 border border-admin-border text-white placeholder-slate-500 outline-none focus:border-emerald-500">
            </div>

            <!-- Products List / Table -->
            <div class="admin-card rounded-3xl p-6">
              <div class="overflow-x-auto">
                <table class="w-full text-left min-w-[850px]" id="productStudioTable">
                  <thead>
                    <tr class="border-b border-admin-border text-slate-500">
                      <th class="pb-3">Product</th>
                      <th class="pb-3">Category</th>
                      <th class="pb-3">Price</th>
                      <th class="pb-3">Stock / Availability</th>
                      <th class="pb-3">Status</th>
                      <th class="pb-3 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-admin-border font-sans">
                    ${products.length === 0 ? `
                      <tr><td colspan="6" class="py-12 text-center text-slate-500">No products yet. Click "+ Add Product" to create one.</td></tr>
                    ` : products.map(p => `
                      <tr class="hover:bg-white/[0.02] transition-colors">
                        <td class="py-4 flex items-center gap-3">
                          <img src="${p.images?.[0] || 'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=200'}" class="w-12 h-12 rounded-xl object-cover border border-admin-border bg-black/40">
                          <div>
                            <span class="text-white font-bold block">${p.name}</span>
                            <span class="text-[10px] text-slate-500 font-mono">SKU: ${p.sku}</span>
                          </div>
                        </td>
                        <td class="py-4 text-slate-300">${p.category || 'Digital Good'}</td>
                        <td class="py-4">
                          <div class="flex items-center gap-2">
                            <span class="text-emerald-400 font-black">₹${p.sale_price}</span>
                            ${p.original_price > p.sale_price ? `<span class="text-xs text-slate-500 line-through">₹${p.original_price}</span>` : ''}
                          </div>
                          ${p.discount_percentage > 0 ? `<span class="text-[9px] text-rose-400 font-bold">${p.discount_percentage}% OFF</span>` : ''}
                        </td>
                        <td class="py-4">
                          <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${p.status === 'active' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">
                            ${p.status === 'active' ? '🟢 In Stock' : '🔴 Out of Stock'}
                          </span>
                        </td>
                        <td class="py-4">
                          <span class="text-xs font-semibold uppercase text-slate-300">${p.status}</span>
                        </td>
                        <td class="py-4 text-right space-x-2 font-mono">
                          <button onclick="openProductStudioModal('${p._id}')" class="px-3 py-1 rounded-lg bg-emerald-500/10 text-emerald-400 font-bold hover:bg-emerald-500/20">Edit</button>
                          <button onclick="duplicateAdminProduct('${p._id}')" class="px-3 py-1 rounded-lg bg-indigo-500/10 text-indigo-400 font-bold hover:bg-indigo-500/20">Duplicate</button>
                          <button onclick="deleteAdminProduct('${p._id}')" class="px-2 py-1 rounded-lg text-rose-400 hover:text-rose-300">✕</button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="admin-card p-8 text-center text-rose-400 text-xs font-mono">Error loading Product Studio: ${err.message}</div>`;
      }
    }

    function filterProductStudioTable(val) {
      const q = val.toLowerCase();
      document.querySelectorAll('#productStudioTable tbody tr').forEach(row => {
        if (row.textContent.toLowerCase().includes(q)) row.classList.remove('hidden');
        else row.classList.add('hidden');
      });
    }

    async function openProductStudioModal(productId) {
      const isNew = productId === 'new';
      const modal = document.getElementById('globalModal');
      const content = document.getElementById('globalModalContent');
      modal.classList.remove('hidden'); modal.classList.add('flex');

      let p = {
        name: '', short_description: '', description: '', category: 'Software & Digital Goods', sku: 'SKU-' + Date.now(),
        product_type: 'ONE_TIME', original_price: 999, sale_price: 499, discount_percentage: 50,
        subscription_pricing: { one_month: 199, six_months: 899, one_year: 1499 },
        images: ['https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800'],
        delivery_type: 'EMAIL_PASSWORD', status: 'active'
      };

      if (!isNew) {
        content.innerHTML = '<div class="text-center py-12 text-slate-400 font-mono">Loading product editor...</div>';
        p = await fetchJSON(`/api/products/${productId}`);
      }

      content.innerHTML = `
        <button onclick="document.getElementById('globalModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
        <div class="space-y-6 font-sans text-xs">
          <div>
            <h2 class="text-lg font-black text-white">${isNew ? 'Create New Product' : `Edit Product: ${p.name}`}</h2>
            <p class="text-slate-400 text-xs">Configure product details, pricing, inventory, and fulfillment.</p>
          </div>

          <form onsubmit="handleMasterProductSubmit(event, '${productId}')" class="space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              
              <!-- Left Column: Basics & Description -->
              <div class="space-y-4">
                <div class="p-5 rounded-2xl bg-surface-950 border border-admin-border space-y-3">
                  <span class="text-[11px] text-emerald-400 font-bold uppercase">1. Basic Information</span>
                  <div>
                    <label class="text-slate-400 block mb-1">Product Title</label>
                    <input type="text" id="studioName" required value="${p.name || ''}" placeholder="Product Title" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white font-bold">
                  </div>
                  <div>
                    <label class="text-slate-400 block mb-1">Short Tagline</label>
                    <input type="text" id="studioShortDesc" value="${p.short_description || ''}" placeholder="Short summary" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white">
                  </div>
                  <div>
                    <label class="text-slate-400 block mb-1">Category & SKU</label>
                    <div class="grid grid-cols-2 gap-2">
                      <input type="text" id="studioCategory" value="${p.category || 'Digital Goods'}" class="px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white">
                      <input type="text" id="studioSku" value="${p.sku || ''}" class="px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white font-mono">
                    </div>
                  </div>
                </div>

                <div class="p-5 rounded-2xl bg-surface-950 border border-admin-border space-y-3">
                  <span class="text-[11px] text-emerald-400 font-bold uppercase">2. Description</span>
                  <textarea id="studioFullDesc" rows="4" placeholder="Full product description..." class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white leading-relaxed">${p.description || ''}</textarea>
                </div>
              </div>

              <!-- Right Column: Pricing & Publishing -->
              <div class="space-y-4">
                <div class="p-5 rounded-2xl bg-surface-950 border border-admin-border space-y-3">
                  <span class="text-[11px] text-emerald-400 font-bold uppercase">3. Pricing & Type</span>
                  <div>
                    <label class="text-slate-400 block mb-1">Product Type</label>
                    <select id="studioProductType" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white font-bold">
                      <option value="ONE_TIME" ${p.product_type === 'ONE_TIME' ? 'selected' : ''}>One-Time Digital Product</option>
                      <option value="SUBSCRIPTION" ${p.product_type === 'SUBSCRIPTION' ? 'selected' : ''}>Subscription Product (1M / 6M / 1Y)</option>
                    </select>
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="text-slate-400 block mb-1">Real Price (₹)</label>
                      <input type="number" id="studioOrigPrice" value="${p.original_price || 999}" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white font-bold">
                    </div>
                    <div>
                      <label class="text-slate-400 block mb-1">Selling Price (₹)</label>
                      <input type="number" id="studioSalePrice" value="${p.sale_price || 499}" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-emerald-400 font-black">
                    </div>
                  </div>
                </div>

                <div class="p-5 rounded-2xl bg-surface-950 border border-admin-border space-y-3">
                  <span class="text-[11px] text-emerald-400 font-bold uppercase">4. Publishing Status</span>
                  <div>
                    <label class="text-slate-400 block mb-1">Status</label>
                    <select id="studioStatus" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-emerald-400 font-bold">
                      <option value="active" ${p.status === 'active' ? 'selected' : ''}>🟢 Published (In Stock)</option>
                      <option value="out_of_stock" ${p.status === 'out_of_stock' ? 'selected' : ''}>🔴 Out of Stock / Unavailable</option>
                      <option value="draft" ${p.status === 'draft' ? 'selected' : ''}>🟡 Draft</option>
                    </select>
                  </div>
                  <div>
                    <label class="text-slate-400 block mb-1">Product Image URL</label>
                    <input type="text" id="studioImage" value="${p.images?.[0] || ''}" placeholder="https://..." class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white font-mono text-[11px]">
                  </div>
                </div>
              </div>

            </div>

            <div class="pt-2">
              <button type="submit" class="w-full py-4 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-black text-xs uppercase tracking-wider font-sans shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
                ${isNew ? 'Create & Publish Product' : 'Save Changes to Database'}
              </button>
            </div>

          </form>
        </div>
      `;
    }

    async function handleMasterProductSubmit(e, productId) {
      e.preventDefault();
      const isNew = productId === 'new';
      const imageUrl = document.getElementById('studioImage').value.trim();

      const payload = {
        name: document.getElementById('studioName').value.trim(),
        short_description: document.getElementById('studioShortDesc').value.trim(),
        description: document.getElementById('studioFullDesc').value.trim(),
        category: document.getElementById('studioCategory').value.trim(),
        sku: document.getElementById('studioSku').value.trim(),
        product_type: document.getElementById('studioProductType').value,
        original_price: Number(document.getElementById('studioOrigPrice').value) || 999,
        sale_price: Number(document.getElementById('studioSalePrice').value) || 499,
        status: document.getElementById('studioStatus').value,
        images: imageUrl ? [imageUrl] : ['https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800']
      };

      try {
        await fetchJSON(isNew ? '/api/admin/products' : `/api/admin/products/${productId}`, {
          method: isNew ? 'POST' : 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.adminToken}` },
          body: JSON.stringify(payload)
        });
        showToast(isNew ? 'Product created successfully!' : 'Product updated successfully!');
        document.getElementById('globalModal').classList.add('hidden');
        renderAdminProductsStudio(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function duplicateAdminProduct(id) {
      try {
        await fetchJSON(`/api/admin/products/${id}/duplicate`, {
          method: 'POST', headers: { 'Authorization': `Bearer ${state.adminToken}` }
        });
        showToast('Product duplicated as draft!');
        renderAdminProductsStudio(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    // Other required admin view render stubs to maintain sidebar stability
    async function renderAdminAccountSlots(c) { c.innerHTML = '<div class="p-8 text-white font-mono text-xs">Account Slots Module Active.</div>'; }
    async function renderAdminSubscriptions(c) { c.innerHTML = '<div class="p-8 text-white font-mono text-xs">Subscriptions Suite Active.</div>'; }
    async function renderAdminTransactions(c) { c.innerHTML = '<div class="p-8 text-white font-mono text-xs">Transactions Queue Active.</div>'; }
    async function renderAdminCustomers(c) { c.innerHTML = '<div class="p-8 text-white font-mono text-xs">Customer Directory Active.</div>'; }
    async function renderAdminPaymentSettings(c) { c.innerHTML = '<div class="p-8 text-white font-mono text-xs">Payment Gateway Active.</div>'; }
    async function renderAdminSystemMonitor(c) { c.innerHTML = '<div class="p-8 text-white font-mono text-xs">Website Status Active.</div>'; }

    function adminSignOut() {
      state.adminToken = ''; state.adminUsername = '';
      localStorage.removeItem('nexus_admin_token'); localStorage.removeItem('nexus_admin_user');
      navigate('home');
    }

    document.addEventListener('DOMContentLoaded', () => { navigate('home'); });
  </script>
</body>
</html>
