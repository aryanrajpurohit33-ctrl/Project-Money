<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lofi Tokyo — Chill Beats</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #060913;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Ambient Soothing Japanese Lofi Animated GIF */
    .bg-gif {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.68) contrast(1.05);
      pointer-events: none;
    }

    /* Glass Bottom Audio Dock */
    .glass-dock {
      background: rgba(8, 14, 26, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7), inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Equalizer Bar Animation */
    .eq-bar {
      width: 3px;
      border-radius: 99px;
      background: #34d399;
      animation: bounceEQ 1.2s ease-in-out infinite alternate;
    }
    .eq-paused {
      animation-play-state: paused !important;
      height: 4px !important;
    }
    .bar-1 { height: 14px; animation-delay: 0.1s; }
    .bar-2 { height: 22px; animation-delay: 0.3s; }
    .bar-3 { height: 10px; animation-delay: 0.2s; }
    .bar-4 { height: 18px; animation-delay: 0.4s; }

    @keyframes bounceEQ {
      0% { height: 4px; }
      50% { height: 22px; }
      100% { height: 8px; }
    }
  </style>
</head>
<body class="h-[100dvh] w-full flex flex-col justify-between p-6 relative select-none">

  <!-- Relaxing Japanese Rainy Night Scene -->
  <img 
    class="bg-gif" 
    src="https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=1920&q=80" 
    id="bgVisual"
    alt="Tokyo Night View"
  />

  <!-- Subtle Film Vignette Overlay -->
  <div class="fixed inset-0 bg-gradient-to-t from-black/75 via-black/20 to-black/50 pointer-events-none z-[1]"></div>

  <!-- Top Status Bar -->
  <header class="relative z-10 flex items-center justify-between w-full max-w-4xl mx-auto">
    <div class="flex items-center gap-2.5">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-xs uppercase tracking-widest font-semibold text-white/80">Tokyo Night</span>
    </div>
    <div id="liveClock" class="text-xs font-mono font-medium text-white/70">--:--:--</div>
  </header>

  <!-- Center Minimalist Typography -->
  <main class="relative z-10 flex flex-col items-center justify-center text-center space-y-2">
    <h1 class="text-3xl sm:text-5xl font-extralight tracking-widest text-white/90 drop-shadow-md">
      東京 • 静けさ
    </h1>
    <p class="text-xs sm:text-sm font-light text-slate-300/80 tracking-wide max-w-xs sm:max-w-sm">
      Mellow ambient rhythms & late night Japanese rain.
    </p>
  </main>

  <!-- Bottom Floating Audio Dock -->
  <footer class="relative z-10 w-full max-w-sm mx-auto mb-2">
    <div class="glass-dock rounded-2xl p-4 flex items-center justify-between">
      
      <!-- Visualizer & Stream Status -->
      <div class="flex items-center gap-3">
        <div class="flex items-end gap-1 h-6 px-1">
          <span class="eq-bar bar-1 eq-paused" id="eq1"></span>
          <span class="eq-bar bar-2 eq-paused" id="eq2"></span>
          <span class="eq-bar bar-3 eq-paused" id="eq3"></span>
          <span class="eq-bar bar-4 eq-paused" id="eq4"></span>
        </div>

        <div>
          <div class="text-xs font-semibold text-white tracking-wide">Chill Lofi Radio</div>
          <div class="text-[11px] text-slate-400" id="playStatus">Paused • Click play</div>
        </div>
      </div>

      <!-- Play / Pause Controller -->
      <button 
        id="playBtn" 
        onclick="toggleAudio()" 
        class="w-10 h-10 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-gray-950 flex items-center justify-center transition-all shadow-lg shadow-emerald-500/25 focus:outline-none"
        aria-label="Toggle Chill Beats"
      >
        <svg id="playIcon" class="w-5 h-5 ml-0.5" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <svg id="pauseIcon" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
      </button>

    </div>
  </footer>

  <!-- 24/7 Ultra-Chill Low-Tempo Lofi Stream -->
  <audio id="chillAudio" preload="none" src="https://stream.zeno.fm/f3wvbbqmdg8uv"></audio>

  <script>
    const audio = document.getElementById('chillAudio');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const statusText = document.getElementById('playStatus');
    const eqBars = [
      document.getElementById('eq1'),
      document.getElementById('eq2'),
      document.getElementById('eq3'),
      document.getElementById('eq4')
    ];

    // Array of tranquil night visual loops
    const ambientVisuals = [
      "https://media.giphy.com/media/l41YqKti3pFKuI9CE/giphy.gif",
      "https://media.giphy.com/media/3oKIPnAiaMCws8nOsE/giphy.gif",
      "https://media.giphy.com/media/26n6WywJyh39n1pBu/giphy.gif"
    ];

    // Pick a relaxing animation on load
    document.getElementById('bgVisual').src = ambientVisuals[0];

    function toggleAudio() {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.classList.add('hidden');
          pauseIcon.classList.remove('hidden');
          statusText.textContent = "Live • Chill Stream";
          eqBars.forEach(b => b.classList.remove('eq-paused'));
        }).catch(() => {
          statusText.textContent = "Tap play to start";
        });
      } else {
        audio.pause();
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        statusText.textContent = "Paused";
        eqBars.forEach(b => b.classList.add('eq-paused'));
      }
    }

    function updateTime() {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString([], { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit' 
      });
    }

    setInterval(updateTime, 1000);
    updateTime();
  </script>
</body>
</html>
