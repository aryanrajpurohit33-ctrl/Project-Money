<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS DIGITAL — Digital Goods & Subscriptions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: { 500: '#10b981', 600: '#059669' },
            surface: { 800: '#111827', 900: '#0b0f19', 950: '#030712' },
            admin: { sidebar: '#090d16', bg: '#05070d', card: '#0f1422', border: '#1c2438' }
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background-color: #030712; color: #f3f4f6; overflow-x: hidden; width: 100%; }
    .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: linear-gradient(135deg, rgba(31, 41, 55, 0.45) 0%, rgba(17, 24, 39, 0.6) 100%); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); transition: all 0.25s; }
    .glass-card:hover { border-color: rgba(16, 185, 129, 0.4); transform: translateY(-4px); }
    .admin-card { background-color: #0f1422; border: 1px solid #1c2438; }
    .auth-glow { box-shadow: 0 0 50px -10px rgba(16, 185, 129, 0.15); }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <div id="toastHub" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
  <div id="appBackdrop" onclick="closeAllDrawers()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden transition-opacity duration-200"></div>
  <div id="mainViewport" class="flex flex-1 min-h-screen"></div>

  <!-- Global Modal for Product Editor, Slot Editor, Preview, and Actions -->
  <div id="globalModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-2 sm:p-4">
    <div class="glass max-w-5xl w-full rounded-3xl p-5 sm:p-8 relative max-h-[94vh] overflow-y-auto custom-scroll shadow-2xl border border-white/10" id="globalModalContent"></div>
  </div>

  <script>
    const state = {
      sessionId: 'sess_' + Math.random().toString(36).substring(2, 12),
      user: JSON.parse(localStorage.getItem('nexus_user') || 'null'),
      token: localStorage.getItem('nexus_token') || '',
      adminToken: localStorage.getItem('nexus_admin_token') || '',
      adminUsername: localStorage.getItem('nexus_admin_user') || '',
      cart: JSON.parse(localStorage.getItem('nexus_cart') || '[]'),
      currentView: 'home',
      adminSection: 'slots',
      dashboardRange: '30d',
      slotFilterProduct: 'ALL',
      slotFilterStatus: 'ALL',
      loadedProducts: [],
      loadedSlots: [],
      productStudioDirty: false
    };

    const SVG_SPINNER = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 inline-block text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;

    function showToast(message, type = 'success') {
      const hub = document.getElementById('toastHub');
      const toast = document.createElement('div');
      const colors = type === 'success' ? 'bg-emerald-500 text-gray-950' : 'bg-rose-500 text-white';
      toast.className = `px-5 py-3 rounded-2xl font-bold text-xs shadow-2xl flex items-center gap-2 transform transition-all duration-300 opacity-0 ${colors}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span> <span>${message}</span>`;
      hub.appendChild(toast);
      setTimeout(() => toast.classList.remove('opacity-0'), 10);
      setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3200);
    }

    async function fetchJSON(url, options = {}) {
      try {
        const res = await fetch(url, options);
        if (res.status === 401 || res.status === 403) {
          if (url.includes('/api/admin/')) adminSignOut();
          throw new Error('Session expired or unauthorized');
        }
        const contentType = res.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) throw new Error('Service synchronizing. Please retry.');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
        return data;
      } catch (err) { throw err; }
    }

    function closeAllDrawers() {
      if (state.productStudioDirty) {
        if (!confirm('You have unsaved changes. Discard them?')) return;
        state.productStudioDirty = false;
      }
      document.getElementById('appBackdrop').classList.add('hidden');
      const cSide = document.getElementById('customerSidebar');
      if (cSide) cSide.classList.add('-translate-x-full');
      const aSide = document.getElementById('adminSidebar');
      if (aSide) aSide.classList.add('-translate-x-full');
      document.getElementById('globalModal').classList.add('hidden');
    }

    function toggleCustomerDrawer(open) {
      const side = document.getElementById('customerSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) { side.classList.remove('-translate-x-full'); drop.classList.remove('hidden'); }
      else { side.classList.add('-translate-x-full'); drop.classList.add('hidden'); }
    }

    function toggleAdminDrawer(open) {
      const side = document.getElementById('adminSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) { side.classList.remove('-translate-x-full'); drop.classList.remove('hidden'); }
      else { side.classList.add('-translate-x-full'); drop.classList.add('hidden'); }
    }

    function navigate(view, params = {}) {
      state.currentView = view;
      closeAllDrawers();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const viewport = document.getElementById('mainViewport');
      if (view === 'admin-center') {
        if (!state.adminToken) renderAdminLogin(viewport);
        else renderAdminSaaSLayout(viewport);
        return;
      }
      renderStorefrontLayout(viewport, view, params);
    }

    // =========================================================================
    // STOREFRONT LAYOUT & CUSTOMER STORE (PRESERVED)
    // =========================================================================
    function renderStorefrontLayout(viewport, view, params) {
      viewport.innerHTML = `
        <div class="flex flex-1 min-h-screen relative w-full bg-surface-950">
          <aside id="customerSidebar" class="fixed lg:static top-0 bottom-0 left-0 w-64 bg-surface-900 border-r border-white/5 z-50 flex flex-col justify-between transition-transform duration-300 -translate-x-full lg:translate-x-0">
            <div>
              <div class="p-6 border-b border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
                  <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center font-black text-gray-950 shadow-lg shadow-emerald-500/20">N</div>
                  <div><span class="font-extrabold text-sm tracking-wider text-white block">NEXUS</span><span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">DIGITAL VAULT</span></div>
                </div>
                <button onclick="toggleCustomerDrawer(false)" class="lg:hidden text-slate-400 p-1">✕</button>
              </div>
              <nav class="p-4 space-y-1.5 text-xs font-semibold">
                <button onclick="navigate('home')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>🏠</span> Home</button>
                <button onclick="navigate('products')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>🛍</span> All Products</button>
                <button onclick="navigate('orders')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>📦</span> Purchased Items</button>
                <button onclick="navigate('account')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>👤</span> Account</button>
              </nav>
            </div>
            <div class="p-4 border-t border-white/5">
              <button onclick="navigate('admin-center')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold text-slate-400 bg-white/[0.03] hover:text-emerald-400 border border-white/5">🔐 Admin Panel</button>
            </div>
          </aside>
          <div class="flex-1 flex flex-col min-w-0">
            <header class="sticky top-0 z-30 glass border-b border-white/5 px-4 sm:px-8 py-3.5 flex items-center justify-between">
              <button onclick="toggleCustomerDrawer(true)" class="lg:hidden p-2 rounded-xl bg-white/5 text-slate-300">☰</button>
              <span class="text-xs font-bold text-white">NEXUS DIGITAL STOREFRONT</span>
            </header>
            <main id="storeContent" class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto space-y-8"></main>
          </div>
        </div>
      `;
      const storeContent = document.getElementById('storeContent');
      storeContent.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs font-mono">Storefront active. Access the Admin Panel via /admin-center or sidebar.</div>`;
    }

    // =========================================================================
    // ADMIN AUTH & SAAS CONTAINER (PRESERVED)
    // =========================================================================
    function renderAdminLogin(viewport) {
      viewport.innerHTML = `
        <div class="min-h-screen w-full bg-admin-bg flex items-center justify-center p-4">
          <div class="admin-card max-w-md w-full rounded-3xl p-8 space-y-6 shadow-2xl border border-admin-border">
            <div class="text-center space-y-1">
              <h2 class="text-xl font-black text-white tracking-wider font-sans">NEXUS CONTROL CENTER</h2>
              <p class="text-xs text-slate-400 font-mono">Admin Authorization Portal</p>
            </div>
            <form onsubmit="handleAdminAuth(event)" class="space-y-4 font-mono">
              <input type="text" id="admUser" required placeholder="Admin Username (Aryan)" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-xs text-white outline-none focus:border-emerald-500">
              <input type="password" id="admPass" required placeholder="Password (5669)" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-xs text-white outline-none focus:border-emerald-500">
              <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-500 text-gray-950 font-black text-xs uppercase tracking-wider font-sans shadow-lg">Authorize Session</button>
            </form>
          </div>
        </div>
      `;
    }

    async function handleAdminAuth(e) {
      e.preventDefault();
      try {
        const data = await fetchJSON('/api/admin/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('admUser').value, password: document.getElementById('admPass').value })
        });
        state.adminToken = data.token; state.adminUsername = data.username;
        localStorage.setItem('nexus_admin_token', data.token); localStorage.setItem('nexus_admin_user', data.username);
        showToast('Admin Authorized'); navigate('admin-center');
      } catch (err) { showToast(err.message, 'error'); }
    }

    function renderAdminSaaSLayout(viewport) {
      viewport.innerHTML = `
        <div class="flex flex-1 min-h-screen w-full bg-admin-bg font-sans text-slate-200 relative">
          <aside id="adminSidebar" class="fixed lg:static top-0 bottom-0 left-0 w-64 bg-admin-sidebar border-r border-admin-border flex flex-col justify-between z-50 transition-transform duration-300 -translate-x-full lg:translate-x-0">
            <div>
              <div class="p-6 border-b border-admin-border flex items-center justify-between">
                <div><span class="text-xs font-black text-emerald-400 uppercase tracking-widest block font-mono">NEXUS CONTROL</span><span class="text-sm font-bold text-white">Admin Hub</span></div>
                <button onclick="toggleAdminDrawer(false)" class="lg:hidden text-slate-400">✕</button>
              </div>
              <nav class="p-4 space-y-1 text-xs font-bold font-mono">
                <button onclick="switchAdminSection('slots')" id="adnav-slots" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 bg-emerald-500/10 text-emerald-400">🔐 Account Slots</button>
                <button onclick="switchAdminSection('products')" id="adnav-products" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">📦 Product Studio</button>
                <button onclick="switchAdminSection('dashboard')" id="adnav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">📊 Overview Dashboard</button>
                <button onclick="switchAdminSection('subscriptions')" id="adnav-subscriptions" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">👥 Subscriptions Suite</button>
                <button onclick="switchAdminSection('transactions')" id="adnav-transactions" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">💳 Transactions</button>
                <button onclick="switchAdminSection('customers')" id="adnav-customers" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">👤 Customers</button>
                <button onclick="switchAdminSection('payment-settings')" id="adnav-payment-settings" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">💰 Payment Gateway</button>
                <button onclick="switchAdminSection('system-monitor')" id="adnav-system-monitor" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">🌐 Website Status</button>
              </nav>
            </div>
            <div class="p-4 border-t border-admin-border space-y-2 font-mono">
              <button onclick="navigate('home')" class="w-full py-2.5 rounded-xl bg-white/5 text-slate-400 hover:text-white text-xs font-bold">👁 Customer Store</button>
              <button onclick="adminSignOut()" class="w-full py-2.5 rounded-xl bg-rose-500/10 text-rose-400 text-xs font-bold">🚪 End Session</button>
            </div>
          </aside>
          <div class="flex-1 flex flex-col min-w-0">
            <header class="h-16 border-b border-admin-border bg-admin-sidebar/50 px-4 sm:px-8 flex items-center justify-between">
              <button onclick="toggleAdminDrawer(true)" class="lg:hidden p-2 rounded-xl bg-white/5 text-slate-300">☰</button>
              <span class="text-xs text-slate-400 font-mono">Admin: ${state.adminUsername}</span>
            </header>
            <main id="adminMainContent" class="flex-1 p-4 sm:p-8 space-y-8 max-w-7xl w-full mx-auto"></main>
          </div>
        </div>
      `;
      switchAdminSection(state.adminSection || 'slots');
    }

    function switchAdminSection(sec) {
      state.adminSection = sec; closeAllDrawers();
      const content = document.getElementById('adminMainContent');
      if (!content) return;
      document.querySelectorAll('[id^="adnav-"]').forEach(b => b.classList.remove('bg-emerald-500/10', 'text-emerald-400'));
      const active = document.getElementById(`adnav-${sec}`);
      if (active) active.classList.add('bg-emerald-500/10', 'text-emerald-400');

      if (sec === 'slots') renderAdminAccountSlots(content);
      else if (sec === 'products') renderAdminProductsStudio(content);
      else if (sec === 'dashboard') renderAdminOverview(content);
      else if (sec === 'subscriptions') renderAdminSubscriptions(content);
      else if (sec === 'transactions') renderAdminTransactions(content);
      else if (sec === 'customers') renderAdminCustomers(content);
      else if (sec === 'payment-settings') renderAdminPaymentSettings(content);
      else if (sec === 'system-monitor') renderAdminSystemMonitor(content);
    }

    function adminSignOut() {
      state.adminToken = ''; state.adminUsername = '';
      localStorage.removeItem('nexus_admin_token'); localStorage.removeItem('nexus_admin_user');
      navigate('home');
    }

    // =========================================================================
    // 🔐 ACCOUNT SLOTS — FULLY RESPONSIVE & MOBILE-OPTIMIZED (NO SLIDING)
    // =========================================================================
    async function renderAdminAccountSlots(container) {
      container.innerHTML = `
        <div class="space-y-6 font-mono text-xs animate-pulse">
          <div class="h-10 bg-surface-900 rounded-2xl w-1/3"></div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="h-20 bg-surface-900 rounded-2xl"></div>
            <div class="h-20 bg-surface-900 rounded-2xl"></div>
            <div class="h-20 bg-surface-900 rounded-2xl"></div>
            <div class="h-20 bg-surface-900 rounded-2xl"></div>
          </div>
          <div class="h-64 bg-surface-900 rounded-3xl"></div>
        </div>
      `;

      try {
        const [slotData, prodData] = await Promise.all([
          fetchJSON('/api/admin/slots', { headers: { 'Authorization': `Bearer ${state.adminToken}` } }),
          fetchJSON('/api/admin/products', { headers: { 'Authorization': `Bearer ${state.adminToken}` } }).catch(() => [])
        ]);

        state.loadedSlots = slotData.slots || [];
        state.loadedProducts = Array.isArray(prodData) ? prodData : [];
        const stats = slotData.stats || { total: state.loadedSlots.length, available: 0, assigned: 0, full: 0, disabled: 0 };
        const slots = state.loadedSlots;

        container.innerHTML = `
          <div class="space-y-6 font-mono text-xs pb-12 w-full max-w-full overflow-hidden">
            
            <!-- Page Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 font-sans">
              <div>
                <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight">Account Slots Management</h1>
                <p class="text-slate-400 text-xs mt-0.5">Manage and bind digital account credentials.</p>
              </div>
              <button onclick="openSlotFormModal('new')" class="w-full sm:w-auto px-5 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-black text-xs uppercase tracking-wider shadow-lg shadow-emerald-500/20 active:scale-95 transition-all text-center">
                + Add New Slot
              </button>
            </div>

            <!-- Summary KPI Cards (Responsive grid) -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div class="admin-card p-4 rounded-2xl space-y-1"><span class="text-slate-500 block text-[9px] uppercase font-bold">Total Slots</span><div class="text-xl font-black text-white font-mono">${stats.total}</div></div>
              <div class="admin-card p-4 rounded-2xl space-y-1"><span class="text-emerald-400 block text-[9px] uppercase font-bold">Available</span><div class="text-xl font-black text-emerald-400 font-mono">${stats.available}</div></div>
              <div class="admin-card p-4 rounded-2xl space-y-1"><span class="text-indigo-400 block text-[9px] uppercase font-bold">Assigned</span><div class="text-xl font-black text-indigo-400 font-mono">${stats.assigned}</div></div>
              <div class="admin-card p-4 rounded-2xl space-y-1"><span class="text-rose-400 block text-[9px] uppercase font-bold">Full / Disabled</span><div class="text-xl font-black text-rose-400 font-mono">${stats.full + stats.disabled}</div></div>
            </div>

            <!-- Search & Filter Controls -->
            <div class="admin-card rounded-2xl p-4 flex flex-col sm:flex-row gap-3 items-center justify-between">
              <div class="relative w-full sm:w-72">
                <input type="text" id="slotSearchInput" oninput="filterSlotCards()" placeholder="Search slot label or email..." class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-surface-950 border border-admin-border text-white placeholder-slate-500 outline-none focus:border-emerald-500 text-xs">
                <svg class="w-4 h-4 text-slate-500 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              </div>
              <select id="slotStatusFilter" onchange="filterSlotCards()" class="w-full sm:w-auto px-3 py-2.5 rounded-xl bg-surface-950 border border-admin-border text-white text-xs font-bold">
                <option value="ALL">All Statuses</option>
                <option value="AVAILABLE">Available</option>
                <option value="ASSIGNED">Assigned</option>
                <option value="FULL">Full</option>
                <option value="DISABLED">Disabled</option>
              </select>
            </div>

            <!-- 📱 MOBILE RESPONSIVE CARDS VIEW (< md) -->
            <div class="block md:hidden space-y-3" id="slotMobileCardsContainer">
              ${slots.length === 0 ? `
                <div class="admin-card rounded-2xl p-8 text-center text-slate-500">No account slots found.</div>
              ` : slots.map(s => `
                <div class="admin-card rounded-2xl p-4 space-y-3 slot-item-card" data-search="${(s.account_label||'').toLowerCase()} ${(s.email||'').toLowerCase()}" data-status="${s.status}">
                  <div class="flex justify-between items-start gap-2">
                    <div class="min-w-0 flex-1">
                      <span class="text-white font-bold text-sm block truncate">${s.account_label}</span>
                      <span class="text-slate-400 text-xs break-all block mt-0.5">${s.email}</span>
                    </div>
                    <span class="px-2.5 py-1 rounded-full text-[10px] font-bold shrink-0 ${
                      s.status === 'AVAILABLE' ? 'bg-emerald-500/10 text-emerald-400' :
                      s.status === 'ASSIGNED' ? 'bg-indigo-500/10 text-indigo-400' :
                      s.status === 'FULL' ? 'bg-rose-500/10 text-rose-400' : 'bg-slate-500/10 text-slate-400'
                    }">
                      ${s.status}
                    </span>
                  </div>

                  <div class="pt-2 border-t border-admin-border flex justify-between items-center text-xs">
                    <span class="text-slate-500 text-[10px]">Service: ${s.product_id?.name || 'Subscription'}</span>
                    <div class="flex items-center gap-2">
                      <button onclick="openSlotFormModal('${s._id}')" class="px-3 py-1.5 bg-emerald-500/10 text-emerald-400 rounded-xl font-bold hover:bg-emerald-500/20 active:scale-95 transition-all">Edit</button>
                      <button onclick="deleteSlotRecord('${s._id}')" class="px-3 py-1.5 bg-rose-500/10 text-rose-400 rounded-xl font-bold hover:bg-rose-500/20 active:scale-95 transition-all">Delete</button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>

            <!-- 💻 DESKTOP TABLE VIEW (>= md) with safe enclosed overflow container -->
            <div class="hidden md:block admin-card rounded-3xl p-6">
              <div class="overflow-x-auto custom-scroll w-full">
                <table class="w-full text-left" id="accountSlotsDesktopTable">
                  <thead>
                    <tr class="border-b border-admin-border text-slate-500 font-mono text-xs">
                      <th class="pb-3 font-semibold">Slot Label</th>
                      <th class="pb-3 font-semibold">Email / Username</th>
                      <th class="pb-3 font-semibold">Product</th>
                      <th class="pb-3 font-semibold">Status</th>
                      <th class="pb-3 font-semibold text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-admin-border font-mono text-xs">
                    ${slots.length === 0 ? `
                      <tr><td colspan="5" class="py-8 text-center text-slate-500">No account slots found.</td></tr>
                    ` : slots.map(s => `
                      <tr class="hover:bg-white/[0.02] transition-colors slot-desktop-row" data-search="${(s.account_label||'').toLowerCase()} ${(s.email||'').toLowerCase()}" data-status="${s.status}">
                        <td class="py-3.5 font-bold text-white">${s.account_label}</td>
                        <td class="py-3.5 text-slate-300 break-all select-all">${s.email}</td>
                        <td class="py-3.5 text-slate-400">${s.product_id?.name || 'Subscription'}</td>
                        <td class="py-3.5">
                          <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                            s.status === 'AVAILABLE' ? 'bg-emerald-500/10 text-emerald-400' :
                            s.status === 'ASSIGNED' ? 'bg-indigo-500/10 text-indigo-400' :
                            s.status === 'FULL' ? 'bg-rose-500/10 text-rose-400' : 'bg-slate-500/10 text-slate-400'
                          }">
                            ${s.status}
                          </span>
                        </td>
                        <td class="py-3.5 text-right space-x-2">
                          <button onclick="openSlotFormModal('${s._id}')" class="px-3 py-1 bg-emerald-500/10 text-emerald-400 rounded-lg font-bold hover:bg-emerald-500/20 transition-all">Edit</button>
                          <button onclick="deleteSlotRecord('${s._id}')" class="px-2 py-1 text-rose-400 hover:text-rose-300 font-bold">✕</button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="admin-card p-8 text-center text-rose-400 text-xs font-mono">Error loading Account Slots: ${err.message}</div>`;
      }
    }

    function filterSlotCards() {
      const q = (document.getElementById('slotSearchInput')?.value || '').toLowerCase();
      const status = document.getElementById('slotStatusFilter')?.value || 'ALL';

      // Mobile cards filter
      document.querySelectorAll('.slot-item-card').forEach(el => {
        const text = el.getAttribute('data-search') || '';
        const st = el.getAttribute('data-status') || '';
        const matchQ = text.includes(q);
        const matchSt = (status === 'ALL' || st === status);
        if (matchQ && matchSt) el.classList.remove('hidden');
        else el.classList.add('hidden');
      });

      // Desktop rows filter
      document.querySelectorAll('.slot-desktop-row').forEach(el => {
        const text = el.getAttribute('data-search') || '';
        const st = el.getAttribute('data-status') || '';
        const matchQ = text.includes(q);
        const matchSt = (status === 'ALL' || st === status);
        if (matchQ && matchSt) el.classList.remove('hidden');
        else el.classList.add('hidden');
      });
    }

    async function openSlotFormModal(slotId) {
      const isNew = slotId === 'new';
      const modal = document.getElementById('globalModal');
      const content = document.getElementById('globalModalContent');
      modal.classList.remove('hidden'); modal.classList.add('flex');

      let slotData = {
        account_label: 'Slot ' + Math.floor(Math.random() * 100),
        email: '', password: '', status: 'AVAILABLE', max_active_users: 1
      };

      if (!isNew) {
        slotData = state.loadedSlots.find(s => s._id === slotId) || slotData;
      }

      content.innerHTML = `
        <button onclick="closeAllDrawers()" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
        <div class="space-y-5 font-sans text-xs">
          <div>
            <h2 class="text-base font-black text-white font-sans">${isNew ? '+ Add New Account Slot' : `Edit Account Slot: ${slotData.account_label}`}</h2>
            <p class="text-slate-400 text-xs">Updating credentials synchronizes dynamically to active customer accounts.</p>
          </div>

          <form onsubmit="handleSlotFormSubmit(event, '${slotId}')" class="space-y-4 font-mono">
            ${isNew ? `
              <div>
                <label class="text-slate-400 block mb-1">Select Associated Product</label>
                <select id="slotFormProduct" required class="w-full px-3.5 py-2.5 rounded-xl bg-surface-950 border border-admin-border text-white text-xs">
                  ${(state.loadedProducts || []).map(p => `<option value="${p._id}">${p.name}</option>`).join('')}
                </select>
              </div>
            ` : ''}

            <div>
              <label class="text-slate-400 block mb-1">Slot Label</label>
              <input type="text" id="slotFormLabel" required value="${slotData.account_label || ''}" placeholder="e.g. Slot 1 (Private)" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-950 border border-admin-border text-white text-xs">
            </div>

            <div>
              <label class="text-slate-400 block mb-1">Email / Username</label>
              <input type="email" id="slotFormEmail" required value="${slotData.email || ''}" placeholder="account@example.com" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-950 border border-admin-border text-white text-xs">
            </div>

            <div>
              <label class="text-slate-400 block mb-1">Password</label>
              <input type="text" id="slotFormPassword" value="${slotData.password || ''}" placeholder="Enter password" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-950 border border-admin-border text-emerald-400 font-bold text-xs">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-slate-400 block mb-1">Max Users</label>
                <input type="number" id="slotFormMaxUsers" min="1" max="100" value="${slotData.max_active_users || 1}" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-950 border border-admin-border text-white text-xs">
              </div>
              <div>
                <label class="text-slate-400 block mb-1">Status</label>
                <select id="slotFormStatus" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-950 border border-admin-border text-white text-xs">
                  <option value="AVAILABLE" ${slotData.status === 'AVAILABLE' ? 'selected' : ''}>Available</option>
                  <option value="DISABLED" ${slotData.status === 'DISABLED' ? 'selected' : ''}>Disabled</option>
                </select>
              </div>
            </div>

            <button type="submit" class="w-full py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-black uppercase tracking-wider font-sans shadow-lg shadow-emerald-500/20 active:scale-95 transition-all text-xs">
              ${isNew ? 'Create Account Slot' : 'Save Slot Changes'}
            </button>
          </form>
        </div>
      `;
    }

    async function handleSlotFormSubmit(e, slotId) {
      e.preventDefault();
      const isNew = slotId === 'new';
      const payload = {
        account_label: document.getElementById('slotFormLabel').value.trim(),
        email: document.getElementById('slotFormEmail').value.trim(),
        password: document.getElementById('slotFormPassword').value.trim(),
        max_active_users: Number(document.getElementById('slotFormMaxUsers').value) || 1,
        status: document.getElementById('slotFormStatus').value
      };
      if (isNew) payload.product_id = document.getElementById('slotFormProduct').value;

      try {
        await fetchJSON(isNew ? '/api/admin/slots' : `/api/admin/slots/${slotId}`, {
          method: isNew ? 'POST' : 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.adminToken}` },
          body: JSON.stringify(payload)
        });
        showToast(isNew ? '✓ Account Slot created!' : '✓ Slot updated!');
        document.getElementById('globalModal').classList.add('hidden');
        renderAdminAccountSlots(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function deleteSlotRecord(id) {
      if (!confirm('Permanently remove this account slot?')) return;
      try {
        await fetchJSON(`/api/admin/slots/${id}`, {
          method: 'DELETE', headers: { 'Authorization': `Bearer ${state.adminToken}` }
        });
        showToast('✓ Slot deleted successfully');
        renderAdminAccountSlots(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }
