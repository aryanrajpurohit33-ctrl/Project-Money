<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS DIGITAL — Digital Goods & Subscriptions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: { 500: '#10b981', 600: '#059669' },
            surface: { 800: '#111827', 900: '#0b0f19', 950: '#030712' },
            admin: { sidebar: '#090d16', bg: '#05070d', card: '#0f1422', border: '#1c2438' }
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
    .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: linear-gradient(135deg, rgba(31, 41, 55, 0.45) 0%, rgba(17, 24, 39, 0.6) 100%); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); transition: all 0.25s; }
    .glass-card:hover { border-color: rgba(16, 185, 129, 0.4); transform: translateY(-4px); }
    .admin-card { background-color: #0f1422; border: 1px solid #1c2438; }
    .auth-glow { box-shadow: 0 0 50px -10px rgba(16, 185, 129, 0.15); }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <div id="toastHub" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
  <div id="appBackdrop" onclick="closeAllDrawers()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden transition-opacity duration-200"></div>
  <div id="mainViewport" class="flex flex-1 min-h-screen"></div>

  <!-- Global Modal Container -->
  <div id="globalModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-2 sm:p-4">
    <div class="glass max-w-4xl w-full rounded-3xl p-6 sm:p-8 relative max-h-[94vh] overflow-y-auto custom-scroll shadow-2xl border border-white/10" id="globalModalContent"></div>
  </div>

  <script>
    const state = {
      sessionId: 'sess_' + Math.random().toString(36).substring(2, 12),
      user: JSON.parse(localStorage.getItem('nexus_user') || 'null'),
      token: localStorage.getItem('nexus_token') || '',
      adminToken: localStorage.getItem('nexus_admin_token') || '',
      adminUsername: localStorage.getItem('nexus_admin_user') || '',
      cart: JSON.parse(localStorage.getItem('nexus_cart') || '[]'),
      currentView: 'home',
      adminSection: 'dashboard',
      dashboardRange: '30d'
    };

    function showToast(message, type = 'success') {
      const hub = document.getElementById('toastHub');
      const toast = document.createElement('div');
      const colors = type === 'success' ? 'bg-emerald-500 text-gray-950' : 'bg-rose-500 text-white';
      toast.className = `px-5 py-3 rounded-2xl font-bold text-xs shadow-2xl flex items-center gap-2 transform transition-all duration-300 opacity-0 ${colors}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span> <span>${message}</span>`;
      hub.appendChild(toast);
      setTimeout(() => toast.classList.remove('opacity-0'), 10);
      setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3200);
    }

    async function fetchJSON(url, options = {}) {
      try {
        const res = await fetch(url, options);
        if (res.status === 401 || res.status === 403) {
          if (url.includes('/api/admin/')) adminSignOut();
          throw new Error('Session expired or unauthorized');
        }
        const contentType = res.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) throw new Error('Service synchronizing. Please retry.');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
        return data;
      } catch (err) { throw err; }
    }

    function closeAllDrawers() {
      document.getElementById('appBackdrop').classList.add('hidden');
      const cSide = document.getElementById('customerSidebar');
      if (cSide) cSide.classList.add('-translate-x-full');
      const aSide = document.getElementById('adminSidebar');
      if (aSide) aSide.classList.add('-translate-x-full');
      document.getElementById('globalModal').classList.add('hidden');
    }

    function toggleCustomerDrawer(open) {
      const side = document.getElementById('customerSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) { side.classList.remove('-translate-x-full'); drop.classList.remove('hidden'); }
      else { side.classList.add('-translate-x-full'); drop.classList.add('hidden'); }
    }

    function toggleAdminDrawer(open) {
      const side = document.getElementById('adminSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) { side.classList.remove('-translate-x-full'); drop.classList.remove('hidden'); }
      else { side.classList.add('-translate-x-full'); drop.classList.add('hidden'); }
    }

    function navigate(view, params = {}) {
      state.currentView = view;
      closeAllDrawers();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const viewport = document.getElementById('mainViewport');
      if (view === 'admin-center') {
        if (!state.adminToken) renderAdminLogin(viewport);
        else renderAdminSaaSLayout(viewport);
        return;
      }
      renderStorefrontLayout(viewport, view, params);
    }

    // =========================================================================
    // STOREFRONT LAYOUT & CUSTOMER STORE (UNCHANGED)
    // =========================================================================
    function renderStorefrontLayout(viewport, view, params) {
      viewport.innerHTML = `
        <div class="flex flex-1 min-h-screen relative w-full bg-surface-950">
          <aside id="customerSidebar" class="fixed lg:static top-0 bottom-0 left-0 w-64 bg-surface-900 border-r border-white/5 z-50 flex flex-col justify-between transition-transform duration-300 -translate-x-full lg:translate-x-0">
            <div>
              <div class="p-6 border-b border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
                  <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center font-black text-gray-950 shadow-lg shadow-emerald-500/20">N</div>
                  <div><span class="font-extrabold text-sm tracking-wider text-white block">NEXUS</span><span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">DIGITAL VAULT</span></div>
                </div>
                <button onclick="toggleCustomerDrawer(false)" class="lg:hidden text-slate-400 p-1">✕</button>
              </div>
              <nav class="p-4 space-y-1.5 text-xs font-semibold">
                <button onclick="navigate('home')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>🏠</span> Home</button>
                <button onclick="navigate('products')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>🛍</span> All Products</button>
                <button onclick="navigate('orders')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>📦</span> Purchased Items</button>
                <button onclick="navigate('account')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>👤</span> Account</button>
              </nav>
            </div>
            <div class="p-4 border-t border-white/5">
              <button onclick="navigate('admin-center')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold text-slate-400 bg-white/[0.03] hover:text-emerald-400 border border-white/5">🔐 Admin Panel</button>
            </div>
          </aside>
          <div class="flex-1 flex flex-col min-w-0">
            <header class="sticky top-0 z-30 glass border-b border-white/5 px-4 sm:px-8 py-3.5 flex items-center justify-between">
              <button onclick="toggleCustomerDrawer(true)" class="lg:hidden p-2 rounded-xl bg-white/5 text-slate-300">☰</button>
              <span class="text-xs font-bold text-white">NEXUS DIGITAL STOREFRONT</span>
            </header>
            <main id="storeContent" class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto space-y-8"></main>
          </div>
        </div>
      `;
      const storeContent = document.getElementById('storeContent');
      storeContent.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs font-mono">Storefront active. Access the Admin Panel via /admin-center or sidebar.</div>`;
    }

    // =========================================================================
    // ADMIN AUTH & SAAS CONTAINER
    // =========================================================================
    function renderAdminLogin(viewport) {
      viewport.innerHTML = `
        <div class="min-h-screen w-full bg-admin-bg flex items-center justify-center p-4">
          <div class="admin-card max-w-md w-full rounded-3xl p-8 space-y-6 shadow-2xl border border-admin-border">
            <div class="text-center space-y-1">
              <h2 class="text-xl font-black text-white tracking-wider font-sans">NEXUS CONTROL CENTER</h2>
              <p class="text-xs text-slate-400 font-mono">Admin Authorization Portal</p>
            </div>
            <form onsubmit="handleAdminAuth(event)" class="space-y-4 font-mono">
              <input type="text" id="admUser" required placeholder="Admin Username (Aryan)" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-xs text-white outline-none focus:border-emerald-500">
              <input type="password" id="admPass" required placeholder="Password (5669)" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-xs text-white outline-none focus:border-emerald-500">
              <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-500 text-gray-950 font-black text-xs uppercase tracking-wider font-sans shadow-lg">Authorize Session</button>
            </form>
          </div>
        </div>
      `;
    }

    async function handleAdminAuth(e) {
      e.preventDefault();
      try {
        const data = await fetchJSON('/api/admin/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('admUser').value, password: document.getElementById('admPass').value })
        });
        state.adminToken = data.token; state.adminUsername = data.username;
        localStorage.setItem('nexus_admin_token', data.token); localStorage.setItem('nexus_admin_user', data.username);
        showToast('Admin Authorized'); navigate('admin-center');
      } catch (err) { showToast(err.message, 'error'); }
    }

    function renderAdminSaaSLayout(viewport) {
      viewport.innerHTML = `
        <div class="flex flex-1 min-h-screen w-full bg-admin-bg font-sans text-slate-200 relative">
          <aside id="adminSidebar" class="fixed lg:static top-0 bottom-0 left-0 w-64 bg-admin-sidebar border-r border-admin-border flex flex-col justify-between z-50 transition-transform duration-300 -translate-x-full lg:translate-x-0">
            <div>
              <div class="p-6 border-b border-admin-border flex items-center justify-between">
                <div><span class="text-xs font-black text-emerald-400 uppercase tracking-widest block font-mono">NEXUS CONTROL</span><span class="text-sm font-bold text-white">Admin Hub</span></div>
                <button onclick="toggleAdminDrawer(false)" class="lg:hidden text-slate-400">✕</button>
              </div>
              <nav class="p-4 space-y-1 text-xs font-bold font-mono">
                <button onclick="switchAdminSection('dashboard')" id="adnav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 bg-emerald-500/10 text-emerald-400">📊 Overview Dashboard</button>
                <button onclick="switchAdminSection('products')" id="adnav-products" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">📦 Product Studio</button>
                <button onclick="switchAdminSection('slots')" id="adnav-slots" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">🔐 Account Slots</button>
                <button onclick="switchAdminSection('subscriptions')" id="adnav-subscriptions" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">👥 Subscriptions Suite</button>
                <button onclick="switchAdminSection('transactions')" id="adnav-transactions" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">💳 Transactions</button>
                <button onclick="switchAdminSection('customers')" id="adnav-customers" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">👤 Customers</button>
                <button onclick="switchAdminSection('payment-settings')" id="adnav-payment-settings" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">💰 Payment Gateway</button>
                <button onclick="switchAdminSection('system-monitor')" id="adnav-system-monitor" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">🌐 Website Status</button>
              </nav>
            </div>
            <div class="p-4 border-t border-admin-border space-y-2 font-mono">
              <button onclick="navigate('home')" class="w-full py-2.5 rounded-xl bg-white/5 text-slate-400 hover:text-white text-xs font-bold">👁 Customer Store</button>
              <button onclick="adminSignOut()" class="w-full py-2.5 rounded-xl bg-rose-500/10 text-rose-400 text-xs font-bold">🚪 End Session</button>
            </div>
          </aside>
          <div class="flex-1 flex flex-col min-w-0">
            <header class="h-16 border-b border-admin-border bg-admin-sidebar/50 px-4 sm:px-8 flex items-center justify-between">
              <button onclick="toggleAdminDrawer(true)" class="lg:hidden p-2 rounded-xl bg-white/5 text-slate-300">☰</button>
              <span class="text-xs text-slate-400 font-mono">Admin: ${state.adminUsername}</span>
            </header>
            <main id="adminMainContent" class="flex-1 p-4 sm:p-8 space-y-8 max-w-7xl w-full mx-auto"></main>
          </div>
        </div>
      `;
      switchAdminSection(state.adminSection || 'dashboard');
    }

    function switchAdminSection(sec) {
      state.adminSection = sec; closeAllDrawers();
      const content = document.getElementById('adminMainContent');
      if (!content) return;
      document.querySelectorAll('[id^="adnav-"]').forEach(b => b.classList.remove('bg-emerald-500/10', 'text-emerald-400'));
      const active = document.getElementById(`adnav-${sec}`);
      if (active) active.classList.add('bg-emerald-500/10', 'text-emerald-400');

      if (sec === 'dashboard') renderAdminOverview(content);
      else if (sec === 'products') renderAdminProductsStudio(content);
      else if (sec === 'slots') renderAdminAccountSlots(content);
      else if (sec === 'subscriptions') renderAdminSubscriptions(content);
      else if (sec === 'transactions') renderAdminTransactions(content);
      else if (sec === 'customers') renderAdminCustomers(content);
      else if (sec === 'payment-settings') renderAdminPaymentSettings(content);
      else if (sec === 'system-monitor') renderAdminSystemMonitor(content);
    }

    function adminSignOut() {
      state.adminToken = ''; state.adminUsername = '';
      localStorage.removeItem('nexus_admin_token'); localStorage.removeItem('nexus_admin_user');
      navigate('home');
    }

    // =========================================================================
    // 📊 OVERVIEW DASHBOARD — COMPLETE REDESIGN (ISOLATED TARGET)
    // =========================================================================
    async function renderAdminOverview(container) {
      container.innerHTML = `
        <div class="space-y-6 font-mono text-xs animate-pulse">
          <div class="h-10 bg-surface-900 rounded-2xl w-1/3"></div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="h-28 bg-surface-900 rounded-3xl"></div>
            <div class="h-28 bg-surface-900 rounded-3xl"></div>
            <div class="h-28 bg-surface-900 rounded-3xl"></div>
            <div class="h-28 bg-surface-900 rounded-3xl"></div>
          </div>
          <div class="h-72 bg-surface-900 rounded-3xl"></div>
        </div>
      `;

      try {
        const d = await fetchJSON(`/api/admin/dashboard/full-overview?range=${state.dashboardRange}`, {
          headers: { 'Authorization': `Bearer ${state.adminToken}` }
        });

        // Responsive SVG Area Chart
        const points = d.revenue_timeline || [];
        const maxVal = Math.max(...points.map(p => p.value), 100);
        const svgW = 600, svgH = 160;
        const coords = points.map((p, idx) => {
          const x = (idx / Math.max(1, points.length - 1)) * (svgW - 40) + 20;
          const y = svgH - 25 - (p.value / maxVal) * (svgH - 50);
          return { x, y, ...p };
        });
        const pointsStr = coords.map(c => `${c.x},${c.y}`).join(' ');
        const areaStr = coords.length ? `20,${svgH - 25} ${pointsStr} ${coords[coords.length - 1].x},${svgH - 25}` : '';

        container.innerHTML = `
          <div class="space-y-8 font-mono text-xs pb-12">
            
            <!-- Live Visitor Bar -->
            <div class="glass border-emerald-500/20 px-4 py-2.5 rounded-2xl flex justify-between items-center text-[11px] font-bold shadow-lg">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-emerald-400 font-sans">${d.live_visitors ? `🟢 ${d.live_visitors} LIVE VISITORS` : '🟢 Live visitors online'}</span>
                <span class="text-slate-400 font-normal hidden sm:inline">• Website visitors right now</span>
              </div>
              <span class="text-slate-400">Updated just now</span>
            </div>

            <!-- Dashboard Header & Range Picker -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 font-sans">
              <div>
                <h1 class="text-2xl font-black text-white tracking-tight">OVERVIEW DASHBOARD</h1>
                <p class="text-slate-400 text-xs mt-0.5">Business performance and store analytics</p>
              </div>
              <div class="flex items-center gap-2">
                <select id="overviewDateSelect" onchange="state.dashboardRange=this.value; renderAdminOverview(document.getElementById('adminMainContent'))" class="px-4 py-2.5 rounded-xl bg-surface-950 border border-admin-border text-white text-xs font-bold outline-none focus:border-emerald-500 font-mono">
                  <option value="today" ${state.dashboardRange==='today'?'selected':''}>Today</option>
                  <option value="yesterday" ${state.dashboardRange==='yesterday'?'selected':''}>Yesterday</option>
                  <option value="7d" ${state.dashboardRange==='7d'?'selected':''}>Last 7 Days</option>
                  <option value="30d" ${state.dashboardRange==='30d'?'selected':''}>Last 30 Days</option>
                  <option value="90d" ${state.dashboardRange==='90d'?'selected':''}>Last 90 Days</option>
                  <option value="this_year" ${state.dashboardRange==='this_year'?'selected':''}>This Year</option>
                  <option value="all" ${state.dashboardRange==='all'?'selected':''}>All Time</option>
                </select>

                <button onclick="renderAdminOverview(document.getElementById('adminMainContent'))" class="px-4 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 font-bold text-xs flex items-center gap-1.5 transition-all font-mono">
                  <span>↻</span> <span>Refresh</span>
                </button>
              </div>
            </div>

            <!-- Primary KPI Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 font-sans">
              <div class="admin-card p-5 rounded-3xl space-y-2 border border-admin-border hover:border-emerald-500/30 transition-all">
                <span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider">TOTAL REVENUE</span>
                <div class="text-2xl font-black text-emerald-400 font-mono">₹${d.kpis.revenue.value.toLocaleString()}</div>
                <div class="text-[10px] font-mono font-bold ${d.kpis.revenue.change !== null ? (d.kpis.revenue.change >= 0 ? 'text-emerald-400' : 'text-rose-400') : 'text-slate-500'}">
                  ${d.kpis.revenue.change !== null ? `${d.kpis.revenue.change >= 0 ? '↑' : '↓'} ${Math.abs(d.kpis.revenue.change)}% vs prev period` : 'No previous data'}
                </div>
              </div>

              <div class="admin-card p-5 rounded-3xl space-y-2 border border-admin-border hover:border-emerald-500/30 transition-all">
                <span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider">TOTAL ORDERS</span>
                <div class="text-2xl font-black text-white font-mono">${d.kpis.orders.value}</div>
                <div class="text-[10px] font-mono font-bold ${d.kpis.orders.change !== null ? (d.kpis.orders.change >= 0 ? 'text-emerald-400' : 'text-rose-400') : 'text-slate-500'}">
                  ${d.kpis.orders.change !== null ? `${d.kpis.orders.change >= 0 ? '↑' : '↓'} ${Math.abs(d.kpis.orders.change)}% vs prev period` : 'Completed'}
                </div>
              </div>

              <div class="admin-card p-5 rounded-3xl space-y-2 border border-admin-border hover:border-emerald-500/30 transition-all">
                <span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider">TOTAL CUSTOMERS</span>
                <div class="text-2xl font-black text-white font-mono">${d.kpis.customers.value}</div>
                <div class="text-[10px] font-mono font-bold ${d.kpis.customers.change !== null ? (d.kpis.customers.change >= 0 ? 'text-emerald-400' : 'text-rose-400') : 'text-slate-500'}">
                  ${d.kpis.customers.change !== null ? `${d.kpis.customers.change >= 0 ? '↑' : '↓'} ${Math.abs(d.kpis.customers.change)}% vs prev period` : 'Registered'}
                </div>
              </div>

              <div class="admin-card p-5 rounded-3xl space-y-2 border border-admin-border hover:border-emerald-500/30 transition-all">
                <span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider">ACTIVE SUBSCRIPTIONS</span>
                <div class="text-2xl font-black text-indigo-400 font-mono">${d.kpis.subscriptions.value}</div>
                <div class="text-[10px] text-indigo-400 font-mono font-bold">● Live active access</div>
              </div>
            </div>

            <!-- Revenue Analytics Chart & Order Breakdown -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <div class="lg:col-span-8 admin-card rounded-3xl p-6 space-y-4">
                <div class="flex justify-between items-center">
                  <div>
                    <h3 class="text-base font-black text-white font-sans">Revenue Overview</h3>
                    <p class="text-[10px] text-slate-400 font-mono">Confirmed store earnings across timeline</p>
                  </div>
                  <span class="text-xs font-bold text-emerald-400 font-mono">Gross: ₹${d.kpis.revenue.value}</span>
                </div>

                <div class="w-full overflow-x-auto custom-scroll">
                  <svg viewBox="0 0 ${svgW} ${svgH}" class="w-full h-44 text-emerald-500 overflow-visible">
                    <defs>
                      <linearGradient id="revGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
                        <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
                      </linearGradient>
                    </defs>
                    <line x1="20" y1="20" x2="${svgW-20}" y2="20" stroke="#1c2438" stroke-dasharray="3"/>
                    <line x1="20" y1="75" x2="${svgW-20}" y2="75" stroke="#1c2438" stroke-dasharray="3"/>
                    <line x1="20" y1="${svgH-25}" x2="${svgW-20}" y2="${svgH-25}" stroke="#1c2438"/>

                    ${coords.length ? `<polygon points="${areaStr}" fill="url(#revGrad)" />` : ''}
                    ${coords.length ? `<polyline points="${pointsStr}" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />` : ''}

                    ${coords.map(c => `
                      <circle cx="${c.x}" cy="${c.y}" r="3.5" fill="#0f1422" stroke="#10b981" stroke-width="2"/>
                      <text x="${c.x}" y="${svgH-8}" text-anchor="middle" font-size="8" fill="#64748b" font-family="monospace">${c.label}</text>
                    `).join('')}
                  </svg>
                </div>
              </div>

              <div class="lg:col-span-4 admin-card rounded-3xl p-6 space-y-4">
                <h3 class="text-base font-black text-white font-sans">Orders Analytics</h3>
                <div class="space-y-3 font-mono">
                  <div>
                    <div class="flex justify-between text-xs mb-1"><span class="text-emerald-400">Completed (Paid)</span><span class="font-bold text-white">${d.order_statuses.completed}</span></div>
                    <div class="w-full bg-surface-950 h-2 rounded-full overflow-hidden"><div class="bg-emerald-500 h-full" style="width: ${d.kpis.orders.value ? (d.order_statuses.completed/d.kpis.orders.value)*100 : 0}%"></div></div>
                  </div>
                  <div>
                    <div class="flex justify-between text-xs mb-1"><span class="text-indigo-400">Processing</span><span class="font-bold text-white">${d.order_statuses.processing}</span></div>
                    <div class="w-full bg-surface-950 h-2 rounded-full overflow-hidden"><div class="bg-indigo-500 h-full" style="width: ${d.kpis.orders.value ? (d.order_statuses.processing/d.kpis.orders.value)*100 : 0}%"></div></div>
                  </div>
                  <div>
                    <div class="flex justify-between text-xs mb-1"><span class="text-amber-400">Pending Verification</span><span class="font-bold text-white">${d.order_statuses.pending}</span></div>
                    <div class="w-full bg-surface-950 h-2 rounded-full overflow-hidden"><div class="bg-amber-500 h-full" style="width: ${d.kpis.orders.value ? (d.order_statuses.pending/d.kpis.orders.value)*100 : 0}%"></div></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Top Products & Payment Methods -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start font-sans">
              <div class="lg:col-span-8 admin-card rounded-3xl p-6 space-y-4">
                <div class="flex justify-between items-center">
                  <h3 class="text-base font-black text-white">Top Best Selling Products</h3>
                  <button onclick="switchAdminSection('products')" class="text-xs text-emerald-400 font-bold hover:underline font-mono">View Studio →</button>
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full text-left font-mono text-xs">
                    <thead><tr class="border-b border-admin-border text-slate-500"><th class="pb-2">Rank</th><th class="pb-2">Product Name</th><th class="pb-2">Orders</th><th class="pb-2">Revenue</th></tr></thead>
                    <tbody class="divide-y divide-admin-border">
                      ${d.top_products.length === 0 ? `<tr><td colspan="4" class="py-6 text-center text-slate-500">No sales in this period.</td></tr>` : d.top_products.map((p, i) => `
                        <tr class="hover:bg-white/[0.02]">
                          <td class="py-3 font-bold text-emerald-400">#${i+1}</td>
                          <td class="py-3 text-white font-bold">${p.name}</td>
                          <td class="py-3 text-slate-300">${p.orders}</td>
                          <td class="py-3 text-emerald-400 font-bold">₹${p.revenue}</td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>

              <div class="lg:col-span-4 admin-card rounded-3xl p-6 space-y-4">
                <h3 class="text-base font-black text-white">Payment Methods</h3>
                <div class="p-4 rounded-2xl bg-surface-950 border border-admin-border space-y-3 font-mono">
                  <div class="flex justify-between items-center">
                    <span class="text-white font-bold">UPI Pay</span>
                    <span class="text-emerald-400 font-bold">₹${d.payment_methods.upi.amount} (${d.payment_methods.upi.count} txns)</span>
                  </div>
                  <div class="flex justify-between items-center">
                    <span class="text-white font-bold">Crypto USDT</span>
                    <span class="text-teal-400 font-bold">₹${d.payment_methods.crypto.amount} (${d.payment_methods.crypto.count} txns)</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Attention Required & Recent Transactions -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start font-sans">
              <div class="lg:col-span-6 admin-card rounded-3xl p-6 space-y-4">
                <div class="flex justify-between items-center">
                  <h3 class="text-base font-black text-white">Account Slot Inventory</h3>
                  <button onclick="switchAdminSection('slots')" class="text-xs text-emerald-400 font-bold hover:underline font-mono">Manage Slots →</button>
                </div>
                <div class="grid grid-cols-3 gap-2 font-mono text-center">
                  <div class="p-3 bg-surface-950 rounded-2xl border border-admin-border"><span class="text-slate-500 text-[10px] block">TOTAL</span><span class="text-base font-black text-white">${d.slot_summary.total}</span></div>
                  <div class="p-3 bg-surface-950 rounded-2xl border border-admin-border"><span class="text-emerald-400 text-[10px] block">AVAILABLE</span><span class="text-base font-black text-emerald-400">${d.slot_summary.available}</span></div>
                  <div class="p-3 bg-surface-950 rounded-2xl border border-admin-border"><span class="text-indigo-400 text-[10px] block">ASSIGNED</span><span class="text-base font-black text-indigo-400">${d.slot_summary.assigned}</span></div>
                </div>
              </div>

              <div class="lg:col-span-6 admin-card rounded-3xl p-6 space-y-4">
                <h3 class="text-base font-black text-white">Attention Required</h3>
                <div class="space-y-2">
                  ${d.attention_items.length === 0 ? `
                    <div class="p-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-mono">
                      ✓ Everything looks good. No action required.
                    </div>
                  ` : d.attention_items.map(item => `
                    <div class="p-3 rounded-2xl bg-surface-950 border border-amber-500/30 flex justify-between items-center text-xs font-mono">
                      <span class="text-amber-300">⚠ ${item.text}</span>
                      <button onclick="switchAdminSection('${item.link}')" class="px-2.5 py-1 rounded-lg bg-amber-500/10 text-amber-400 font-bold hover:bg-amber-500/20">Resolve</button>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>

          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="admin-card p-8 text-center text-rose-400 text-xs font-mono">Unable to load dashboard data. <button onclick="renderAdminOverview(document.getElementById('adminMainContent'))" class="ml-2 underline text-white">Retry</button></div>`;
      }
    }

    // =========================================================================
    // OTHER ADMIN MODULES (PRESERVED IN FULL)
    // =========================================================================
    async function renderAdminProductsStudio(container) {
      container.innerHTML = '<div class="text-center py-16 text-slate-500 font-mono">Loading Product Studio...</div>';
      try {
        const prods = await fetchJSON('/api/admin/products', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        container.innerHTML = `
          <div class="space-y-6 font-mono text-xs">
            <h1 class="text-xl font-black text-white font-sans">Product Studio</h1>
            <div class="admin-card rounded-3xl p-6">
              <table class="w-full text-left">
                <thead><tr class="border-b border-admin-border text-slate-500"><th class="pb-2">Name</th><th class="pb-2">Price</th><th class="pb-2">Status</th></tr></thead>
                <tbody class="divide-y divide-admin-border">${prods.map(p => `<tr><td class="py-3 text-white font-bold">${p.name}</td><td class="py-3 text-emerald-400">₹${p.sale_price}</td><td class="py-3">${p.status}</td></tr>`).join('')}</tbody>
              </table>
            </div>
          </div>
        `;
      } catch (e) { container.innerHTML = `<div class="admin-card p-8 text-rose-400 text-xs font-mono">${e.message}</div>`; }
    }

    async function renderAdminAccountSlots(container) {
      container.innerHTML = '<div class="text-center py-16 text-slate-500 font-mono">Loading Account Slots...</div>';
      try {
        const data = await fetchJSON('/api/admin/slots', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        container.innerHTML = `
          <div class="space-y-6 font-mono text-xs">
            <h1 class="text-xl font-black text-white font-sans">Account Slots Management</h1>
            <div class="admin-card rounded-3xl p-6">
              <table class="w-full text-left">
                <thead><tr class="border-b border-admin-border text-slate-500"><th class="pb-3">Slot</th><th class="pb-3">Email</th><th class="pb-3">Status</th></tr></thead>
                <tbody class="divide-y divide-admin-border">${(data.slots || []).map(s => `<tr><td class="py-3 text-white font-bold">${s.account_label}</td><td class="py-3 text-slate-400">${s.email}</td><td class="py-3 text-emerald-400">${s.status}</td></tr>`).join('')}</tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) { container.innerHTML = `<div class="admin-card p-8 text-center text-rose-400 text-xs font-mono">${err.message}</div>`; }
    }

    async function renderAdminSubscriptions(container) {
      container.innerHTML = '<div class="text-center py-16 text-slate-500 font-mono">Loading Subscriptions...</div>';
      try {
        const data = await fetchJSON('/api/admin/subscriptions/advanced', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        container.innerHTML = `
          <div class="space-y-6 font-mono text-xs">
            <h1 class="text-xl font-black text-white font-sans">Subscriptions Suite</h1>
            <div class="admin-card rounded-3xl p-6">
              <table class="w-full text-left">
                <thead><tr class="border-b border-admin-border text-slate-500"><th class="pb-3">Customer</th><th class="pb-3">Product</th><th class="pb-3">Status</th></tr></thead>
                <tbody class="divide-y divide-admin-border">${(data.subscriptions || []).map(s => `<tr><td class="py-3 text-white font-bold">${s.user_id?.username || 'Customer'}</td><td class="py-3">${s.product_name}</td><td class="py-3 text-emerald-400 font-bold">${s.status}</td></tr>`).join('')}</tbody>
              </table>
            </div>
          </div>
        `;
      } catch (e) { container.innerHTML = `<div class="admin-card p-8 text-rose-400 text-xs font-mono">${e.message}</div>`; }
    }

    async function renderAdminTransactions(container) {
      try {
        const txns = await fetchJSON('/api/admin/transactions', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        container.innerHTML = `
          <div class="space-y-6 font-mono text-xs">
            <h1 class="text-xl font-black text-white font-sans">Transactions</h1>
            <div class="admin-card rounded-3xl p-6">
              <table class="w-full text-left">
                <thead><tr class="border-b border-admin-border text-slate-500"><th class="pb-3">TXN</th><th class="pb-3">Customer</th><th class="pb-3">Amount</th><th class="pb-3">Status</th></tr></thead>
                <tbody class="divide-y divide-admin-border">${txns.map(t => `<tr><td class="py-3 text-white font-bold">${t.txn_id}</td><td class="py-3">${t.customer_name}</td><td class="py-3 text-emerald-400 font-bold">₹${t.amount}</td><td class="py-3">${t.status}</td></tr>`).join('')}</tbody>
              </table>
            </div>
          </div>
        `;
      } catch (e) { container.innerHTML = `<div class="admin-card p-8 text-rose-400 text-xs font-mono">${e.message}</div>`; }
    }

    async function renderAdminCustomers(container) {
      try {
        const custs = await fetchJSON('/api/admin/customers/list', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        container.innerHTML = `
          <div class="space-y-6 font-mono text-xs">
            <h1 class="text-xl font-black text-white font-sans">Customers</h1>
            <div class="admin-card rounded-3xl p-6">
              <table class="w-full text-left">
                <thead><tr class="border-b border-admin-border text-slate-500"><th class="pb-3">Username</th><th class="pb-3">Email</th></tr></thead>
                <tbody class="divide-y divide-admin-border">${custs.map(c => `<tr><td class="py-3 text-white font-bold">@${c.username || c.name}</td><td class="py-3 text-slate-400">${c.email}</td></tr>`).join('')}</tbody>
              </table>
            </div>
          </div>
        `;
      } catch (e) { container.innerHTML = `<div class="admin-card p-8 text-rose-400 text-xs font-mono">${e.message}</div>`; }
    }

    async function renderAdminPaymentSettings(container) {
      try {
        const s = await fetchJSON('/api/admin/payment-settings', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        container.innerHTML = `<div class="admin-card rounded-3xl p-6 text-white font-mono text-xs space-y-2"><h1 class="text-xl font-black font-sans">Payment Gateway</h1><div>UPI ID: <span class="text-emerald-400">${s.upi_id}</span></div></div>`;
      } catch (e) { container.innerHTML = `<div class="admin-card p-8 text-rose-400 text-xs font-mono">${e.message}</div>`; }
    }

    async function renderAdminSystemMonitor(container) {
      try {
        const d = await fetchJSON('/api/admin/system/infrastructure', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        container.innerHTML = `<div class="admin-card rounded-3xl p-6 text-white font-mono text-xs space-y-2"><h1 class="text-xl font-black font-sans">Website Status</h1><div>Database: <span class="text-emerald-400">${d.database?.status}</span> (${d.database?.ping_latency_ms}ms)</div></div>`;
      } catch (e) { container.innerHTML = `<div class="admin-card p-8 text-rose-400 text-xs font-mono">${e.message}</div>`; }
    }

    document.addEventListener('DOMContentLoaded', () => { navigate('admin-center'); });
  </script>
</body>
</html>
