<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lofi Room</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #05070f;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Fullscreen Japanese Lofi GIF Background */
    .bg-gif {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.65) contrast(1.05);
      pointer-events: none;
    }

    /* Ambient Glass Card */
    .glass-dock {
      background: rgba(10, 15, 29, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.6), inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Visualizer Bar Animations */
    .eq-bar {
      width: 3px;
      border-radius: 99px;
      background: #34d399;
      animation: bounceEQ 1.2s ease-in-out infinite alternate;
    }
    .eq-paused {
      animation-play-state: paused !important;
      height: 4px !important;
    }
    .bar-1 { height: 14px; animation-delay: 0.1s; }
    .bar-2 { height: 22px; animation-delay: 0.3s; }
    .bar-3 { height: 10px; animation-delay: 0.2s; }
    .bar-4 { height: 18px; animation-delay: 0.4s; }

    @keyframes bounceEQ {
      0% { height: 4px; }
      50% { height: 22px; }
      100% { height: 8px; }
    }
  </style>
</head>
<body class="h-[100dvh] w-full flex flex-col justify-between p-6 relative select-none">

  <!-- Fullscreen Japanese Lofi GIF Background -->
  <img 
    class="bg-gif" 
    src="https://media.giphy.com/media/l41lFw057lAJQMwg0/giphy.gif" 
    alt="Japanese Lofi View"
  />

  <!-- Subtle Film Vignette Overlay -->
  <div class="fixed inset-0 bg-gradient-to-t from-black/70 via-transparent to-black/40 pointer-events-none z-[1]"></div>

  <!-- Top Simple Bar -->
  <header class="relative z-10 flex items-center justify-between w-full max-w-4xl mx-auto">
    <div class="flex items-center gap-2.5">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-xs uppercase tracking-widest font-semibold text-white/80">Lofi Lounge</span>
    </div>
    <div id="liveClock" class="text-xs font-mono font-medium text-white/70">--:--:--</div>
  </header>

  <!-- Center Minimalist Typography -->
  <main class="relative z-10 flex flex-col items-center justify-center text-center space-y-2">
    <h1 class="text-3xl sm:text-5xl font-extralight tracking-widest text-white/90 drop-shadow-lg">
      東京 • 静けさ
    </h1>
    <p class="text-xs sm:text-sm font-light text-slate-300/80 tracking-wide max-w-sm">
      Peaceful moments, Japanese rain & chilled lofi beats.
    </p>
  </main>

  <!-- Bottom Floating Audio Control Dock -->
  <footer class="relative z-10 w-full max-w-sm mx-auto mb-2">
    <div class="glass-dock rounded-2xl p-4 flex items-center justify-between">
      
      <!-- Audio Status & Meta -->
      <div class="flex items-center gap-3">
        <!-- Visualizer -->
        <div class="flex items-end gap-1 h-6 px-1">
          <span class="eq-bar bar-1 eq-paused" id="eq1"></span>
          <span class="eq-bar bar-2 eq-paused" id="eq2"></span>
          <span class="eq-bar bar-3 eq-paused" id="eq3"></span>
          <span class="eq-bar bar-4 eq-paused" id="eq4"></span>
        </div>

        <div>
          <div class="text-xs font-semibold text-white tracking-wide" id="trackTitle">Lofi Radio (24/7)</div>
          <div class="text-[11px] text-slate-400" id="playStatus">Paused • Click play</div>
        </div>
      </div>

      <!-- Play / Pause Button -->
      <button 
        id="playBtn" 
        onclick="toggleLofiAudio()" 
        class="w-10 h-10 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-gray-950 flex items-center justify-center transition-all shadow-lg shadow-emerald-500/25 focus:outline-none"
        aria-label="Toggle Audio"
      >
        <svg id="playIcon" class="w-5 h-5 ml-0.5" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <svg id="pauseIcon" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
      </button>

    </div>
  </footer>

  <!-- Audio Stream (Direct 24/7 Lofi Stream) -->
  <audio id="lofiPlayer" preload="none" src="https://stream.zeno.fm/f3wvbbqmdg8uv"></audio>

  <script>
    const audio = document.getElementById('lofiPlayer');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const statusText = document.getElementById('playStatus');
    const eqBars = [
      document.getElementById('eq1'),
      document.getElementById('eq2'),
      document.getElementById('eq3'),
      document.getElementById('eq4')
    ];

    function toggleLofiAudio() {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.classList.add('hidden');
          pauseIcon.classList.remove('hidden');
          statusText.textContent = "Live • Streaming";
          eqBars.forEach(b => b.classList.remove('eq-paused'));
        }).catch(() => {
          statusText.textContent = "Click again to allow stream";
        });
      } else {
        audio.pause();
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        statusText.textContent = "Paused";
        eqBars.forEach(b => b.classList.add('eq-paused'));
      }
    }

    function updateTime() {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString([], { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit' 
      });
    }

    setInterval(updateTime, 1000);
    updateTime();
  </script>
</body>
</html>
