<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS DIGITAL — Digital Goods & Subscriptions</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: { 500: '#10b981', 600: '#059669' },
            surface: { 800: '#111827', 900: '#0b0f19', 950: '#030712' },
            admin: { sidebar: '#090d16', bg: '#05070d', card: '#0f1422', border: '#1c2438' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="min-h-screen flex flex-col antialiased">

  <div id="toastHub" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
  <div id="appBackdrop" onclick="closeAllDrawers()" class="fixed inset-0 bg-black/60 z-40 hidden transition-opacity duration-200"></div>

  <!-- Customer Sidebar Drawer -->
  <aside id="customerSidebar" onclick="event.stopPropagation()" class="fixed top-0 bottom-0 left-0 w-64 bg-surface-900 border-r border-white/5 z-50 flex flex-col justify-between transition-transform duration-300 -translate-x-full shadow-2xl">
    <div>
      <div class="p-6 border-b border-white/5 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
          <div class="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center font-black text-gray-950 shadow-lg shadow-emerald-500/20">N</div>
          <div><span class="font-extrabold text-sm tracking-wider text-white block">NEXUS</span><span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">DIGITAL VAULT</span></div>
        </div>
        <button onclick="toggleCustomerDrawer(false)" class="text-slate-400 hover:text-white p-2 font-bold text-base">✕</button>
      </div>
      <nav class="p-4 space-y-1.5 text-xs font-semibold">
        <button onclick="navigate('home')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 active:bg-white/10 transition-colors"><span>🏠</span> Home</button>
        <button onclick="navigate('cart')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 active:bg-white/10 transition-colors"><span>🛒</span> Your Cart</button>
        <button onclick="navigate('orders')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 active:bg-white/10 transition-colors"><span>📦</span> Purchased Items</button>
        <button onclick="navigate('account')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 active:bg-white/10 transition-colors"><span>👤</span> Account</button>
      </nav>
    </div>
    <div class="p-4 border-t border-white/5 text-slate-500 text-[10px] font-mono text-center">
      Nexus Digital Vault v2.6
    </div>
  </aside>

  <!-- Admin Sidebar Drawer -->
  <aside id="adminSidebar" onclick="event.stopPropagation()" class="fixed top-0 bottom-0 left-0 w-64 bg-admin-sidebar border-r border-admin-border flex flex-col justify-between z-50 transition-transform duration-300 -translate-x-full lg:translate-x-0 shadow-2xl">
    <div>
      <div class="p-6 border-b border-admin-border flex items-center justify-between">
        <div><span class="text-xs font-black text-emerald-400 uppercase tracking-widest block font-mono">NEXUS CONTROL</span><span class="text-sm font-bold text-white">Admin Hub</span></div>
        <button onclick="toggleAdminDrawer(false)" class="lg:hidden text-slate-400 p-2 font-bold text-base">✕</button>
      </div>
      <nav class="p-4 space-y-1 text-xs font-bold font-mono">
        <button onclick="switchAdminSection('dashboard')" id="adnav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 active:bg-white/15">📊 Overview Dashboard</button>
        <button onclick="switchAdminSection('products')" id="adnav-products" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 active:bg-white/15">📦 Product Studio</button>
        <button onclick="switchAdminSection('slots')" id="adnav-slots" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 active:bg-white/15">🔐 Account Slots</button>
        <button onclick="switchAdminSection('subscriptions')" id="adnav-subscriptions" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 active:bg-white/15">👥 Subscriptions Suite</button>
        <button onclick="switchAdminSection('transactions')" id="adnav-transactions" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 active:bg-white/15">💳 Transactions</button>
        <button onclick="switchAdminSection('customers')" id="adnav-customers" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 active:bg-white/15">👤 Customers</button>
        <button onclick="switchAdminSection('payment-settings')" id="adnav-payment-settings" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 active:bg-white/15">💰 Payment Gateway</button>
        <button onclick="switchAdminSection('system-monitor')" id="adnav-system-monitor" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 active:bg-white/15">🌐 Website Status</button>
      </nav>
    </div>
    <div class="p-4 border-t border-admin-border space-y-2 font-mono">
      <button onclick="navigate('home')" class="w-full py-2.5 rounded-xl bg-white/5 text-slate-400 hover:text-white text-xs font-bold">👁 Customer Store</button>
      <button onclick="adminSignOut()" class="w-full py-2.5 rounded-xl bg-rose-500/10 text-rose-400 text-xs font-bold">🚪 End Session</button>
    </div>
  </aside>

  <!-- Dynamic Screen Viewport -->
  <div id="mainViewport" class="flex flex-1 min-h-screen"></div>

  <!-- Global Modal Dialog Container -->
  <div id="globalModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-2 sm:p-4">
    <div class="glass max-w-5xl w-full rounded-3xl p-5 sm:p-8 relative max-h-[94vh] overflow-y-auto custom-scroll shadow-2xl border border-white/10" id="globalModalContent"></div>
  </div>

  <!-- Core Infrastructure Modules -->
  <script src="/js/state.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/router.js"></script>

  <!-- Storefront Modules -->
  <script src="/js/store-home.js"></script>
  <script src="/js/store-product.js"></script>
  <script src="/js/store-cart.js"></script>
  <script src="/js/store-checkout.js"></script>
  <script src="/js/store-orders.js"></script>
  <script src="/js/store-auth.js"></script>

  <!-- Admin Suite Modules -->
  <script src="/js/dashboard.js"></script>
  <script src="/js/product-studio.js"></script>
  <script src="/js/slots.js"></script>
  <script src="/js/subscriptions.js"></script>
  <script src="/js/transactions.js"></script>
  <script src="/js/customers.js"></script>
  <script src="/js/payment-settings.js"></script>
  <script src="/js/website-status.js"></script>

</body>
</html>
