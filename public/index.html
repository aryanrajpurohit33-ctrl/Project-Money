<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS DIGITAL — Digital Goods & Subscriptions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: { 500: '#10b981', 600: '#059669' },
            surface: { 800: '#111827', 900: '#0b0f19', 950: '#030712' },
            admin: {
              sidebar: '#090d16',
              bg: '#05070d',
              card: '#0f1422',
              border: '#1c2438'
            }
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
    
    .glass {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .glass-card {
      background: linear-gradient(135deg, rgba(31, 41, 55, 0.45) 0%, rgba(17, 24, 39, 0.6) 100%);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      border-color: rgba(16, 185, 129, 0.4);
      transform: translateY(-4px);
    }

    .admin-card {
      background-color: #0f1422;
      border: 1px solid #1c2438;
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <div id="toastHub" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
  <div id="appBackdrop" onclick="closeAllDrawers()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden transition-opacity"></div>
  <div id="mainViewport" class="flex flex-1 min-h-screen"></div>

  <!-- Global Modal for Inspection & Edit Forms -->
  <div id="globalModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass max-w-2xl w-full rounded-3xl p-6 relative max-h-[90vh] overflow-y-auto custom-scroll" id="globalModalContent"></div>
  </div>

  <script>
    const state = {
      sessionId: 'sess_' + Math.random().toString(36).substring(2, 12),
      user: JSON.parse(localStorage.getItem('nexus_user') || 'null'),
      token: localStorage.getItem('nexus_token') || '',
      adminToken: localStorage.getItem('nexus_admin_token') || '',
      adminUsername: localStorage.getItem('nexus_admin_user') || '',
      cart: JSON.parse(localStorage.getItem('nexus_cart') || '[]'),
      currentView: 'home',
      adminSection: 'dashboard',
      paymentSettings: null
    };

    function showToast(message, type = 'success') {
      const hub = document.getElementById('toastHub');
      const toast = document.createElement('div');
      const colors = type === 'success' ? 'bg-emerald-500 text-gray-950' : 'bg-rose-500 text-white';
      toast.className = `px-5 py-3 rounded-2xl font-bold text-xs shadow-2xl flex items-center gap-2 transform transition-all duration-300 translate-y-[-10px] opacity-0 ${colors}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span> <span>${message}</span>`;
      hub.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-[-10px]', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-x-full');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function closeAllDrawers() {
      document.getElementById('appBackdrop').classList.add('hidden');
      const cSide = document.getElementById('customerSidebar');
      if (cSide) cSide.classList.add('-translate-x-full');
      const aSide = document.getElementById('adminSidebar');
      if (aSide) aSide.classList.add('-translate-x-full');
      document.getElementById('globalModal').classList.add('hidden');
    }

    function toggleCustomerDrawer(open) {
      const side = document.getElementById('customerSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) { side.classList.remove('-translate-x-full'); drop.classList.remove('hidden'); }
      else { side.classList.add('-translate-x-full'); drop.classList.add('hidden'); }
    }

    function toggleAdminDrawer(open) {
      const side = document.getElementById('adminSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) { side.classList.remove('-translate-x-full'); drop.classList.remove('hidden'); }
      else { side.classList.add('-translate-x-full'); drop.classList.add('hidden'); }
    }

    function navigate(view, params = {}) {
      state.currentView = view;
      closeAllDrawers();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const viewport = document.getElementById('mainViewport');
      if (view === 'admin-center') {
        if (!state.adminToken) renderAdminLogin(viewport);
        else renderAdminSaaSLayout(viewport);
        return;
      }
      renderStorefrontLayout(viewport, view, params);
    }

    // =========================================================================
    // STOREFRONT LAYOUT & PRODUCTS
    // =========================================================================
    function renderStorefrontLayout(viewport, view, params) {
      viewport.innerHTML = `
        <div class="flex flex-1 min-h-screen relative w-full bg-surface-950">
          <aside id="customerSidebar" class="fixed lg:static top-0 bottom-0 left-0 w-64 bg-surface-900 border-r border-white/5 z-50 flex flex-col justify-between transition-transform duration-300 -translate-x-full lg:translate-x-0">
            <div>
              <div class="p-6 border-b border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
                  <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center font-black text-gray-950 shadow-lg shadow-emerald-500/20">N</div>
                  <div>
                    <span class="font-extrabold text-sm tracking-wider text-white block">NEXUS</span>
                    <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">DIGITAL VAULT</span>
                  </div>
                </div>
                <button onclick="toggleCustomerDrawer(false)" class="lg:hidden text-slate-400 p-1">✕</button>
              </div>

              <nav class="p-4 space-y-1.5 text-xs font-semibold">
                <button onclick="navigate('home')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>🏠</span> <span>Home</span></button>
                <button onclick="navigate('products')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>🛍</span> <span>All Products</span></button>
                <button onclick="navigate('cart')" class="w-full flex items-center justify-between px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all">
                  <div class="flex items-center gap-3"><span>🛒</span> <span>My Cart</span></div>
                  <span class="cart-count-badge px-2 py-0.5 rounded-full text-[10px] font-black bg-emerald-500 text-gray-950">${state.cart.length}</span>
                </button>
                <button onclick="navigate('orders')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>📦</span> <span>Purchased Items</span></button>
                <button onclick="navigate('account')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>👤</span> <span>${state.user ? state.user.name : 'My Account'}</span></button>
              </nav>
            </div>

            <div class="p-4 border-t border-white/5">
              <button onclick="navigate('admin-center')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold text-slate-400 bg-white/[0.03] hover:bg-emerald-500/10 hover:text-emerald-400 border border-white/5 transition-all">
                <span>🔐</span> <span>Admin Panel</span>
              </button>
            </div>
          </aside>

          <div class="flex-1 flex flex-col min-w-0">
            <header class="sticky top-0 z-30 glass border-b border-white/5 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <button onclick="toggleCustomerDrawer(true)" class="lg:hidden p-2 rounded-xl bg-white/5 text-slate-300">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <span class="text-xs font-bold text-slate-400">Digital Goods & Subscriptions</span>
              </div>
              <div class="flex items-center gap-3">
                <button onclick="navigate('cart')" class="relative p-2.5 rounded-xl bg-surface-900 border border-white/5 text-slate-300">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                  <span class="cart-count-badge absolute -top-1 -right-1 w-5 h-5 rounded-full bg-emerald-500 text-gray-950 text-[10px] font-black flex items-center justify-center">${state.cart.length}</span>
                </button>
              </div>
            </header>

            <main id="storeContent" class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto space-y-8"></main>
          </div>
        </div>
      `;

      const storeContent = document.getElementById('storeContent');
      switch(view) {
        case 'home':
        case 'products': renderStoreProducts(storeContent); break;
        case 'product-details': renderStoreProductDetails(storeContent, params.id); break;
        case 'cart': renderStoreCart(storeContent); break;
        case 'checkout': renderStoreCheckout(storeContent); break;
        case 'orders': renderStoreOrders(storeContent); break;
        case 'account': renderStoreAccount(storeContent); break;
      }
    }

    async function renderStoreProducts(container) {
      container.innerHTML = '<div class="text-center py-16 text-slate-500 font-bold animate-pulse">Loading catalog...</div>';
      const res = await fetch('/api/products');
      const products = await res.json();

      container.innerHTML = `
        <div class="space-y-6">
          <div>
            <h1 class="text-xl font-black text-white">Digital Products & Subscriptions</h1>
            <p class="text-xs text-slate-400">Choose one-time digital goods or flexible monthly/yearly subscriptions</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            ${products.map(p => `
              <div class="glass-card rounded-3xl overflow-hidden flex flex-col justify-between border border-white/5 relative group cursor-pointer" onclick="navigate('product-details', { id: '${p._id}' })">
                <span class="absolute top-3 left-3 z-10 px-2.5 py-1 rounded-full ${p.product_type === 'SUBSCRIPTION' ? 'bg-indigo-500' : 'bg-emerald-500'} text-white font-black text-[10px] uppercase">
                  ${p.product_type === 'SUBSCRIPTION' ? '🔄 Subscription' : '⚡ One-Time'}
                </span>

                <div>
                  <div class="h-44 w-full overflow-hidden bg-surface-900">
                    <img src="${p.images[0] || 'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                  </div>
                  <div class="p-5 space-y-2">
                    <h3 class="text-sm font-bold text-white line-clamp-1 group-hover:text-emerald-400 transition-colors">${p.name}</h3>
                    <p class="text-xs text-slate-400 line-clamp-2">${p.short_description || p.description}</p>
                  </div>
                </div>

                <div class="px-5 pb-5 pt-2 flex items-center justify-between border-t border-white/5" onclick="event.stopPropagation()">
                  <div>
                    <span class="text-base font-black text-white">₹${p.sale_price}</span>
                    <span class="text-[10px] ${p.in_stock ? 'text-emerald-400' : 'text-rose-400'} font-bold block">${p.in_stock ? '● In Stock' : '✕ Out of Stock'}</span>
                  </div>
                  <button onclick="navigate('product-details', { id: '${p._id}' })" class="px-4 py-2 rounded-xl bg-emerald-500 text-gray-950 font-black text-xs uppercase">Select</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    let selectedSubDuration = '1_MONTH';
    let currentSelectedPrice = 199;

    async function renderStoreProductDetails(container, productId) {
      container.innerHTML = '<div class="text-center py-20 text-slate-500 font-bold animate-pulse">Loading product details...</div>';
      const res = await fetch(`/api/products/${productId}`);
      const p = await res.json();
      selectedSubDuration = '1_MONTH';
      currentSelectedPrice = p.product_type === 'SUBSCRIPTION' ? p.subscription_pricing.one_month : p.sale_price;

      container.innerHTML = `
        <div class="space-y-10">
          <button onclick="navigate('products')" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">← Back to Catalog</button>
          
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7">
              <div class="h-72 sm:h-96 rounded-3xl overflow-hidden glass border border-white/10">
                <img src="${p.images[0] || 'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800'}" class="w-full h-full object-cover">
              </div>
            </div>

            <div class="lg:col-span-5 space-y-6">
              <div>
                <span class="px-3 py-1 rounded-full ${p.product_type === 'SUBSCRIPTION' ? 'bg-indigo-500/20 text-indigo-400' : 'bg-emerald-500/20 text-emerald-400'} font-bold text-[10px] uppercase">
                  ${p.product_type === 'SUBSCRIPTION' ? '🔄 Subscription Tier' : '⚡ One-Time Digital Product'}
                </span>
                <h1 class="text-2xl sm:text-3xl font-black text-white mt-2">${p.name}</h1>
                <p class="text-xs text-slate-400 mt-1">${p.short_description || ''}</p>
              </div>

              ${p.product_type === 'SUBSCRIPTION' ? `
                <div class="space-y-2">
                  <label class="text-xs font-bold text-slate-300">Select Subscription Duration:</label>
                  <div class="grid grid-cols-3 gap-2">
                    <button onclick="pickDuration('1_MONTH', ${p.subscription_pricing.one_month})" id="dur-1_MONTH" class="dur-btn p-3 rounded-2xl border-2 border-emerald-500 bg-emerald-500/10 text-center">
                      <span class="text-xs font-black text-white block">1 Month</span>
                      <span class="text-[11px] font-mono text-emerald-400">₹${p.subscription_pricing.one_month}</span>
                    </button>
                    <button onclick="pickDuration('6_MONTHS', ${p.subscription_pricing.six_months})" id="dur-6_MONTHS" class="dur-btn p-3 rounded-2xl border border-white/10 glass text-center">
                      <span class="text-xs font-black text-white block">6 Months</span>
                      <span class="text-[11px] font-mono text-emerald-400">₹${p.subscription_pricing.six_months}</span>
                    </button>
                    <button onclick="pickDuration('1_YEAR', ${p.subscription_pricing.one_year})" id="dur-1_YEAR" class="dur-btn p-3 rounded-2xl border border-white/10 glass text-center">
                      <span class="text-xs font-black text-white block">1 Year</span>
                      <span class="text-[11px] font-mono text-emerald-400">₹${p.subscription_pricing.one_year}</span>
                    </button>
                  </div>
                </div>
              ` : ''}

              <div class="p-5 rounded-3xl glass border border-white/5">
                <div class="text-3xl font-black text-white" id="displayActivePrice">₹${currentSelectedPrice}</div>
                <span class="text-xs ${p.in_stock ? 'text-emerald-400' : 'text-rose-400'} font-bold">
                  ${p.in_stock ? `● Available in Stock (${p.stock_count} slots)` : '✕ Out of Stock'}
                </span>
              </div>

              <button onclick="checkoutDirect('${p._id}', '${p.name.replace(/'/g, "\\'")}', '${p.product_type}')" ${!p.in_stock ? 'disabled' : ''} class="w-full py-4 rounded-2xl ${p.in_stock ? 'bg-emerald-500 text-gray-950 font-black' : 'bg-gray-800 text-gray-500'} text-xs uppercase tracking-wider shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
                ${p.in_stock ? 'Proceed to Payment (UPI / Crypto)' : 'Out of Stock'}
              </button>
            </div>
          </div>

          <div class="glass rounded-3xl p-6 sm:p-8 space-y-4">
            <h3 class="text-sm font-black text-white uppercase">Product Overview</h3>
            <p class="text-xs text-slate-300 leading-relaxed whitespace-pre-line">${p.description}</p>
          </div>
        </div>
      `;
    }

    function pickDuration(dur, price) {
      selectedSubDuration = dur;
      currentSelectedPrice = price;
      document.getElementById('displayActivePrice').textContent = `₹${price}`;
      document.querySelectorAll('.dur-btn').forEach(b => b.className = 'dur-btn p-3 rounded-2xl border border-white/10 glass text-center');
      document.getElementById(`dur-${dur}`).className = 'dur-btn p-3 rounded-2xl border-2 border-emerald-500 bg-emerald-500/10 text-center';
    }

    function checkoutDirect(id, name, product_type) {
      state.cart = [{
        product_id: id,
        name: name + (product_type === 'SUBSCRIPTION' ? ` (${selectedSubDuration.replace('_', ' ')})` : ''),
        price: currentSelectedPrice,
        product_type: product_type,
        duration: product_type === 'SUBSCRIPTION' ? selectedSubDuration : 'ONE_TIME'
      }];
      localStorage.setItem('nexus_cart', JSON.stringify(state.cart));
      navigate('checkout');
    }

    // =========================================================================
    // CHECKOUT & SCREENSHOT SUBMISSION
    // =========================================================================
    async function renderStoreCheckout(container) {
      if (!state.token) return renderCustomerAuthPrompt(container, 'checkout');
      if (!state.cart.length) return navigate('products');

      const pRes = await fetch('/api/payment-methods');
      state.paymentSettings = await pRes.json();
      const item = state.cart[0];

      container.innerHTML = `
        <div class="max-w-3xl mx-auto space-y-8">
          <div>
            <h1 class="text-2xl font-black text-white">Choose Payment Method</h1>
            <p class="text-xs text-slate-400">Order: ${item.name} — Amount: ₹${item.price}</p>
          </div>

          <div id="chkStep1" class="space-y-4">
            <div onclick="selectPaymentMethod('UPI')" id="methodCardUPI" class="glass rounded-3xl p-6 cursor-pointer border-2 border-emerald-500/80 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="text-2xl">💳</span>
                <div>
                  <h3 class="text-sm font-bold text-white">Instant UPI Pay</h3>
                  <p class="text-[10px] text-slate-400">Google Pay, PhonePe, Paytm</p>
                </div>
              </div>
              <span id="radioUPI" class="w-4 h-4 rounded-full border-2 border-emerald-400 bg-emerald-400"></span>
            </div>

            <div onclick="selectPaymentMethod('CRYPTO')" id="methodCardCrypto" class="glass rounded-3xl p-6 cursor-pointer border border-white/5 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="text-2xl">₿</span>
                <div>
                  <h3 class="text-sm font-bold text-white">Cryptocurrency</h3>
                  <p class="text-[10px] text-slate-400">${state.paymentSettings.crypto_currency} (${state.paymentSettings.crypto_network})</p>
                </div>
              </div>
              <span id="radioCrypto" class="w-4 h-4 rounded-full border-2 border-slate-600"></span>
            </div>

            <button onclick="startCheckoutPayment()" id="chkNextBtn" class="w-full py-4 rounded-2xl bg-emerald-500 text-gray-950 font-black text-xs uppercase tracking-wider">
              Continue to Payment Details →
            </button>
          </div>

          <div id="chkStep2" class="hidden space-y-6"></div>
        </div>
      `;
    }

    let selectedMethod = 'UPI';
    function selectPaymentMethod(m) {
      selectedMethod = m;
      if (m === 'UPI') {
        document.getElementById('methodCardUPI').className = 'glass rounded-3xl p-6 cursor-pointer border-2 border-emerald-500/80 flex items-center justify-between';
        document.getElementById('methodCardCrypto').className = 'glass rounded-3xl p-6 cursor-pointer border border-white/5 flex items-center justify-between';
        document.getElementById('radioUPI').className = 'w-4 h-4 rounded-full border-2 border-emerald-400 bg-emerald-400';
        document.getElementById('radioCrypto').className = 'w-4 h-4 rounded-full border-2 border-slate-600';
      } else {
        document.getElementById('methodCardCrypto').className = 'glass rounded-3xl p-6 cursor-pointer border-2 border-emerald-500/80 flex items-center justify-between';
        document.getElementById('methodCardUPI').className = 'glass rounded-3xl p-6 cursor-pointer border border-white/5 flex items-center justify-between';
        document.getElementById('radioCrypto').className = 'w-4 h-4 rounded-full border-2 border-emerald-400 bg-emerald-400';
        document.getElementById('radioUPI').className = 'w-4 h-4 rounded-full border-2 border-slate-600';
      }
    }

    async function startCheckoutPayment() {
      const btn = document.getElementById('chkNextBtn');
      btn.disabled = true;
      btn.textContent = 'Generating Transaction...';

      try {
        const res = await fetch('/api/checkout/initiate-order', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.token}`
          },
          body: JSON.stringify({
            items: state.cart,
            payment_method: selectedMethod
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        document.getElementById('chkStep1').classList.add('hidden');
        const step2 = document.getElementById('chkStep2');
        step2.classList.remove('hidden');

        const ps = state.paymentSettings;
        const txn = data.transaction;

        let detailsHTML = selectedMethod === 'UPI' ? `
          <div class="text-center space-y-4">
            <img src="${ps.upi_qr_url}" class="w-56 h-56 mx-auto rounded-2xl glass p-2 bg-white object-contain">
            <div class="space-y-1">
              <span class="text-[10px] text-slate-500 uppercase font-bold">UPI ID</span>
              <div class="font-mono text-emerald-400 text-sm font-bold">${ps.upi_id}</div>
              <button onclick="navigator.clipboard.writeText('${ps.upi_id}'); showToast('Copied UPI ID!')" class="text-xs text-slate-400 hover:text-white underline">Copy UPI ID</button>
            </div>
            <div class="text-xs text-slate-400 max-w-sm mx-auto whitespace-pre-line text-left bg-surface-950 p-4 rounded-2xl">${ps.upi_instructions}</div>
          </div>
        ` : `
          <div class="text-center space-y-4">
            <img src="${ps.crypto_qr_url}" class="w-56 h-56 mx-auto rounded-2xl glass p-2 bg-white object-contain">
            <div class="space-y-1">
              <span class="text-[10px] text-slate-500 uppercase font-bold">Wallet Address (${ps.crypto_currency} - ${ps.crypto_network})</span>

    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1280;
            let width = img.width;
            let height = img.height;
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

      try {

        const res = await fetch('/api/checkout/upload-proof-json', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.token}`

          body: JSON.stringify({
            transaction_id: txnId,

        if (!res.ok) throw new Error(data.error);

        state.cart = [];
        localStorage.removeItem('nexus_cart');
        showToast('Proof submitted! Payment is being verified.');
        navigate('orders');

    async function confirmAndAssignTransaction(id) {
      const selectEl = document.getElementById(`slotSelect-${id}`);
      const slot_id = selectEl ? selectEl.value : null;

      if (!confirm('Confirm this payment, bind the selected account slot, and activate the customer subscription?')) return;

      try {
        const res = await fetch(`/api/admin/transactions/${id}/confirm-and-assign`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.adminToken}`
          },
          body: JSON.stringify({ slot_id })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        showToast('Subscription activated and account slot bound!');
        renderAdminTransactions(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function rejectTransaction(id) {
      const reason = prompt('Enter rejection reason:', 'Payment screenshot invalid.');
      if (reason === null) return;

      try {
        const res = await fetch(`/api/admin/transactions/${id}/reject`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.adminToken}`
          },
          body: JSON.stringify({ reason })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showToast('Transaction rejected');
        renderAdminTransactions(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    function toggleProductTypeForm(val) {
      if (val === 'SUBSCRIPTION') {
        document.getElementById('subPricesContainer').classList.remove('hidden');
        document.getElementById('oneTimePriceContainer').classList.add('hidden');

    async function handleProductFormSubmit(e, productId) {
      e.preventDefault();
      const isNew = productId === 'new';
      const pType = document.getElementById('npType').value;
      const imageUrl = document.getElementById('npImageUrl').value.trim() || 'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800';

      const payload = {
        name: document.getElementById('npTitle').value,
        short_description: document.getElementById('npShort').value,
        description: document.getElementById('npFull').value,
        product_type: pType,
        images: [imageUrl],
        sale_price: pType === 'SUBSCRIPTION' ? Number(document.getElementById('npPrice1M').value) : Number(document.getElementById('npPrice').value),
        original_price: pType === 'SUBSCRIPTION' ? Number(document.getElementById('npPrice1M').value) * 1.5 : Number(document.getElementById('npPrice').value) * 1.5,
        subscription_pricing: {
          one_month: Number(document.getElementById('npPrice1M').value),
          six_months: Number(document.getElementById('npPrice6M').value),
          one_year: Number(document.getElementById('npPrice1Y').value)
        }
      };

      try {
        const url = isNew ? '/api/admin/products' : `/api/admin/products/${productId}`;
        const method = isNew ? 'POST' : 'PUT';

        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.adminToken}` },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error((await res.json()).error);

        showToast(isNew ? 'Product created!' : 'Product updated!');
        document.getElementById('globalModal').classList.add('hidden');
        renderAdminProductsStudio(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

        <div class="max-w-2xl space-y-6">
          <div>
            <h2 class="text-lg font-black text-white font-sans">Payment Gateway & QR Codes</h2>
            <p class="text-xs text-slate-400 font-mono">Upload your UPI QR Code image or paste URL</p>
          </div>

          <form onsubmit="saveAdminPaymentSettings(event)" class="space-y-6 text-xs font-mono">
            <div class="admin-card rounded-3xl p-6 space-y-4">
              <h3 class="font-bold text-emerald-400 uppercase">1. UPI Configuration</h3>
              <div class="space-y-3">
                <div>
                  <label class="text-[10px] text-slate-400 block mb-1">UPI ID (VPA)</label>
                  <input type="text" id="admUpiId" required value="${s.upi_id || ''}" placeholder="e.g. merchant@okaxis" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-white">
                </div>

                <div>
                  <label class="text-[10px] text-slate-400 block mb-1">UPI QR Code Image</label>
                  <div class="flex flex-col sm:flex-row gap-3 items-center">
                    <img id="upiQrPreviewImg" src="${s.upi_qr_url || 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi'}" class="w-24 h-24 rounded-2xl bg-white p-1 border border-white/20 object-contain shadow-lg">
                    
                    <div class="flex-1 w-full space-y-2">
                      <label class="w-full py-2.5 px-4 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center gap-2 cursor-pointer font-bold transition-all">
                        <span>📁</span> <span>Upload QR Code Image</span>
                        <input type="file" id="upiQrFileInput" accept="image/*" class="hidden" onchange="handleQrFileSelection(this, 'upi')">
                      </label>
                      
                      <input type="text" id="admUpiQr" value="${s.upi_qr_url || ''}" oninput="document.getElementById('upiQrPreviewImg').src=this.value" placeholder="Or paste image URL" class="w-full px-3 py-2 rounded-xl bg-surface-950 border border-admin-border text-[11px] text-slate-400">
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="admin-card rounded-3xl p-6 space-y-4">
              <h3 class="font-bold text-teal-400 uppercase">2. Crypto Configuration</h3>
              <div class="space-y-3">
                <div>
                  <label class="text-[10px] text-slate-400 block mb-1">Wallet Address (USDT TRC20)</label>
                  <input type="text" id="admCryptoWallet" required value="${s.crypto_wallet_address || ''}" placeholder="Wallet Address" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-white">
                </div>

                <div>
                  <label class="text-[10px] text-slate-400 block mb-1">Crypto QR Code Image</label>
                  <div class="flex flex-col sm:flex-row gap-3 items-center">
                    <img id="cryptoQrPreviewImg" src="${s.crypto_qr_url || 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=crypto'}" class="w-24 h-24 rounded-2xl bg-white p-1 border border-white/20 object-contain shadow-lg">
                    
                    <div class="flex-1 w-full space-y-2">
                      <label class="w-full py-2.5 px-4 rounded-xl bg-teal-500/10 hover:bg-teal-500/20 text-teal-400 border border-teal-500/30 flex items-center justify-center gap-2 cursor-pointer font-bold transition-all">
                        <span>📁</span> <span>Upload Crypto QR Image</span>
                        <input type="file" id="cryptoQrFileInput" accept="image/*" class="hidden" onchange="handleQrFileSelection(this, 'crypto')">
                      </label>
                      
                      <input type="text" id="admCryptoQr" value="${s.crypto_qr_url || ''}" oninput="document.getElementById('cryptoQrPreviewImg').src=this.value" placeholder="Or paste image URL" class="w-full px-3 py-2 rounded-xl bg-surface-950 border border-admin-border text-[11px] text-slate-400">
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <button type="submit" class="w-full py-4 rounded-2xl bg-emerald-500 text-gray-950 font-black uppercase tracking-wider font-sans shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
              Save Payment Settings
            </button>
          </form>
        </div>
      `;
    }

    async function handleQrFileSelection(input, type) {
      if (!input.files || !input.files[0]) return;
      try {
        const base64Data = await compressImageFile(input.files[0]);
        if (type === 'upi') {
          document.getElementById('admUpiQr').value = base64Data;
          document.getElementById('upiQrPreviewImg').src = base64Data;
        } else {
          document.getElementById('admCryptoQr').value = base64Data;
          document.getElementById('cryptoQrPreviewImg').src = base64Data;
        }
        showToast('QR Image processed and ready to save!');
      } catch (err) {
        showToast('Error reading image: ' + err.message, 'error');
      }
    }

    async function saveAdminPaymentSettings(e) {
      e.preventDefault();
      try {
        const res = await fetch('/api/admin/payment-settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.adminToken}` },
          body: JSON.stringify({
            upi_id: document.getElementById('admUpiId').value,
            upi_qr_url: document.getElementById('admUpiQr').value,
            crypto_wallet_address: document.getElementById('admCryptoWallet').value,
            crypto_qr_url: document.getElementById('admCryptoQr').value
          })
        });
        if (!res.ok) throw new Error((await res.json()).error);
        showToast('Payment settings saved successfully!');
      } catch (err) { showToast(err.message, 'error'); }
    }

    // =========================================================================
    // SYSTEM & INFRASTRUCTURE MONITOR
    // =========================================================================
    async function renderAdminSystemMonitor(container) {
      container.innerHTML = '<div class="text-center py-16 text-slate-500 font-mono animate-pulse">Running live infrastructure diagnostics & MongoDB ping...</div>';

      try {
        const res = await fetch('/api/admin/system/infrastructure', {
          headers: { 'Authorization': `Bearer ${state.adminToken}` }
        });
        const data = await res.json();

        container.innerHTML = `
          <div class="space-y-8 pb-12 font-mono">
            
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h1 class="text-xl font-black text-white font-sans">System & Infrastructure Monitor</h1>
                <p class="text-xs text-slate-400">Live hardware profiling, database cluster metrics & runtime diagnostics</p>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="runSystemHealthCheck()" class="px-4 py-2 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-bold hover:bg-emerald-500/20 transition-all font-sans">
                  🩺 Run Health Check
                </button>
                <button onclick="switchAdminSection('system-monitor')" class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 text-xs font-bold font-sans">
                  ↻ Refresh
                </button>
              </div>
            </div>

            <!-- Core Infrastructure KPI Row -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
              
              <div class="admin-card rounded-2xl p-5 space-y-2">
                <div class="flex justify-between items-center text-[10px] text-slate-400 uppercase">
                  <span>Service Memory (RSS)</span>
                  <span class="text-emerald-400">● Normal</span>
                </div>
                <div class="text-2xl font-black text-white">${data.server.service_memory_rss_mb} MB</div>
                <div class="w-full bg-surface-950 rounded-full h-1.5 overflow-hidden">
                  <div class="bg-emerald-500 h-full rounded-full" style="width: ${Math.min(100, Math.round((data.server.service_memory_rss_mb / 512) * 100))}%"></div>
                </div>
                <div class="flex justify-between text-[9px] text-slate-500">
                  <span>Heap: ${data.server.heap_used_mb}MB</span>
                  <span>Container: ${data.server.os_mem_percent}%</span>
                </div>
              </div>

              <div class="admin-card rounded-2xl p-5 space-y-2">
                <div class="flex justify-between items-center text-[10px] text-slate-400 uppercase">
                  <span>MongoDB Atlas Ping</span>
                  <span class="text-emerald-400">● Connected</span>
                </div>
                <div class="text-2xl font-black text-emerald-400">${data.database.ping_latency_ms} ms</div>
                <div class="w-full bg-surface-950 rounded-full h-1.5 overflow-hidden">
                  <div class="bg-emerald-500 h-full rounded-full" style="width: ${Math.min(100, data.database.ping_latency_ms)}%"></div>
                </div>
                <div class="flex justify-between text-[9px] text-slate-500">
                  <span>Collections: ${data.database.collections_count}</span>
                  <span>Storage: ${data.database.storage_size_mb} MB</span>
                </div>
              </div>

              <div class="admin-card rounded-2xl p-5 space-y-2">
                <div class="flex justify-between items-center text-[10px] text-slate-400 uppercase">
                  <span>Backend Uptime</span>
                  <span class="text-emerald-400">● Live</span>
                </div>
                <div class="text-lg font-black text-white mt-1">${data.server.uptime_formatted}</div>
                <div class="text-[9px] text-slate-500">Continuous uptime</div>
              </div>

              <div class="admin-card rounded-2xl p-5 space-y-2">
                <div class="flex justify-between items-center text-[10px] text-slate-400 uppercase">
                  <span>Avg Latency / Errors</span>
                  <span class="${data.server.error_rate_percent > 5 ? 'text-rose-400' : 'text-emerald-400'}">● ${data.server.error_rate_percent}% Err</span>
                </div>
                <div class="text-2xl font-black text-white">${data.server.avg_response_time_ms} ms</div>
                <div class="text-[9px] text-slate-500">Tracked: ${data.server.request_count_tracked} requests</div>
              </div>

            </div>

            <!-- Database Collections Table -->
            <div class="admin-card rounded-3xl p-6 space-y-4">
              <div class="flex justify-between items-center">
                <h3 class="text-xs font-bold uppercase text-slate-400">MongoDB Atlas Cloud Collections</h3>
                <span class="text-[10px] text-emerald-400 font-mono">Data Size: ${data.database.data_size_mb} MB | Indexes: ${data.database.indexes_size_mb} MB</span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <thead>
                    <tr class="border-b border-admin-border text-slate-500">
                      <th class="pb-2">Collection Name</th>
                      <th class="pb-2">Document Count</th>
                      <th class="pb-2 text-right">Status</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-admin-border">
                    ${data.database.collections.map(c => `
                      <tr>
                        <td class="py-3 text-white font-bold">${c.name}</td>
                        <td class="py-3 text-slate-300 font-bold">${c.count} records</td>
                        <td class="py-3 text-right text-emerald-400">🟢 ${c.status}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="admin-card p-8 text-center text-rose-400 text-xs font-mono">Diagnostics Error: ${err.message}</div>`;
      }
    }

    async function runSystemHealthCheck() {
      const modal = document.getElementById('globalModal');
      const content = document.getElementById('globalModalContent');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      content.innerHTML = '<div class="text-center py-12 text-slate-400 font-mono animate-pulse">Running health checks...</div>';

      try {
        const res = await fetch('/api/admin/system/health-check', {
          headers: { 'Authorization': `Bearer ${state.adminToken}` }
        });
        const data = await res.json();
        const c = data.checks;

        content.innerHTML = `
          <button onclick="document.getElementById('globalModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
          <div class="space-y-5 font-mono">
            <div>
              <h3 class="text-base font-bold text-white font-sans">Full Subsystem Health Results</h3>
              <p class="text-xs text-slate-400">Timestamp: ${new Date(data.timestamp).toLocaleTimeString()}</p>
            </div>

            <div class="space-y-2.5 text-xs">
              <div class="p-3.5 rounded-2xl bg-surface-950 border border-admin-border flex justify-between items-center">
                <span>Frontend Layer</span>
                <span class="text-emerald-400 font-bold">🟢 ${c.frontend.status} (${c.frontend.latency_ms}ms)</span>
              </div>
              <div class="p-3.5 rounded-2xl bg-surface-950 border border-admin-border flex justify-between items-center">
                <span>Backend Express Engine</span>
                <span class="text-emerald-400 font-bold">🟢 ${c.backend.status} (${c.backend.uptime_sec}s uptime)</span>
              </div>
              <div class="p-3.5 rounded-2xl bg-surface-950 border border-admin-border flex justify-between items-center">
                <span>MongoDB Atlas Cluster</span>
                <span class="${c.database.status === 'Connected' ? 'text-emerald-400' : 'text-rose-400'} font-bold">
                  ${c.database.status === 'Connected' ? '🟢 Connected (' + c.database.latency_ms + 'ms ping)' : '🔴 ' + c.database.status}
                </span>
              </div>
              <div class="p-3.5 rounded-2xl bg-surface-950 border border-admin-border flex justify-between items-center">
                <span>Digital Delivery Stock Queue</span>
                <span class="${c.digital_delivery.stock_ready ? 'text-emerald-400' : 'text-amber-400'} font-bold">
                  ${c.digital_delivery.stock_ready ? '🟢 Ready (' + c.digital_delivery.available_stock + ' slots in stock)' : '🟡 Stock Low (0 units)'}
                </span>
              </div>
            </div>

            <button onclick="document.getElementById('globalModal').classList.add('hidden')" class="w-full py-3.5 rounded-2xl bg-emerald-500 text-gray-950 font-black text-xs uppercase tracking-wider font-sans">
              Done
            </button>
          </div>
        `;
      } catch (err) {
        content.innerHTML = `<div class="text-center py-8 text-rose-400 font-mono">Health Check Error: ${err.message}</div>`;
      }
    }

    function adminSignOut() {
      state.adminToken = '';
      state.adminUsername = '';
      localStorage.removeItem('nexus_admin_token');
      localStorage.removeItem('nexus_admin_user');
      navigate('home');
    }

    document.addEventListener('DOMContentLoaded', () => {
      navigate('home');
    });
  </script>
</body>
</html>
