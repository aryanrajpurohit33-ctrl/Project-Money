<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Project Money</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #030712;
      color: #f3f4f6;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Ambient Glow */
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      will-change: transform, opacity;
      animation: float-ambient 18s ease-in-out infinite alternate;
    }
    .orb-1 {
      top: -5%;
      left: -10%;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.16) 0%, transparent 70%);
    }
    .orb-2 {
      bottom: -10%;
      right: -10%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.13) 0%, transparent 70%);
    }

    @keyframes float-ambient {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(25px, -20px) scale(1.05); }
    }

    /* Glass Card */
    .glass-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }

    /* Inputs */
    .input-field {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.09);
      transition: all 0.2s ease;
    }
    .input-field:focus {
      border-color: rgba(74, 222, 128, 0.6);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
    }

    /* Micro Animations */
    .login-shake {
      animation: shake-error 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake-error {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }

    .view-screen {
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .view-hidden {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body class="h-[100dvh] w-full flex items-center justify-center p-3 sm:p-5 relative select-none">

  <!-- Ambient Glow Background -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <!-- Geometric Grid Pattern Overlay -->
  <div class="fixed inset-0 bg-[linear-gradient(to_right,#1f293708_1px,transparent_1px),linear-gradient(to_bottom,#1f293708_1px,transparent_1px)] bg-[size:3.5rem_3.5rem] pointer-events-none"></div>

  <!-- 1. COMPACT LOGIN CONTAINER -->
  <main id="loginScreen" class="view-screen w-full max-w-[390px] relative z-10">
    <div id="loginCard" class="glass-card rounded-2xl px-5 py-6 sm:px-8 sm:py-7">
      
      <!-- Brand Header -->
      <div class="flex flex-col items-center text-center mb-5">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-500 to-emerald-400 p-[1px] shadow-md shadow-brand-500/20 mb-2.5 flex items-center justify-center">
          <div class="w-full h-full bg-gray-950 rounded-[11px] flex items-center justify-center">
            <svg class="w-6 h-6 text-brand-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
        </div>
        <h1 class="text-xl font-bold tracking-tight text-white leading-tight">Project Money</h1>
        <p class="text-[11px] font-medium text-gray-400 mt-0.5">Sign in to your control center</p>
      </div>

      <!-- Live Error Notification -->
      <div id="errorAlert" class="hidden mb-3.5 p-2.5 rounded-lg bg-red-500/10 border border-red-500/25 flex items-center gap-2 text-[11px] text-red-400">
        <svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorMessage">Invalid credentials.</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-3" onsubmit="handleLogin(event)" autocomplete="off">
        
        <!-- Username Input -->
        <div class="space-y-1">
          <label for="usernameInput" class="block text-[11px] font-medium text-gray-300">Username</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <input 
              type="text" 
              id="usernameInput" 
              placeholder="aryan"
              required 
              class="input-field w-full pl-9 pr-3 py-2.5 rounded-xl text-sm text-white placeholder-gray-600 focus:outline-none"
            />
          </div>
        </div>

        <!-- Password Input -->
        <div class="space-y-1">
          <label for="passwordInput" class="block text-[11px] font-medium text-gray-300">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <input 
              type="password" 
              id="passwordInput" 
              placeholder="••••••"
              required 
              class="input-field w-full pl-9 pr-10 py-2.5 rounded-xl text-sm text-white placeholder-gray-600 focus:outline-none"
            />
            <button 
              type="button" 
              onclick="togglePasswordVisibility()" 
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-300 focus:outline-none"
              tabindex="-1"
            >
              <svg id="eyeIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eyeOffIcon" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Options -->
        <div class="flex items-center justify-between pt-0.5 pb-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="rememberMe" class="w-3.5 h-3.5 rounded bg-gray-900 border-gray-700 text-brand-500 focus:ring-0 accent-brand-500 cursor-pointer">
            <span class="text-[11px] text-gray-400">Remember me</span>
          </label>
          <a href="javascript:void(0)" onclick="handleForgotPassword()" class="text-[11px] text-gray-400 hover:text-brand-400">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="loginBtn" 
          class="w-full py-2.5 px-4 bg-brand-500 hover:bg-brand-400 active:scale-[0.98] text-gray-950 font-bold text-sm rounded-xl shadow-md shadow-brand-500/20 transition-all duration-150 flex items-center justify-center gap-2 focus:outline-none"
        >
          <span id="btnText">Sign In</span>
          <svg id="btnSpinner" class="hidden animate-spin h-4 w-4 text-gray-950" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>

      </form>

      <!-- Bottom Hint -->
      <div class="mt-4 text-center">
        <p class="text-[10px] text-gray-500 font-mono">Demo: aryan / 123</p>
      </div>

    </div>
  </main>

  <!-- 2. COMPACT EMPTY HOME PAGE -->
  <section id="homeScreen" class="view-screen view-hidden w-full max-w-[390px] relative z-10">
    <div class="glass-card rounded-2xl px-6 py-8 text-center border border-white/10">
      
      <div class="w-12 h-12 rounded-full bg-brand-500/10 border border-brand-500/30 flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6 text-brand-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>

      <h2 class="text-xl font-bold text-white tracking-tight">Welcome, <span class="text-brand-400">Aryan</span></h2>
      <p class="text-xs text-gray-400 mt-1.5 leading-relaxed">Authentication verified. Empty canvas ready.</p>

      <div class="my-6 py-2.5 px-4 rounded-lg bg-gray-900/60 border border-gray-800 text-[11px] font-mono text-gray-400 flex items-center justify-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-brand-400 animate-pulse"></span>
        <span>Canvas Ready • No Modules Loaded</span>
      </div>

      <button 
        type="button" 
        onclick="handleLogout()" 
        class="py-2 px-5 rounded-lg bg-gray-800/80 hover:bg-gray-700 active:scale-[0.98] text-[11px] font-semibold text-gray-300 transition-all border border-gray-700"
      >
        Sign Out
      </button>

    </div>
  </section>

  <script>
    const AUTH_CONFIG = {
      username: 'aryan',
      password: '123'
    };

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      const eyeOffIcon = document.getElementById('eyeOffIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.add('hidden');
        eyeOffIcon.classList.remove('hidden');
      } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('hidden');
        eyeOffIcon.classList.add('hidden');
      }
    }

    function handleForgotPassword() {
      showError("Use username 'aryan' and password '123'.");
    }

    function showError(message) {
      const alert = document.getElementById('errorAlert');
      const errorText = document.getElementById('errorMessage');
      const loginCard = document.getElementById('loginCard');

      errorText.textContent = message;
      alert.classList.remove('hidden');

      loginCard.classList.remove('login-shake');
      void loginCard.offsetWidth;
      loginCard.classList.add('login-shake');
    }

    function clearError() {
      document.getElementById('errorAlert').classList.add('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      clearError();

      const userVal = document.getElementById('usernameInput').value.trim();
      const passVal = document.getElementById('passwordInput').value;
      const loginBtn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      loginBtn.disabled = true;
      btnText.textContent = "Authenticating...";
      btnSpinner.classList.remove('hidden');

      setTimeout(() => {
        if (userVal === AUTH_CONFIG.username && passVal === AUTH_CONFIG.password) {
          btnText.textContent = "Success";
          
          setTimeout(() => {
            const loginScreen = document.getElementById('loginScreen');
            const homeScreen = document.getElementById('homeScreen');

            loginScreen.style.opacity = '0';
            loginScreen.style.transform = 'scale(0.96)';

            setTimeout(() => {
              loginScreen.classList.add('view-hidden');
              homeScreen.classList.remove('view-hidden');
              
              void homeScreen.offsetWidth;
              homeScreen.style.opacity = '1';
              homeScreen.style.transform = 'scale(1)';
            }, 250);
          }, 250);

        } else {
          loginBtn.disabled = false;
          btnText.textContent = "Sign In";
          btnSpinner.classList.add('hidden');
          showError("Invalid username or password.");
        }
      }, 500);
    }

    function handleLogout() {
      const loginScreen = document.getElementById('loginScreen');
      const homeScreen = document.getElementById('homeScreen');
      const passwordInput = document.getElementById('passwordInput');
      const loginBtn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      passwordInput.value = '';
      loginBtn.disabled = false;
      btnText.textContent = "Sign In";
      btnSpinner.classList.add('hidden');
      clearError();

      homeScreen.style.opacity = '0';
      homeScreen.style.transform = 'scale(0.96)';

      setTimeout(() => {
        homeScreen.classList.add('view-hidden');
        loginScreen.classList.remove('view-hidden');

        void loginScreen.offsetWidth;
        loginScreen.style.opacity = '1';
        loginScreen.style.transform = 'scale(1)';
      }, 250);
    }
  </script>
</body>
</html>
