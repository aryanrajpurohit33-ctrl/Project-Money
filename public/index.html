<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS DIGITAL — Digital Goods & Subscriptions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: { 500: '#10b981', 600: '#059669' },
            surface: { 800: '#111827', 900: '#0b0f19', 950: '#030712' },
            admin: { sidebar: '#090d16', bg: '#05070d', card: '#0f1422', border: '#1c2438' }
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
    .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: linear-gradient(135deg, rgba(31, 41, 55, 0.45) 0%, rgba(17, 24, 39, 0.6) 100%); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); transition: all 0.25s; }
    .glass-card:hover { border-color: rgba(16, 185, 129, 0.4); transform: translateY(-4px); }
    .admin-card { background-color: #0f1422; border: 1px solid #1c2438; }
    .auth-glow { box-shadow: 0 0 50px -10px rgba(16, 185, 129, 0.15); }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <div id="toastHub" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
  <div id="appBackdrop" onclick="closeAllDrawers()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden transition-opacity duration-200"></div>
  <div id="mainViewport" class="flex flex-1 min-h-screen"></div>

  <!-- Global Modal for Product Editor & Previews -->
  <div id="globalModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-2 sm:p-4">
    <div class="glass max-w-5xl w-full rounded-3xl p-5 sm:p-8 relative max-h-[94vh] overflow-y-auto custom-scroll shadow-2xl border border-white/10" id="globalModalContent"></div>
  </div>

  <script>
    const state = {
      sessionId: 'sess_' + Math.random().toString(36).substring(2, 12),
      user: JSON.parse(localStorage.getItem('nexus_user') || 'null'),
      token: localStorage.getItem('nexus_token') || '',
      adminToken: localStorage.getItem('nexus_admin_token') || '',
      adminUsername: localStorage.getItem('nexus_admin_user') || '',
      cart: JSON.parse(localStorage.getItem('nexus_cart') || '[]'),
      currentView: 'home',
      adminSection: 'products',
      dashboardRange: '30d',
      loadedProducts: [],
      productStudioDirty: false
    };

    const SVG_SPINNER = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 inline-block text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;

    function showToast(message, type = 'success') {
      const hub = document.getElementById('toastHub');
      const toast = document.createElement('div');
      const colors = type === 'success' ? 'bg-emerald-500 text-gray-950' : 'bg-rose-500 text-white';
      toast.className = `px-5 py-3 rounded-2xl font-bold text-xs shadow-2xl flex items-center gap-2 transform transition-all duration-300 opacity-0 ${colors}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span> <span>${message}</span>`;
      hub.appendChild(toast);
      setTimeout(() => toast.classList.remove('opacity-0'), 10);
      setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3200);
    }

    async function fetchJSON(url, options = {}) {
      try {
        const res = await fetch(url, options);
        if (res.status === 401 || res.status === 403) {
          if (url.includes('/api/admin/')) adminSignOut();
          throw new Error('Session expired or unauthorized');
        }
        const contentType = res.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) throw new Error('Service synchronizing. Please retry.');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
        return data;
      } catch (err) { throw err; }
    }

    function closeAllDrawers() {
      if (state.productStudioDirty) {
        if (!confirm('You have unsaved changes. Discard them?')) return;
        state.productStudioDirty = false;
      }
      document.getElementById('appBackdrop').classList.add('hidden');
      const cSide = document.getElementById('customerSidebar');
      if (cSide) cSide.classList.add('-translate-x-full');
      const aSide = document.getElementById('adminSidebar');
      if (aSide) aSide.classList.add('-translate-x-full');
      document.getElementById('globalModal').classList.add('hidden');
    }

    function toggleCustomerDrawer(open) {
      const side = document.getElementById('customerSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) { side.classList.remove('-translate-x-full'); drop.classList.remove('hidden'); }
      else { side.classList.add('-translate-x-full'); drop.classList.add('hidden'); }
    }

    function toggleAdminDrawer(open) {
      const side = document.getElementById('adminSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) { side.classList.remove('-translate-x-full'); drop.classList.remove('hidden'); }
      else { side.classList.add('-translate-x-full'); drop.classList.add('hidden'); }
    }

    function navigate(view, params = {}) {
      state.currentView = view;
      closeAllDrawers();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const viewport = document.getElementById('mainViewport');
      if (view === 'admin-center') {
        if (!state.adminToken) renderAdminLogin(viewport);
        else renderAdminSaaSLayout(viewport);
        return;
      }
      renderStorefrontLayout(viewport, view, params);
    }

    // =========================================================================
    // STOREFRONT LAYOUT & CUSTOMER STORE (PRESERVED)
    // =========================================================================
    function renderStorefrontLayout(viewport, view, params) {
      viewport.innerHTML = `
        <div class="flex flex-1 min-h-screen relative w-full bg-surface-950">
          <aside id="customerSidebar" class="fixed lg:static top-0 bottom-0 left-0 w-64 bg-surface-900 border-r border-white/5 z-50 flex flex-col justify-between transition-transform duration-300 -translate-x-full lg:translate-x-0">
            <div>
              <div class="p-6 border-b border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
                  <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center font-black text-gray-950 shadow-lg shadow-emerald-500/20">N</div>
                  <div><span class="font-extrabold text-sm tracking-wider text-white block">NEXUS</span><span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">DIGITAL VAULT</span></div>
                </div>
                <button onclick="toggleCustomerDrawer(false)" class="lg:hidden text-slate-400 p-1">✕</button>
              </div>
              <nav class="p-4 space-y-1.5 text-xs font-semibold">
                <button onclick="navigate('home')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>🏠</span> Home</button>
                <button onclick="navigate('products')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>🛍</span> All Products</button>
                <button onclick="navigate('orders')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>📦</span> Purchased Items</button>
                <button onclick="navigate('account')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5"><span>👤</span> Account</button>
              </nav>
            </div>
            <div class="p-4 border-t border-white/5">
              <button onclick="navigate('admin-center')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold text-slate-400 bg-white/[0.03] hover:text-emerald-400 border border-white/5">🔐 Admin Panel</button>
            </div>
          </aside>
          <div class="flex-1 flex flex-col min-w-0">
            <header class="sticky top-0 z-30 glass border-b border-white/5 px-4 sm:px-8 py-3.5 flex items-center justify-between">
              <button onclick="toggleCustomerDrawer(true)" class="lg:hidden p-2 rounded-xl bg-white/5 text-slate-300">☰</button>
              <span class="text-xs font-bold text-white">NEXUS DIGITAL STOREFRONT</span>
            </header>
            <main id="storeContent" class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto space-y-8"></main>
          </div>
        </div>
      `;
      const storeContent = document.getElementById('storeContent');
      storeContent.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs font-mono">Storefront active. Access the Admin Panel via /admin-center or sidebar.</div>`;
    }

    // =========================================================================
    // ADMIN AUTH & SAAS CONTAINER (PRESERVED)
    // =========================================================================
    function renderAdminLogin(viewport) {
      viewport.innerHTML = `
        <div class="min-h-screen w-full bg-admin-bg flex items-center justify-center p-4">
          <div class="admin-card max-w-md w-full rounded-3xl p-8 space-y-6 shadow-2xl border border-admin-border">
            <div class="text-center space-y-1">
              <h2 class="text-xl font-black text-white tracking-wider font-sans">NEXUS CONTROL CENTER</h2>
              <p class="text-xs text-slate-400 font-mono">Admin Authorization Portal</p>
            </div>
            <form onsubmit="handleAdminAuth(event)" class="space-y-4 font-mono">
              <input type="text" id="admUser" required placeholder="Admin Username (Aryan)" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-xs text-white outline-none focus:border-emerald-500">
              <input type="password" id="admPass" required placeholder="Password (5669)" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-xs text-white outline-none focus:border-emerald-500">
              <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-500 text-gray-950 font-black text-xs uppercase tracking-wider font-sans shadow-lg">Authorize Session</button>
            </form>
          </div>
        </div>
      `;
    }

    async function handleAdminAuth(e) {
      e.preventDefault();
      try {
        const data = await fetchJSON('/api/admin/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('admUser').value, password: document.getElementById('admPass').value })
        });
        state.adminToken = data.token; state.adminUsername = data.username;
        localStorage.setItem('nexus_admin_token', data.token); localStorage.setItem('nexus_admin_user', data.username);
        showToast('Admin Authorized'); navigate('admin-center');
      } catch (err) { showToast(err.message, 'error'); }
    }

    function renderAdminSaaSLayout(viewport) {
      viewport.innerHTML = `
        <div class="flex flex-1 min-h-screen w-full bg-admin-bg font-sans text-slate-200 relative">
          <aside id="adminSidebar" class="fixed lg:static top-0 bottom-0 left-0 w-64 bg-admin-sidebar border-r border-admin-border flex flex-col justify-between z-50 transition-transform duration-300 -translate-x-full lg:translate-x-0">
            <div>
              <div class="p-6 border-b border-admin-border flex items-center justify-between">
                <div><span class="text-xs font-black text-emerald-400 uppercase tracking-widest block font-mono">NEXUS CONTROL</span><span class="text-sm font-bold text-white">Admin Hub</span></div>
                <button onclick="toggleAdminDrawer(false)" class="lg:hidden text-slate-400">✕</button>
              </div>
              <nav class="p-4 space-y-1 text-xs font-bold font-mono">
                <button onclick="switchAdminSection('products')" id="adnav-products" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 bg-emerald-500/10 text-emerald-400">📦 Product Studio</button>
                <button onclick="switchAdminSection('dashboard')" id="adnav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">📊 Overview Dashboard</button>
                <button onclick="switchAdminSection('slots')" id="adnav-slots" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">🔐 Account Slots</button>
                <button onclick="switchAdminSection('subscriptions')" id="adnav-subscriptions" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">👥 Subscriptions Suite</button>
                <button onclick="switchAdminSection('transactions')" id="adnav-transactions" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">💳 Transactions</button>
                <button onclick="switchAdminSection('customers')" id="adnav-customers" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">👤 Customers</button>
                <button onclick="switchAdminSection('payment-settings')" id="adnav-payment-settings" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">💰 Payment Gateway</button>
                <button onclick="switchAdminSection('system-monitor')" id="adnav-system-monitor" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">🌐 Website Status</button>
              </nav>
            </div>
            <div class="p-4 border-t border-admin-border space-y-2 font-mono">
              <button onclick="navigate('home')" class="w-full py-2.5 rounded-xl bg-white/5 text-slate-400 hover:text-white text-xs font-bold">👁 Customer Store</button>
              <button onclick="adminSignOut()" class="w-full py-2.5 rounded-xl bg-rose-500/10 text-rose-400 text-xs font-bold">🚪 End Session</button>
            </div>
          </aside>
          <div class="flex-1 flex flex-col min-w-0">
            <header class="h-16 border-b border-admin-border bg-admin-sidebar/50 px-4 sm:px-8 flex items-center justify-between">
              <button onclick="toggleAdminDrawer(true)" class="lg:hidden p-2 rounded-xl bg-white/5 text-slate-300">☰</button>
              <span class="text-xs text-slate-400 font-mono">Admin: ${state.adminUsername}</span>
            </header>
            <main id="adminMainContent" class="flex-1 p-4 sm:p-8 space-y-8 max-w-7xl w-full mx-auto"></main>
          </div>
        </div>
      `;
      switchAdminSection(state.adminSection || 'products');
    }

    function switchAdminSection(sec) {
      state.adminSection = sec; closeAllDrawers();
      const content = document.getElementById('adminMainContent');
      if (!content) return;
      document.querySelectorAll('[id^="adnav-"]').forEach(b => b.classList.remove('bg-emerald-500/10', 'text-emerald-400'));
      const active = document.getElementById(`adnav-${sec}`);
      if (active) active.classList.add('bg-emerald-500/10', 'text-emerald-400');

      if (sec === 'products') renderAdminProductsStudio(content);
      else if (sec === 'dashboard') renderAdminOverview(content);
      else if (sec === 'slots') renderAdminAccountSlots(content);
      else if (sec === 'subscriptions') renderAdminSubscriptions(content);
      else if (sec === 'transactions') renderAdminTransactions(content);
      else if (sec === 'customers') renderAdminCustomers(content);
      else if (sec === 'payment-settings') renderAdminPaymentSettings(content);
      else if (sec === 'system-monitor') renderAdminSystemMonitor(content);
    }

    function adminSignOut() {
      state.adminToken = ''; state.adminUsername = '';
      localStorage.removeItem('nexus_admin_token'); localStorage.removeItem('nexus_admin_user');
      navigate('home');
    }

    // =========================================================================
    // 📦 PRODUCT STUDIO — COMPLETE OVERHAUL (ISOLATED TARGET)
    // =========================================================================
    async function renderAdminProductsStudio(container) {
      container.innerHTML = `
        <div class="space-y-6 font-mono text-xs animate-pulse">
          <div class="h-10 bg-surface-900 rounded-2xl w-1/3"></div>
          <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
            <div class="h-20 bg-surface-900 rounded-2xl"></div>
            <div class="h-20 bg-surface-900 rounded-2xl"></div>
            <div class="h-20 bg-surface-900 rounded-2xl"></div>
            <div class="h-20 bg-surface-900 rounded-2xl"></div>
            <div class="h-20 bg-surface-900 rounded-2xl"></div>
            <div class="h-20 bg-surface-900 rounded-2xl"></div>
          </div>
          <div class="h-64 bg-surface-900 rounded-3xl"></div>
        </div>
      `;

      try {
        const products = await fetchJSON('/api/admin/products', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        state.loadedProducts = Array.isArray(products) ? products : [];
        const prods = state.loadedProducts;

        const total = prods.length;
        const published = prods.filter(p => p.status === 'active').length;
        const drafts = prods.filter(p => p.status === 'draft').length;
        const outOfStock = prods.filter(p => p.status === 'out_of_stock' || (!p.unlimited_stock && p.stock_quantity <= 0)).length;
        const featured = prods.filter(p => p.is_featured || (p.tags && p.tags.includes('featured'))).length;
        const bestSeller = prods.length > 0 ? [...prods].sort((a,b) => (b.sales_count||0) - (a.sales_count||0))[0].name : 'N/A';

        container.innerHTML = `
          <div class="space-y-8 font-mono text-xs pb-12">
            
            <!-- Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 font-sans">
              <div>
                <h1 class="text-2xl font-black text-white tracking-tight">PRODUCT STUDIO</h1>
                <p class="text-slate-400 text-xs mt-0.5">Manage your products, pricing, availability and digital delivery.</p>
              </div>
              <button onclick="openProductStudioModal('new')" class="px-5 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-black text-xs uppercase tracking-wider shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
                + ADD PRODUCT
              </button>
            </div>

            <!-- Product Summary Cards (Real Database Data) -->
            <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
              <div class="admin-card p-4 rounded-2xl space-y-1"><span class="text-slate-500 block text-[9px] uppercase font-bold">Total Products</span><div class="text-xl font-black text-white font-mono">${total}</div></div>
              <div class="admin-card p-4 rounded-2xl space-y-1"><span class="text-emerald-400 block text-[9px] uppercase font-bold">Published</span><div class="text-xl font-black text-emerald-400 font-mono">${published}</div></div>
              <div class="admin-card p-4 rounded-2xl space-y-1"><span class="text-amber-400 block text-[9px] uppercase font-bold">Drafts</span><div class="text-xl font-black text-amber-400 font-mono">${drafts}</div></div>
              <div class="admin-card p-4 rounded-2xl space-y-1"><span class="text-rose-400 block text-[9px] uppercase font-bold">Out of Stock</span><div class="text-xl font-black text-rose-400 font-mono">${outOfStock}</div></div>
              <div class="admin-card p-4 rounded-2xl space-y-1"><span class="text-indigo-400 block text-[9px] uppercase font-bold">Featured</span><div class="text-xl font-black text-indigo-400 font-mono">${featured}</div></div>
              <div class="admin-card p-4 rounded-2xl space-y-1 col-span-2 md:col-span-1"><span class="text-teal-400 block text-[9px] uppercase font-bold">Best Seller</span><div class="text-xs font-black text-white truncate">${bestSeller}</div></div>
            </div>

            <!-- Search, Filters & Sorter Toolbar -->
            <div class="admin-card rounded-2xl p-4 flex flex-col md:flex-row gap-3 items-center justify-between">
              <div class="relative w-full md:w-80">
                <input type="text" id="productSearchInput" oninput="filterProductStudioTable()" placeholder="Search products by title, SKU, category..." class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-surface-950 border border-admin-border text-white placeholder-slate-500 outline-none focus:border-emerald-500">
                <svg class="w-4 h-4 text-slate-500 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              </div>
              <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <select id="productStatusFilter" onchange="filterProductStudioTable()" class="px-3 py-2.5 rounded-xl bg-surface-950 border border-admin-border text-white text-xs">
                  <option value="ALL">All Statuses</option>
                  <option value="active">Published</option>
                  <option value="draft">Draft</option>
                  <option value="out_of_stock">Out of Stock</option>
                  <option value="archived">Archived</option>
                </select>

                <select id="productSortFilter" onchange="sortProductStudioTable(this.value)" class="px-3 py-2.5 rounded-xl bg-surface-950 border border-admin-border text-emerald-400 font-bold text-xs">
                  <option value="NEWEST">Sort: Newest</option>
                  <option value="OLDEST">Sort: Oldest</option>
                  <option value="PRICE_LOW">Price: Low → High</option>
                  <option value="PRICE_HIGH">Price: High → Low</option>
                  <option value="SALES">Best Selling</option>
                </select>
              </div>
            </div>

            <!-- Product Desktop Table & Mobile Responsive Cards -->
            <div class="admin-card rounded-3xl p-6">
              <div class="overflow-x-auto">
                <table class="w-full text-left min-w-[950px]" id="productStudioTable">
                  <thead>
                    <tr class="border-b border-admin-border text-slate-500 font-mono">
                      <th class="pb-3">Product</th>
                      <th class="pb-3">Type & Category</th>
                      <th class="pb-3">Price & Discount</th>
                      <th class="pb-3">Stock Status</th>
                      <th class="pb-3">Status</th>
                      <th class="pb-3">Delivery</th>
                      <th class="pb-3">Sales</th>
                      <th class="pb-3 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-admin-border font-sans">
                    ${prods.length === 0 ? `
                      <tr><td colspan="8" class="py-12 text-center text-slate-500 font-mono">NO PRODUCTS YET.<br><span class="text-xs text-slate-400">Create your first product to start selling.</span></td></tr>
                    ` : prods.map(p => `
                      <tr class="hover:bg-white/[0.02] transition-colors product-row" data-name="${(p.name||'').toLowerCase()} ${(p.category||'').toLowerCase()} ${(p.sku||'').toLowerCase()}" data-status="${p.status}" data-price="${p.sale_price}" data-created="${new Date(p.created_at).getTime()}" data-sales="${p.sales_count||0}">
                        <td class="py-4 flex items-center gap-3">
                          <img src="${p.images?.[0] || 'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=200'}" class="w-12 h-12 rounded-xl object-cover border border-admin-border bg-black/40">

    function filterProductStudioTable() {
      const q = (document.getElementById('productSearchInput')?.value || '').toLowerCase();
      const statusFilter = document.getElementById('productStatusFilter')?.value || 'ALL';
      
      document.querySelectorAll('.product-row').forEach(row => {
        const name = row.getAttribute('data-name') || '';
        const status = row.getAttribute('data-status') || '';
        const matchesQ = name.includes(q);
        const matchesStatus = (statusFilter === 'ALL' || status === statusFilter);

        if (matchesQ && matchesStatus) row.classList.remove('hidden');
        else row.classList.add('hidden');
      });
    }

    function sortProductStudioTable(sortType) {
      const tbody = document.querySelector('#productStudioTable tbody');
      if (!tbody) return;
      const rows = Array.from(tbody.querySelectorAll('tr.product-row'));

      rows.sort((a, b) => {
        if (sortType === 'NEWEST') return Number(b.getAttribute('data-created')) - Number(a.getAttribute('data-created'));
        if (sortType === 'OLDEST') return Number(a.getAttribute('data-created')) - Number(b.getAttribute('data-created'));
        if (sortType === 'PRICE_LOW') return Number(a.getAttribute('data-price')) - Number(b.getAttribute('data-price'));
        if (sortType === 'PRICE_HIGH') return Number(b.getAttribute('data-price')) - Number(a.getAttribute('data-price'));
        if (sortType === 'SALES') return Number(b.getAttribute('data-sales')) - Number(a.getAttribute('data-sales'));
        return 0;
      });

      rows.forEach(r => tbody.appendChild(r));
    }

    function autoGenerateSlug(val) {
      const slugInput = document.getElementById('pSlug');
      if (slugInput && !slugInput.value.includes('-copy-')) {
        slugInput.value = val.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      }
    }

    function toggleSubscriptionSection(type) {
      const sec = document.getElementById('subscriptionSection');
      if (sec) {
        if (type === 'SUBSCRIPTION') sec.classList.remove('hidden');
        else sec.classList.add('hidden');
      }
    }

    function toggleStockInput(unlimited) {
      const cont = document.getElementById('stockQuantityContainer');
      if (cont) {
        if (unlimited) cont.classList.add('hidden');
        else cont.classList.remove('hidden');
      }
    }

    function liveCalcDiscount() {
      const orig = Number(document.getElementById('pOrigPrice')?.value) || 0;
      const sale = Number(document.getElementById('pSalePrice')?.value) || 0;
      const prev = document.getElementById('liveDiscountPreview');
      if (!prev) return;
      if (orig > sale && orig > 0) {
        const disc = Math.round(((orig - sale) / orig) * 100);
        prev.textContent = `${disc}% OFF`;
      } else {
        prev.textContent = `0% OFF`;
      }
    }

    async function handleProductFormSubmit(e, productId) {
      e.preventDefault();
      const isNew = productId === 'new';
      const orig = Number(document.getElementById('pOrigPrice').value) || 0;
      const sale = Number(document.getElementById('pSalePrice').value) || 0;

      if (sale > orig && orig > 0) {
        return showToast('Selling price cannot exceed original price.', 'error');
      }

      const btn = document.getElementById('saveProductSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = `${SVG_SPINNER} Saving Product...`;

      const images = (document.getElementById('pImages').value || '').split(',').map(s => s.trim()).filter(Boolean);

      const payload = {
        name: document.getElementById('pName').value.trim(),
        slug: document.getElementById('pSlug').value.trim(),
        sku: document.getElementById('pSku').value.trim(),
        brand: document.getElementById('pBrand').value.trim(),
        category: document.getElementById('pCategory').value.trim(),
        product_type: document.getElementById('pType').value,
        short_description: document.getElementById('pShortDesc').value.trim(),
        description: document.getElementById('pDesc').value.trim(),
        customer_instructions: document.getElementById('pCustInstructions').value.trim(),
        original_price: orig,
        sale_price: sale,
        status: document.getElementById('pStatus').value,
        delivery_type: document.getElementById('pDelivery').value,
        is_featured: document.getElementById('pFeatured').checked,
        unlimited_stock: document.getElementById('pUnlimitedStock').checked,
        stock_quantity: Number(document.getElementById('pStockQuantity')?.value) || 100,
        seo_title: document.getElementById('pSeoTitle').value.trim(),
        seo_description: document.getElementById('pSeoDesc').value.trim(),
        subscription_pricing: {
          one_month: Number(document.getElementById('pPrice1M')?.value) || 199,
          six_months: Number(document.getElementById('pPrice6M')?.value) || 899,
          one_year: Number(document.getElementById('pPrice1Y')?.value) || 1499
        },
        images: images.length ? images : ['https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800']
      };

      try {
        await fetchJSON(isNew ? '/api/admin/products' : `/api/admin/products/${productId}`, {
          method: isNew ? 'POST' : 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.adminToken}` },
          body: JSON.stringify(payload)
        });
        state.productStudioDirty = false;
        showToast(isNew ? '✓ Product created successfully.' : '✓ Product updated successfully.');
        document.getElementById('globalModal').classList.add('hidden');
        renderAdminProductsStudio(document.getElementById('adminMainContent'));
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = isNew ? 'Create & Publish Product' : 'Save Product Changes';
        showToast(err.message, 'error'); 
      }
    }

    async function saveAsDraft(productId) {
      const statusEl = document.getElementById('pStatus');
      if (statusEl) statusEl.value = 'draft';
      document.getElementById('saveProductSubmitBtn')?.click();

      const modal = document.getElementById('globalModal');
      const content = document.getElementById('globalModalContent');
      modal.classList.remove('hidden'); modal.classList.add('flex');
      content.innerHTML = '<div class="text-center py-12 text-slate-400 font-mono">Loading product preview...</div>';

      try {
        const p = await fetchJSON(`/api/products/${id}`);
        content.innerHTML = `
          <button onclick="document.getElementById('globalModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
          <div class="space-y-6 font-sans">
            <div class="flex justify-between items-center pb-3 border-b border-white/5">
              <span class="px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 font-bold text-[10px] uppercase">Storefront Live Preview (Read-Only)</span>
              <span class="text-xs text-slate-500 font-mono">SKU: ${p.sku}</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
              <img src="${p.images?.[0] || ''}" class="w-full h-64 object-cover rounded-2xl border border-white/10 bg-surface-900">
              <div class="space-y-3">
                <span class="text-xs text-emerald-400 font-bold">${p.category || 'Digital Good'}</span>
                <h1 class="text-2xl font-black text-white">${p.name}</h1>
                <p class="text-xs text-slate-300 leading-relaxed">${p.description || p.short_description || ''}</p>
                <div class="flex items-center gap-3 pt-2">
                  <span class="text-3xl font-black text-emerald-400 font-mono">₹${p.sale_price}</span>
                  ${p.original_price > p.sale_price ? `<span class="text-sm text-slate-500 line-through font-mono">₹${p.original_price}</span>` : ''}
                  ${p.discount_percentage > 0 ? `<span class="text-xs text-rose-400 font-bold font-mono">${p.discount_percentage}% OFF</span>` : ''}
                </div>
                <div class="pt-2">
                  <span class="inline-block px-3 py-1 rounded-full text-xs font-bold ${p.status === 'active' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">
                    ● ${p.status === 'active' ? 'In Stock' : 'Out of Stock'}
                  </span>
                </div>
              </div>
            </div>
            <div class="flex justify-end pt-4 border-t border-white/5">
              <button onclick="document.getElementById('globalModal').classList.add('hidden')" class="px-6 py-2.5 rounded-xl bg-white/10 text-white font-bold text-xs">Close Preview</button>
            </div>
          </div>
        `;
      } catch (err) { content.innerHTML = `<div class="text-rose-400 p-6">${err.message}</div>`; }
    }

    // =========================================================================
    // OTHER ADMIN MODULES (PRESERVED IN FULL)
    // =========================================================================
    async function renderAdminOverview(container) {

      try {
        const d = await fetchJSON(`/api/admin/dashboard/full-overview?range=${state.dashboardRange}`, { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        container.innerHTML = `
          <div class="space-y-8 font-mono text-xs pb-12">
            <div class="glass border-emerald-500/20 px-4 py-2.5 rounded-2xl flex justify-between items-center text-[11px] font-bold shadow-lg">
              <span class="text-emerald-400 font-sans">🟢 ${d.live_visitors || 1} LIVE VISITORS ONLINE</span>
              <span class="text-slate-400">Updated just now</span>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 font-sans">
              <div class="admin-card p-5 rounded-3xl space-y-2"><span class="text-slate-400 block text-[10px] uppercase font-bold">TOTAL REVENUE</span><div class="text-2xl font-black text-emerald-400 font-mono">₹${d.kpis.revenue.value.toLocaleString()}</div></div>
              <div class="admin-card p-5 rounded-3xl space-y-2"><span class="text-slate-400 block text-[10px] uppercase font-bold">TOTAL ORDERS</span><div class="text-2xl font-black text-white font-mono">${d.kpis.orders.value}</div></div>
              <div class="admin-card p-5 rounded-3xl space-y-2"><span class="text-slate-400 block text-[10px] uppercase font-bold">TOTAL CUSTOMERS</span><div class="text-2xl font-black text-white font-mono">${d.kpis.customers.value}</div></div>
              <div class="admin-card p-5 rounded-3xl space-y-2"><span class="text-slate-400 block text-[10px] uppercase font-bold">ACTIVE SUBSCRIPTIONS</span><div class="text-2xl font-black text-indigo-400 font-mono">${d.kpis.subscriptions.value}</div></div>
            </div>
          </div>
        `;
      } catch (e) { container.innerHTML = `<div class="admin-card p-8 text-rose-400 text-xs font-mono">${e.message}</div>`; }
    }

    async function renderAdminAccountSlots(container) {
      container.innerHTML = '<div class="text-center py-16 text-slate-500 font-mono animate-pulse">Loading Account Slots...</div>';
      try {
        const data = await fetchJSON('/api/admin/slots', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        container.innerHTML = `
          <div class="space-y-6 font-mono text-xs">
            <h1 class="text-xl font-black text-white font-sans">Account Slots Management</h1>
            <div class="admin-card rounded-3xl p-6">
              <table class="w-full text-left">
                <thead><tr class="border-b border-admin-border text-slate-500"><th class="pb-3">Slot</th><th class="pb-3">Email</th><th class="pb-3">Status</th></tr></thead>
                <tbody class="divide-y divide-admin-border font-mono">${(data.slots || []).map(s => `<tr><td class="py-3 font-bold text-white">${s.account_label}</td><td class="py-3 text-slate-400">${s.email}</td><td class="py-3 text-emerald-400">${s.status}</td></tr>`).join('')}</tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) { container.innerHTML = `<div class="admin-card p-8 text-center text-rose-400 text-xs font-mono">${err.message}</div>`; }
    }

    async function renderAdminSubscriptions(container) {
      container.innerHTML = '<div class="text-center py-16 text-slate-500 font-mono animate-pulse">Loading Subscriptions...</div>';
      try {
        const data = await fetchJSON('/api/admin/subscriptions/advanced', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        container.innerHTML = `
          <div class="space-y-6 font-mono text-xs">
            <h1 class="text-xl font-black text-white font-sans">Subscriptions Suite</h1>
            <div class="admin-card rounded-3xl p-6">
              <table class="w-full text-left">
                <thead><tr class="border-b border-admin-border text-slate-500"><th class="pb-3">Customer</th><th class="pb-3">Product</th><th class="pb-3">Status</th></tr></thead>
                <tbody class="divide-y divide-admin-border">${(data.subscriptions || []).map(s => `<tr><td class="py-3 text-white font-bold">${s.user_id?.username || 'Customer'}</td><td class="py-3">${s.product_name}</td><td class="py-3 text-emerald-400 font-bold">${s.status}</td></tr>`).join('')}</tbody>

          </div>
        `;
      } catch (e) { container.innerHTML = `<div class="admin-card p-8 text-rose-400 text-xs font-mono">${e.message}</div>`; }
    }

    async function renderAdminTransactions(container) {
      try {
        const txns = await fetchJSON('/api/admin/transactions', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        container.innerHTML = `
          <div class="space-y-6 font-mono text-xs">
            <h1 class="text-xl font-black text-white font-sans">Transactions</h1>
            <div class="admin-card rounded-3xl p-6">
              <table class="w-full text-left">

                <tbody class="divide-y divide-admin-border">${txns.map(t => `<tr><td class="py-3 text-white font-bold">${t.txn_id}</td><td class="py-3">${t.customer_name}</td><td class="py-3 text-emerald-400 font-bold">₹${t.amount}</td><td class="py-3">${t.status}</td></tr>`).join('')}</tbody>

    async function renderAdminCustomers(container) {
      try {
        const custs = await fetchJSON('/api/admin/customers/list', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        container.innerHTML = `

            <h1 class="text-xl font-black text-white font-sans">Customers</h1>
            <div class="admin-card rounded-3xl p-6">
              <table class="w-full text-left">
                <thead><tr class="border-b border-admin-border text-slate-500"><th class="pb-3">Username</th><th class="pb-3">Email</th></tr></thead>
                <tbody class="divide-y divide-admin-border">${custs.map(c => `<tr><td class="py-3 text-white font-bold">@${c.username || c.name}</td><td class="py-3 text-slate-400">${c.email}</td></tr>`).join('')}</tbody>
              </table>

      try {
        const s = await fetchJSON('/api/admin/payment-settings', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });

      } catch (e) { container.innerHTML = `<div class="admin-card p-8 text-rose-400 text-xs font-mono">${e.message}</div>`; }
    }

    async function renderAdminSystemMonitor(container) {
      try {
        const d = await fetchJSON('/api/admin/system/infrastructure', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        container.innerHTML = `<div class="admin-card rounded-3xl p-6 text-white font-mono text-xs space-y-2"><h1 class="text-xl font-black font-sans">Website Status</h1><div>Database: <span class="text-emerald-400">${d.database?.status}</span> (${d.database?.ping_latency_ms}ms)</div></div>`;
      } catch (e) { container.innerHTML = `<div class="admin-card p-8 text-rose-400 text-xs font-mono">${e.message}</div>`; }
    }

    document.addEventListener('DOMContentLoaded', () => { navigate('admin-center'); });
  </script>
