<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS DIGITAL — Digital Goods & Subscriptions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: { 500: '#10b981', 600: '#059669' },
            surface: { 800: '#111827', 900: '#0b0f19', 950: '#030712' },
            admin: { sidebar: '#090d16', bg: '#05070d', card: '#0f1422', border: '#1c2438' }
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
    .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .admin-card { background-color: #0f1422; border: 1px solid #1c2438; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <div id="toastHub" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
  <div id="appBackdrop" onclick="closeAllDrawers()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden transition-opacity"></div>
  <div id="mainViewport" class="flex flex-1 min-h-screen"></div>

  <!-- Global Modal for Product Editor & Preview -->
  <div id="globalModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass max-w-4xl w-full rounded-3xl p-6 sm:p-8 relative max-h-[90vh] overflow-y-auto custom-scroll shadow-2xl border border-white/10" id="globalModalContent"></div>
  </div>

  <script>
    const state = {
      sessionId: 'sess_' + Math.random().toString(36).substring(2, 12),
      user: JSON.parse(localStorage.getItem('nexus_user') || 'null'),
      token: localStorage.getItem('nexus_token') || '',
      adminToken: localStorage.getItem('nexus_admin_token') || '',
      adminUsername: localStorage.getItem('nexus_admin_user') || '',
      currentView: 'home',
      adminSection: 'products',
      loadedProducts: []
    };

    function showToast(message, type = 'success') {
      const hub = document.getElementById('toastHub');
      const toast = document.createElement('div');
      const colors = type === 'success' ? 'bg-emerald-500 text-gray-950' : 'bg-rose-500 text-white';
      toast.className = `px-5 py-3 rounded-2xl font-bold text-xs shadow-2xl flex items-center gap-2 transform transition-all duration-300 opacity-0 ${colors}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span> <span>${message}</span>`;
      hub.appendChild(toast);
      setTimeout(() => toast.classList.remove('opacity-0'), 10);
      setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3200);
    }

    async function fetchJSON(url, options = {}) {
      try {
        const res = await fetch(url, options);
        if (res.status === 401 || res.status === 403) {
          if (url.includes('/api/admin/')) adminSignOut();
          throw new Error('Session expired or unauthorized');
        }
        const contentType = res.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) throw new Error('Service synchronizing.');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
        return data;
      } catch (err) { throw err; }
    }

    function closeAllDrawers() {
      document.getElementById('appBackdrop').classList.add('hidden');
      const aSide = document.getElementById('adminSidebar');
      if (aSide) aSide.classList.add('-translate-x-full');
      document.getElementById('globalModal').classList.add('hidden');
    }

    function toggleAdminDrawer(open) {
      const side = document.getElementById('adminSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) { side.classList.remove('-translate-x-full'); drop.classList.remove('hidden'); }
      else { side.classList.add('-translate-x-full'); drop.classList.add('hidden'); }
    }

    function navigate(view, params = {}) {
      state.currentView = view;
      closeAllDrawers();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const viewport = document.getElementById('mainViewport');
      if (view === 'admin-center') {
        if (!state.adminToken) renderAdminLogin(viewport);
        else renderAdminSaaSLayout(viewport);
        return;
      }
      viewport.innerHTML = `<div class="p-8 text-center text-white">Customer Storefront active. Open Admin Panel via /admin-center</div>`;
    }

    // =========================================================================
    // ADMIN SAAS CONTAINER & ROUTING
    // =========================================================================
    function renderAdminLogin(viewport) {
      viewport.innerHTML = `
        <div class="min-h-screen w-full bg-admin-bg flex items-center justify-center p-4">
          <div class="admin-card max-w-md w-full rounded-3xl p-8 space-y-6 shadow-2xl border border-admin-border">
            <div class="text-center space-y-1">
              <h2 class="text-xl font-black text-white tracking-wider font-sans">NEXUS CONTROL CENTER</h2>
              <p class="text-xs text-slate-400">Admin Authorization Portal</p>
            </div>
            <form onsubmit="handleAdminAuth(event)" class="space-y-4">
              <input type="text" id="admUser" required placeholder="Username (Aryan)" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-xs text-white outline-none focus:border-emerald-500 font-mono">
              <input type="password" id="admPass" required placeholder="Password (5669)" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-xs text-white outline-none focus:border-emerald-500 font-mono">
              <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-500 text-gray-950 font-black text-xs uppercase tracking-wider font-sans shadow-lg">Authorize Session</button>
            </form>
          </div>
        </div>
      `;
    }

    async function handleAdminAuth(e) {
      e.preventDefault();
      try {
        const data = await fetchJSON('/api/admin/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('admUser').value, password: document.getElementById('admPass').value })
        });
        state.adminToken = data.token; state.adminUsername = data.username;
        localStorage.setItem('nexus_admin_token', data.token); localStorage.setItem('nexus_admin_user', data.username);
        showToast('Admin Authorized'); navigate('admin-center');
      } catch (err) { showToast(err.message, 'error'); }
    }

    function renderAdminSaaSLayout(viewport) {
      viewport.innerHTML = `
        <div class="flex flex-1 min-h-screen w-full bg-admin-bg font-sans text-slate-200 relative">
          <aside id="adminSidebar" class="fixed lg:static top-0 bottom-0 left-0 w-64 bg-admin-sidebar border-r border-admin-border flex flex-col justify-between z-50 transition-transform duration-300 -translate-x-full lg:translate-x-0">
            <div>
              <div class="p-6 border-b border-admin-border flex items-center justify-between">
                <div><span class="text-xs font-black text-emerald-400 uppercase tracking-widest block font-mono">NEXUS CONTROL</span><span class="text-sm font-bold text-white">Admin Hub</span></div>
                <button onclick="toggleAdminDrawer(false)" class="lg:hidden text-slate-400">✕</button>
              </div>
              <nav class="p-4 space-y-1 text-xs font-bold font-mono">
                <button onclick="switchAdminSection('products')" id="adnav-products" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 bg-emerald-500/10 text-emerald-400">📦 Product Studio</button>
                <button onclick="switchAdminSection('dashboard')" id="adnav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">📊 Overview Dashboard</button>
                <button onclick="switchAdminSection('slots')" id="adnav-slots" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">🔐 Account Slots</button>
                <button onclick="switchAdminSection('subscriptions')" id="adnav-subscriptions" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5">👥 Subscriptions Suite</button>
              </nav>
            </div>
            <div class="p-4 border-t border-admin-border space-y-2">
              <button onclick="adminSignOut()" class="w-full py-2.5 rounded-xl bg-rose-500/10 text-rose-400 text-xs font-bold">🚪 End Session</button>
            </div>
          </aside>
          <div class="flex-1 flex flex-col min-w-0">
            <header class="h-16 border-b border-admin-border bg-admin-sidebar/50 px-4 sm:px-8 flex items-center justify-between">
              <button onclick="toggleAdminDrawer(true)" class="lg:hidden p-2 rounded-xl bg-white/5 text-slate-300">☰</button>
              <span class="text-xs text-slate-400 font-mono">Admin: ${state.adminUsername}</span>
            </header>
            <main id="adminMainContent" class="flex-1 p-4 sm:p-8 space-y-8 max-w-7xl w-full mx-auto"></main>
          </div>
        </div>
      `;
      switchAdminSection(state.adminSection || 'products');
    }

    function switchAdminSection(sec) {
      state.adminSection = sec; closeAllDrawers();
      const content = document.getElementById('adminMainContent');
      if (!content) return;
      document.querySelectorAll('[id^="adnav-"]').forEach(b => b.classList.remove('bg-emerald-500/10', 'text-emerald-400'));
      const active = document.getElementById(`adnav-${sec}`);
      if (active) active.classList.add('bg-emerald-500/10', 'text-emerald-400');

      if (sec === 'products') renderAdminProductsStudio(content);
      else content.innerHTML = `<div class="p-8 text-white font-mono text-xs">${sec.toUpperCase()} module active per scope restriction.</div>`;
    }

    // =========================================================================
    // REDESIGNED PRODUCT STUDIO (ISOLATED TARGET)
    // =========================================================================
    async function renderAdminProductsStudio(container) {
      container.innerHTML = '<div class="text-center py-16 text-slate-500 font-mono animate-pulse">Loading Product Studio...</div>';
      try {
        const res = await fetchJSON('/api/admin/products', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        state.loadedProducts = Array.isArray(res) ? res : [];
        const prods = state.loadedProducts;

        const total = prods.length;
        const published = prods.filter(p => p.status === 'active').length;
        const drafts = prods.filter(p => p.status === 'draft').length;
        const outOfStock = prods.filter(p => p.status === 'out_of_stock' || p.status === 'unavailable').length;
        const featured = prods.filter(p => p.tags && p.tags.includes('featured')).length;
        const bestSeller = prods.length > 0 ? [...prods].sort((a,b) => (b.sales_count||0) - (a.sales_count||0))[0].name : 'N/A';

        container.innerHTML = `
          <div class="space-y-8 font-mono text-xs pb-12">
            
            <!-- Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 font-sans">
              <div>
                <h1 class="text-2xl font-black text-white tracking-tight">PRODUCT STUDIO</h1>
                <p class="text-slate-400 text-xs mt-0.5">Manage your products, pricing, availability and product details.</p>
              </div>
              <button onclick="openProductStudioModal('new')" class="px-5 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-black text-xs uppercase tracking-wider shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
                + ADD PRODUCT
              </button>
            </div>

            <!-- Product Summary Cards -->
            <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
              <div class="admin-card p-4 rounded-2xl space-y-1"><span class="text-slate-500 block text-[9px] uppercase font-bold">Total Products</span><div class="text-xl font-black text-white">${total}</div></div>
              <div class="admin-card p-4 rounded-2xl space-y-1"><span class="text-emerald-400 block text-[9px] uppercase font-bold">Published</span><div class="text-xl font-black text-emerald-400">${published}</div></div>
              <div class="admin-card p-4 rounded-2xl space-y-1"><span class="text-amber-400 block text-[9px] uppercase font-bold">Drafts</span><div class="text-xl font-black text-amber-400">${drafts}</div></div>
              <div class="admin-card p-4 rounded-2xl space-y-1"><span class="text-rose-400 block text-[9px] uppercase font-bold">Out of Stock</span><div class="text-xl font-black text-rose-400">${outOfStock}</div></div>
              <div class="admin-card p-4 rounded-2xl space-y-1"><span class="text-indigo-400 block text-[9px] uppercase font-bold">Featured</span><div class="text-xl font-black text-indigo-400">${featured}</div></div>
              <div class="admin-card p-4 rounded-2xl space-y-1 col-span-2 md:col-span-1"><span class="text-teal-400 block text-[9px] uppercase font-bold">Best Seller</span><div class="text-sm font-black text-white truncate">${bestSeller}</div></div>
            </div>

            <!-- Search & Filters Toolbar -->
            <div class="admin-card rounded-2xl p-4 flex flex-col md:flex-row gap-3 items-center justify-between">
              <div class="relative w-full md:w-80">
                <input type="text" id="productSearchInput" oninput="filterProductStudioTable(this.value)" placeholder="Search products..." class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-surface-950 border border-admin-border text-white placeholder-slate-500 outline-none focus:border-emerald-500">
                <svg class="w-4 h-4 text-slate-500 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              </div>
              <div class="flex items-center gap-2 w-full md:w-auto">
                <select id="productStatusFilter" onchange="filterProductStudioTable()" class="px-3 py-2.5 rounded-xl bg-surface-950 border border-admin-border text-white text-xs">
                  <option value="ALL">All Statuses</option>
                  <option value="active">Published</option>
                  <option value="draft">Draft</option>
                  <option value="out_of_stock">Unavailable</option>
                </select>
              </div>
            </div>

            <!-- Product List / Table -->
            <div class="admin-card rounded-3xl p-6">
              <div class="overflow-x-auto">
                <table class="w-full text-left min-w-[900px]" id="productStudioTable">
                  <thead>
                    <tr class="border-b border-admin-border text-slate-500 font-mono">
                      <th class="pb-3">Product Name</th>
                      <th class="pb-3">Category</th>
                      <th class="pb-3">Real vs Selling Price</th>
                      <th class="pb-3">Discount</th>
                      <th class="pb-3">Availability</th>
                      <th class="pb-3">Status</th>
                      <th class="pb-3">Sales</th>
                      <th class="pb-3 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-admin-border font-sans">
                    ${prods.length === 0 ? `
                      <tr><td colspan="8" class="py-12 text-center text-slate-500">No products found. Click "+ Add Product" to get started.</td></tr>
                    ` : prods.map(p => `
                      <tr class="hover:bg-white/[0.02] transition-colors product-row" data-name="${(p.name||'').toLowerCase()}" data-status="${p.status}">
                        <td class="py-4 flex items-center gap-3">
                          <img src="${p.images?.[0] || 'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=200'}" class="w-12 h-12 rounded-xl object-cover border border-admin-border bg-black/40">
                          <div>
                            <span class="text-white font-bold block">${p.name}</span>
                            <span class="text-[10px] text-slate-500 font-mono">SKU: ${p.sku || 'N/A'}</span>
                          </div>
                        </td>
                        <td class="py-4 text-slate-300 font-mono">${p.category || 'Digital Good'}</td>
                        <td class="py-4 font-mono">
                          <div class="flex items-center gap-2">
                            <span class="text-emerald-400 font-black">₹${p.sale_price}</span>
                            ${p.original_price > p.sale_price ? `<span class="text-xs text-slate-500 line-through">₹${p.original_price}</span>` : ''}
                          </div>
                        </td>
                        <td class="py-4 font-mono">
                          ${p.discount_percentage > 0 ? `<span class="px-2 py-0.5 rounded bg-rose-500/10 text-rose-400 font-bold text-[10px]">${p.discount_percentage}% OFF</span>` : '<span class="text-slate-500">None</span>'}
                        </td>
                        <td class="py-4">
                          <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${p.status === 'active' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">
                            ${p.status === 'active' ? '🟢 In Stock' : '🔴 Unavailable'}
                          </span>
                        </td>
                        <td class="py-4 font-semibold uppercase text-[11px] text-slate-300">${p.status}</td>
                        <td class="py-4 font-mono font-bold text-white">${p.sales_count || 0}</td>
                        <td class="py-4 text-right space-x-1.5 font-mono">
                          <button onclick="openProductPreviewModal('${p._id}')" class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 font-bold">👁 Preview</button>
                          <button onclick="openProductStudioModal('${p._id}')" class="px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-400 font-bold hover:bg-emerald-500/20">Edit</button>
                          <button onclick="duplicateProduct('${p._id}')" class="px-2.5 py-1 rounded-lg bg-indigo-500/10 text-indigo-400 font-bold hover:bg-indigo-500/20">Duplicate</button>
                          <button onclick="deleteProduct('${p._id}')" class="px-2 py-1 rounded-lg text-rose-400 hover:text-rose-300 font-bold">✕</button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="admin-card p-8 text-center text-rose-400 text-xs font-mono">Error loading Product Studio: ${err.message}</div>`;
      }
    }

    function filterProductStudioTable() {
      const q = (document.getElementById('productSearchInput')?.value || '').toLowerCase();
      const statusFilter = document.getElementById('productStatusFilter')?.value || 'ALL';
      
      document.querySelectorAll('.product-row').forEach(row => {
        const name = row.getAttribute('data-name') || '';
        const status = row.getAttribute('data-status') || '';
        const matchesQ = name.includes(q);
        const matchesStatus = (statusFilter === 'ALL' || status === statusFilter);

        if (matchesQ && matchesStatus) row.classList.remove('hidden');
        else row.classList.add('hidden');
      });
    }

    // Modal for Add / Edit Product
    async function openProductStudioModal(productId) {
      const isNew = productId === 'new';
      const modal = document.getElementById('globalModal');
      const content = document.getElementById('globalModalContent');
      modal.classList.remove('hidden'); modal.classList.add('flex');

      let p = {
        name: '', short_description: '', description: '', category: 'Software & Digital Goods', sku: 'SKU-' + Date.now(),
        product_type: 'ONE_TIME', original_price: 999, sale_price: 499, discount_percentage: 50,
        subscription_pricing: { one_month: 199, six_months: 899, one_year: 1499 },
        images: ['https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800'],
        delivery_type: 'EMAIL_PASSWORD', status: 'active'
      };

      if (!isNew) {
        content.innerHTML = '<div class="text-center py-12 text-slate-400 font-mono">Loading product editor...</div>';
        p = await fetchJSON(`/api/products/${productId}`);
      }

      content.innerHTML = `
        <button onclick="document.getElementById('globalModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
        <div class="space-y-6 font-sans text-xs">
          <div>
            <h2 class="text-lg font-black text-white">${isNew ? 'Create New Product' : `Edit Product: ${p.name}`}</h2>
            <p class="text-slate-400 text-xs">Configure professional details, real vs selling pricing, and delivery.</p>
          </div>

          <form onsubmit="handleProductFormSubmit(event, '${productId}')" class="space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              
              <!-- Left Column -->
              <div class="space-y-4">
                <div class="p-5 rounded-2xl bg-surface-950 border border-admin-border space-y-3">
                  <span class="text-[11px] text-emerald-400 font-bold uppercase">1. Basic Information</span>
                  <div>
                    <label class="text-slate-400 block mb-1">Product Title *</label>
                    <input type="text" id="pName" required value="${p.name || ''}" placeholder="Product Title" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white font-bold">
                  </div>
                  <div>
                    <label class="text-slate-400 block mb-1">Short Description</label>
                    <input type="text" id="pShortDesc" value="${p.short_description || ''}" placeholder="Summary tagline" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white">
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="text-slate-400 block mb-1">Category</label>
                      <input type="text" id="pCategory" value="${p.category || 'Digital Goods'}" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white">
                    </div>
                    <div>
                      <label class="text-slate-400 block mb-1">SKU</label>
                      <input type="text" id="pSku" value="${p.sku || ''}" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white font-mono">
                    </div>
                  </div>
                </div>

                <div class="p-5 rounded-2xl bg-surface-950 border border-admin-border space-y-3">
                  <span class="text-[11px] text-emerald-400 font-bold uppercase">2. Full Description</span>
                  <textarea id="pDesc" rows="4" placeholder="Detailed product description..." class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white leading-relaxed">${p.description || ''}</textarea>
                </div>
              </div>

              <!-- Right Column -->
              <div class="space-y-4">
                <div class="p-5 rounded-2xl bg-surface-950 border border-admin-border space-y-3">
                  <span class="text-[11px] text-emerald-400 font-bold uppercase">3. Pricing & Discount</span>
                  <div>
                    <label class="text-slate-400 block mb-1">Product Type</label>
                    <select id="pType" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white font-bold">
                      <option value="ONE_TIME" ${p.product_type === 'ONE_TIME' ? 'selected' : ''}>One-Time Digital Purchase</option>
                      <option value="SUBSCRIPTION" ${p.product_type === 'SUBSCRIPTION' ? 'selected' : ''}>Subscription Product (1M / 6M / 1Y)</option>
                    </select>
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="text-slate-400 block mb-1">Real Price (₹)</label>
                      <input type="number" id="pOrigPrice" oninput="liveCalcDiscount()" value="${p.original_price || 999}" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white font-bold">
                    </div>
                    <div>
                      <label class="text-slate-400 block mb-1">Selling Price (₹)</label>
                      <input type="number" id="pSalePrice" oninput="liveCalcDiscount()" value="${p.sale_price || 499}" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-emerald-400 font-black">
                    </div>
                  </div>
                  <div class="p-3 rounded-xl bg-surface-900 border border-white/5 flex justify-between items-center text-xs">
                    <span class="text-slate-400">Calculated Discount:</span>
                    <span id="liveDiscountPreview" class="text-rose-400 font-black">${p.discount_percentage || 50}% OFF</span>
                  </div>
                </div>

                <div class="p-5 rounded-2xl bg-surface-950 border border-admin-border space-y-3">
                  <span class="text-[11px] text-emerald-400 font-bold uppercase">4. Publishing & Media</span>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="text-slate-400 block mb-1">Status</label>
                      <select id="pStatus" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-emerald-400 font-bold">
                        <option value="active" ${p.status === 'active' ? 'selected' : ''}>🟢 Published</option>
                        <option value="draft" ${p.status === 'draft' ? 'selected' : ''}>🟡 Draft</option>
                        <option value="out_of_stock" ${p.status === 'out_of_stock' ? 'selected' : ''}>🔴 Unavailable</option>
                      </select>
                    </div>
                    <div>
                      <label class="text-slate-400 block mb-1">Delivery Type</label>
                      <select id="pDelivery" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white">
                        <option value="EMAIL_PASSWORD">Email + Password</option>
                        <option value="STANDARD_LINK">Standard Link</option>
                        <option value="LICENSE_KEY">License Key</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label class="text-slate-400 block mb-1">Product Image URL (Primary)</label>
                    <input type="text" id="pImage" value="${p.images?.[0] || ''}" placeholder="https://..." class="w-full px-3.5 py-2.5 rounded-xl bg-surface-900 border border-white/10 text-white font-mono text-[11px]">
                  </div>
                </div>
              </div>

            </div>

            <div class="pt-3 flex gap-3">
              <button type="button" onclick="document.getElementById('globalModal').classList.add('hidden')" class="px-6 py-3.5 rounded-2xl bg-white/5 hover:bg-white/10 text-slate-300 font-bold">Cancel</button>
              <button type="submit" class="flex-1 py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-black uppercase tracking-wider font-sans shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
                ${isNew ? 'Create Product' : 'Save Product Changes'}
              </button>
            </div>

          </form>
        </div>
      `;
    }

    function liveCalcDiscount() {
      const orig = Number(document.getElementById('pOrigPrice')?.value) || 0;
      const sale = Number(document.getElementById('pSalePrice')?.value) || 0;
      const prev = document.getElementById('liveDiscountPreview');
      if (!prev) return;
      if (orig > sale && orig > 0) {
        const disc = Math.round(((orig - sale) / orig) * 100);
        prev.textContent = `${disc}% OFF`;
      } else {
        prev.textContent = `0% OFF`;
      }
    }

    async function handleProductFormSubmit(e, productId) {
      e.preventDefault();
      const isNew = productId === 'new';
      const imgUrl = document.getElementById('pImage').value.trim();

      const payload = {
        name: document.getElementById('pName').value.trim(),
        short_description: document.getElementById('pShortDesc').value.trim(),
        description: document.getElementById('pDesc').value.trim(),
        category: document.getElementById('pCategory').value.trim(),
        sku: document.getElementById('pSku').value.trim(),
        product_type: document.getElementById('pType').value,
        original_price: Number(document.getElementById('pOrigPrice').value),
        sale_price: Number(document.getElementById('pSalePrice').value),
        status: document.getElementById('pStatus').value,
        delivery_type: document.getElementById('pDelivery').value,
        images: imgUrl ? [imgUrl] : ['https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800']
      };

      try {
        await fetchJSON(isNew ? '/api/admin/products' : `/api/admin/products/${productId}`, {
          method: isNew ? 'POST' : 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.adminToken}` },
          body: JSON.stringify(payload)
        });
        showToast(isNew ? 'Product created successfully!' : 'Product updated successfully!');
        document.getElementById('globalModal').classList.add('hidden');
        renderAdminProductsStudio(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function duplicateProduct(id) {
      try {
        await fetchJSON(`/api/admin/products/${id}/duplicate`, {
          method: 'POST', headers: { 'Authorization': `Bearer ${state.adminToken}` }
        });
        showToast('Product duplicated as draft!');
        renderAdminProductsStudio(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function deleteProduct(id) {
      if (!confirm('Are you sure you want to delete this product?')) return;
      try {
        await fetchJSON(`/api/admin/products/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${state.adminToken}` } });
        showToast('Product deleted successfully');
        renderAdminProductsStudio(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function openProductPreviewModal(id) {
      const modal = document.getElementById('globalModal');
      const content = document.getElementById('globalModalContent');
      modal.classList.remove('hidden'); modal.classList.add('flex');
      content.innerHTML = '<div class="text-center py-12 text-slate-400 font-mono">Loading product preview...</div>';

      try {
        const p = await fetchJSON(`/api/products/${id}`);
        content.innerHTML = `
          <button onclick="document.getElementById('globalModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
          <div class="space-y-6 font-sans">
            <span class="px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 font-bold text-[10px] uppercase">Read-Only Product Preview</span>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
              <img src="${p.images?.[0] || ''}" class="w-full h-64 object-cover rounded-2xl border border-white/10">
              <div class="space-y-3">
                <h1 class="text-xl font-black text-white">${p.name}</h1>
                <p class="text-xs text-slate-300">${p.description || p.short_description || ''}</p>
                <div class="text-2xl font-black text-emerald-400">₹${p.sale_price} <span class="text-xs text-slate-500 line-through">₹${p.original_price}</span></div>
                <span class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400">● ${p.status}</span>
              </div>
            </div>
            <div class="flex justify-end pt-4 border-t border-white/5">
              <button onclick="document.getElementById('globalModal').classList.add('hidden')" class="px-6 py-2.5 rounded-xl bg-white/10 text-white font-bold text-xs">Close Preview</button>
            </div>
          </div>
        `;
      } catch (err) { content.innerHTML = `<div class="text-rose-400 p-6">${err.message}</div>`; }
    }

    function adminSignOut() {
      state.adminToken = ''; state.adminUsername = '';
      localStorage.removeItem('nexus_admin_token'); localStorage.removeItem('nexus_admin_user');
      navigate('home');
    }

    document.addEventListener('DOMContentLoaded', () => { navigate('admin-center'); });
  </script>
</body>
</html>
