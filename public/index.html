<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS DIGITAL — Digital Marketplace & Admin Control</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: { 500: '#10b981', 600: '#059669' },
            surface: { 800: '#111827', 900: '#0b0f19', 950: '#030712' },
            admin: {
              sidebar: '#090d16',
              bg: '#05070d',
              card: '#0f1422',
              border: '#1c2438'
            }
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
    
    .glass {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .glass-card {
      background: linear-gradient(135deg, rgba(31, 41, 55, 0.45) 0%, rgba(17, 24, 39, 0.6) 100%);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      border-color: rgba(16, 185, 129, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7);
    }

    .admin-card {
      background-color: #0f1422;
      border: 1px solid #1c2438;
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- Toast Notification Hub -->
  <div id="toastHub" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

  <!-- Global Backdrop Overlay for Mobile Drawers -->
  <div id="appBackdrop" onclick="closeAllDrawers()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden transition-opacity"></div>

  <!-- Main Viewport Canvas -->
  <div id="mainViewport" class="flex flex-1 min-h-screen"></div>

  <!-- Global Modal for Inspection & Proof -->
  <div id="globalModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass max-w-2xl w-full rounded-3xl p-6 relative max-h-[90vh] overflow-y-auto custom-scroll" id="globalModalContent"></div>
  </div>

  <script>
    const state = {
      sessionId: 'sess_' + Math.random().toString(36).substring(2, 12),
      user: JSON.parse(localStorage.getItem('nexus_user') || 'null'),
      token: localStorage.getItem('nexus_token') || '',
      adminToken: localStorage.getItem('nexus_admin_token') || '',
      adminUsername: localStorage.getItem('nexus_admin_user') || '',
      cart: JSON.parse(localStorage.getItem('nexus_cart') || '[]'),
      appliedCoupon: null,
      currentView: 'home',
      adminSection: 'dashboard',
      paymentSettings: null
    };

    function showToast(message, type = 'success') {
      const hub = document.getElementById('toastHub');
      const toast = document.createElement('div');
      const colors = type === 'success' ? 'bg-emerald-500 text-gray-950' : 'bg-rose-500 text-white';
      toast.className = `px-5 py-3 rounded-2xl font-bold text-xs shadow-2xl flex items-center gap-2 transform transition-all duration-300 translate-y-[-10px] opacity-0 ${colors}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span> <span>${message}</span>`;
      hub.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-[-10px]', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-x-full');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function closeAllDrawers() {
      document.getElementById('appBackdrop').classList.add('hidden');
      const cSide = document.getElementById('customerSidebar');
      if (cSide) cSide.classList.add('-translate-x-full');
      const aSide = document.getElementById('adminSidebar');
      if (aSide) aSide.classList.add('-translate-x-full');
      document.getElementById('globalModal').classList.add('hidden');
    }

    function toggleCustomerDrawer(open) {
      const side = document.getElementById('customerSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) {
        side.classList.remove('-translate-x-full');
        drop.classList.remove('hidden');
      } else {
        side.classList.add('-translate-x-full');
        drop.classList.add('hidden');
      }
    }

    function toggleAdminDrawer(open) {
      const side = document.getElementById('adminSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) {
        side.classList.remove('-translate-x-full');
        drop.classList.remove('hidden');
      } else {
        side.classList.add('-translate-x-full');
        drop.classList.add('hidden');
      }
    }

    // Heartbeat Presence Monitor
    function sendHeartbeat(action = '') {
      fetch('/api/presence/heartbeat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionId: state.sessionId,
          page: state.currentView,
          action
        })
      }).catch(() => {});
    }
    setInterval(sendHeartbeat, 15000);

    // Global Router
    function navigate(view, params = {}) {
      state.currentView = view;
      closeAllDrawers();
      sendHeartbeat();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const viewport = document.getElementById('mainViewport');

      if (view === 'admin-center') {
        if (!state.adminToken) renderAdminLogin(viewport);
        else renderAdminSaaSLayout(viewport);
        return;
      }

      renderStorefrontLayout(viewport, view, params);
    }

    // =========================================================================
    // CUSTOMER STOREFRONT LAYOUT
    // =========================================================================
    function renderStorefrontLayout(viewport, view, params) {
      viewport.innerHTML = `
        <div class="flex flex-1 min-h-screen relative w-full bg-surface-950">
          
          <!-- Store Mobile / Desktop Sidebar -->
          <aside id="customerSidebar" class="fixed lg:static top-0 bottom-0 left-0 w-64 bg-surface-900 border-r border-white/5 z-50 flex flex-col justify-between transition-transform duration-300 -translate-x-full lg:translate-x-0">
            <div>
              <div class="p-6 border-b border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
                  <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center font-black text-gray-950 shadow-lg shadow-emerald-500/20">N</div>
                  <div>
                    <span class="font-extrabold text-sm tracking-wider text-white block">NEXUS</span>
                    <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">DIGITAL STORE</span>
                  </div>
                </div>
                <button onclick="toggleCustomerDrawer(false)" class="lg:hidden text-slate-400 p-1">✕</button>
              </div>

              <nav class="p-4 space-y-1.5 text-xs font-semibold">
                <button onclick="navigate('home')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>🏠</span> <span>Home</span></button>
                <button onclick="navigate('products')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>🛍</span> <span>All Products</span></button>
                <button onclick="navigate('cart')" class="w-full flex items-center justify-between px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all">
                  <div class="flex items-center gap-3"><span>🛒</span> <span>My Cart</span></div>
                  <span class="cart-count-badge px-2 py-0.5 rounded-full text-[10px] font-black bg-emerald-500 text-gray-950">${state.cart.length}</span>
                </button>
                <button onclick="navigate('orders')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>📦</span> <span>Purchased Items</span></button>
                <button onclick="navigate('account')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>👤</span> <span>${state.user ? state.user.name : 'My Account'}</span></button>
              </nav>
            </div>

            <div class="p-4 border-t border-white/5">
              <button onclick="navigate('admin-center')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold text-slate-400 bg-white/[0.03] hover:bg-emerald-500/10 hover:text-emerald-400 border border-white/5 transition-all">
                <span>🔐</span> <span>Admin Panel</span>
              </button>
            </div>
          </aside>

          <!-- Main Store Body -->
          <div class="flex-1 flex flex-col min-w-0">
            <header class="sticky top-0 z-30 glass border-b border-white/5 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <button onclick="toggleCustomerDrawer(true)" class="lg:hidden p-2 rounded-xl bg-white/5 text-slate-300">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div class="relative w-48 sm:w-80">
                  <input type="text" oninput="handleStoreSearch(this.value)" placeholder="Search products..." class="w-full pl-9 pr-4 py-2 rounded-xl bg-surface-900 border border-white/10 text-xs text-white placeholder-slate-500 focus:border-emerald-500 outline-none">
                  <svg class="w-4 h-4 text-slate-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <button onclick="navigate('cart')" class="relative p-2.5 rounded-xl bg-surface-900 border border-white/5 text-slate-300">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                  <span class="cart-count-badge absolute -top-1 -right-1 w-5 h-5 rounded-full bg-emerald-500 text-gray-950 text-[10px] font-black flex items-center justify-center">${state.cart.length}</span>
                </button>
              </div>
            </header>

            <main id="storeContent" class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto space-y-8"></main>
          </div>

        </div>
      `;

      const storeContent = document.getElementById('storeContent');
      switch(view) {
        case 'home': renderStoreHome(storeContent); break;
        case 'products': renderStoreProducts(storeContent, params); break;
        case 'product-details': renderStoreProductDetails(storeContent, params.id); break;
        case 'cart': renderStoreCart(storeContent); break;
        case 'checkout': renderStoreCheckout(storeContent); break;
        case 'orders': renderStoreOrders(storeContent); break;
        case 'account': renderStoreAccount(storeContent); break;
      }
    }

    async function renderStoreHome(container) {
      container.innerHTML = '<div class="text-center py-16 text-slate-500 font-bold animate-pulse">Loading digital goods...</div>';
      const res = await fetch('/api/products');
      const products = await res.json();

      container.innerHTML = `
        <div class="relative rounded-3xl overflow-hidden glass p-8 sm:p-14 border border-emerald-500/20 bg-gradient-to-r from-emerald-950/40 via-surface-900 to-surface-950">
          <div class="max-w-2xl space-y-4">
            <span class="px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-black uppercase inline-block">⚡ Verified Instant Delivery</span>
            <h1 class="text-3xl sm:text-5xl font-black tracking-tight text-white leading-tight">Premium <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200">Digital Goods</span> Marketplace</h1>
            <p class="text-xs sm:text-sm text-slate-400 leading-relaxed">Official license keys, software source code, and verified accounts. Pay with UPI or Crypto with fast verified unlock.</p>
            <div class="pt-2">
              <button onclick="navigate('products')" class="px-7 py-3.5 rounded-2xl bg-emerald-500 text-gray-950 font-black text-xs uppercase tracking-wider shadow-lg shadow-emerald-500/20 active:scale-95">Browse Catalog</button>
            </div>
          </div>
        </div>

        <section class="space-y-4">
          <h2 class="text-lg font-black text-white">All Digital Products</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            ${products.map(p => renderStoreProductCardHTML(p)).join('')}
          </div>
        </section>
      `;
    }

    function renderStoreProductCardHTML(p) {
      return `
        <div class="glass-card rounded-3xl overflow-hidden flex flex-col justify-between border border-white/5 relative group cursor-pointer" onclick="navigate('product-details', { id: '${p._id}' })">
          ${p.discount_percentage > 0 ? `<span class="absolute top-3 left-3 z-10 px-2.5 py-1 rounded-full bg-rose-500 text-white font-black text-[10px] uppercase">${p.discount_percentage}% OFF</span>` : ''}
          <span class="absolute top-3 right-3 z-10 px-2.5 py-1 rounded-full bg-surface-950/80 border border-white/10 text-emerald-400 font-bold text-[9px] uppercase">${p.delivery_type.replace('_', ' ')}</span>
          <div>
            <div class="h-44 w-full overflow-hidden bg-surface-900">
              <img src="${p.images[0] || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            </div>
            <div class="p-5 space-y-2">
              <h3 class="text-sm font-bold text-white line-clamp-1 group-hover:text-emerald-400 transition-colors">${p.name}</h3>
              <p class="text-xs text-slate-400 line-clamp-2">${p.short_description || p.description}</p>
            </div>
          </div>
          <div class="px-5 pb-5 pt-2 flex items-center justify-between border-t border-white/5" onclick="event.stopPropagation()">
            <div>
              <span class="text-base font-black text-white">₹${p.sale_price}</span>
              ${p.original_price > p.sale_price ? `<span class="text-xs text-slate-500 line-through ml-1">₹${p.original_price}</span>` : ''}
              <span class="text-[10px] ${p.in_stock ? 'text-emerald-400' : 'text-rose-400'} font-bold block">${p.in_stock ? '● In Stock' : '✕ Out of Stock'}</span>
            </div>
            <button onclick="addToCart('${p._id}', '${p.name.replace(/'/g, "\\'")}', ${p.sale_price}, '${p.images[0]}', '${p.delivery_type}')" ${!p.in_stock ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl ${p.in_stock ? 'bg-emerald-500 text-gray-950' : 'bg-gray-800 text-gray-500 cursor-not-allowed'} font-black text-xs uppercase">Add</button>
          </div>
        </div>
      `;
    }

    async function renderStoreProducts(container, filters = {}) {
      let queryUrl = '/api/products?';
      if (filters.search) queryUrl += `search=${encodeURIComponent(filters.search)}&`;

      const res = await fetch(queryUrl);
      const products = await res.json();

      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h1 class="text-xl font-black text-white">${filters.title || 'All Digital Products'}</h1>
              <p class="text-xs text-slate-400">${products.length} products found</p>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            ${products.map(p => renderStoreProductCardHTML(p)).join('')}
          </div>
        </div>
      `;
    }

    async function renderStoreProductDetails(container, productId) {
      container.innerHTML = '<div class="text-center py-20 text-slate-500 font-bold animate-pulse">Loading product details...</div>';
      const res = await fetch(`/api/products/${productId}`);
      const p = await res.json();
      const mainImage = p.images && p.images.length ? p.images[0] : 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800';

      container.innerHTML = `
        <div class="space-y-10">
          <button onclick="navigate('products')" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">← Back to Catalog</button>
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 space-y-4">
              <div class="h-72 sm:h-96 rounded-3xl overflow-hidden glass border border-white/10 relative">
                <img id="storeMainImg" src="${mainImage}" class="w-full h-full object-cover">
              </div>
              ${p.images && p.images.length > 1 ? `
                <div class="flex gap-3">
                  ${p.images.map(img => `<img onclick="document.getElementById('storeMainImg').src='${img}'" src="${img}" class="w-20 h-20 rounded-2xl object-cover glass cursor-pointer border border-white/10 hover:border-emerald-400">`).join('')}
                </div>
              ` : ''}
            </div>
            <div class="lg:col-span-5 space-y-6">
              <div>
                <span class="px-3 py-1 rounded-full bg-surface-900 border border-white/10 text-emerald-400 font-bold text-[10px] uppercase">${p.delivery_type.replace('_', ' ')}</span>
                <h1 class="text-2xl sm:text-3xl font-black text-white mt-2">${p.name}</h1>
                <p class="text-xs text-slate-400 mt-1">${p.short_description || ''}</p>
              </div>
              <div class="p-5 rounded-3xl glass border border-white/5">
                <div class="text-3xl font-black text-white">₹${p.sale_price}</div>
                <span class="text-xs ${p.in_stock ? 'text-emerald-400' : 'text-rose-400'} font-bold">${p.in_stock ? `● In Stock (${p.stock_count} units)` : '✕ Out of Stock'}</span>
              </div>
              <div class="space-y-3">
                <button onclick="buyNowStore('${p._id}', '${p.name.replace(/'/g, "\\'")}', ${p.sale_price}, '${mainImage}', '${p.delivery_type}')" ${!p.in_stock ? 'disabled' : ''} class="w-full py-4 rounded-2xl ${p.in_stock ? 'bg-emerald-500 text-gray-950 font-black' : 'bg-gray-800 text-gray-500'} text-xs uppercase tracking-wider">Buy Now (UPI / Crypto)</button>
                <button onclick="addToCart('${p._id}', '${p.name.replace(/'/g, "\\'")}', ${p.sale_price}, '${mainImage}', '${p.delivery_type}')" ${!p.in_stock ? 'disabled' : ''} class="w-full py-4 rounded-2xl glass text-white font-bold text-xs uppercase">Add to Cart</button>
              </div>
            </div>
          </div>
          <div class="glass rounded-3xl p-6 sm:p-8 space-y-4">
            <h3 class="text-sm font-black text-white uppercase">Product Description</h3>
            <p class="text-xs text-slate-300 leading-relaxed whitespace-pre-line">${p.description}</p>
          </div>
        </div>
      `;
    }

    function buyNowStore(id, name, price, image, delivery_type) {
      addToCart(id, name, price, image, delivery_type);
      navigate('checkout');
    }

    function addToCart(product_id, name, price, image, delivery_type) {
      const exists = state.cart.find(i => i.product_id === product_id);
      if (exists) return showToast('Item already in your cart', 'error');
      state.cart.push({ product_id, name, price, image, delivery_type });
      localStorage.setItem('nexus_cart', JSON.stringify(state.cart));
      document.querySelectorAll('.cart-count-badge').forEach(b => b.textContent = state.cart.length);
      showToast(`Added "${name}" to cart`);
    }

    function removeFromCart(idx) {
      state.cart.splice(idx, 1);
      localStorage.setItem('nexus_cart', JSON.stringify(state.cart));
      document.querySelectorAll('.cart-count-badge').forEach(b => b.textContent = state.cart.length);
      renderStoreCart(document.getElementById('storeContent'));
    }

    function renderStoreCart(container) {
      const subtotal = state.cart.reduce((a, b) => a + b.price, 0);
      container.innerHTML = `
        <div class="max-w-3xl mx-auto space-y-6">
          <h1 class="text-xl font-black text-white">Shopping Cart</h1>
          ${state.cart.length === 0 ? `<div class="glass rounded-3xl p-12 text-center text-xs text-slate-400">Cart is empty.</div>` : `
            <div class="space-y-3">
              ${state.cart.map((item, idx) => `
                <div class="glass rounded-2xl p-4 flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <img src="${item.image || ''}" class="w-12 h-12 rounded-xl object-cover">
                    <div>
                      <h4 class="text-xs font-bold text-white">${item.name}</h4>
                      <span class="text-[10px] text-emerald-400 font-mono">${item.delivery_type.replace('_', ' ')}</span>
                    </div>
                  </div>
                  <div class="flex items-center gap-4">
                    <span class="text-sm font-black text-white">₹${item.price}</span>
                    <button onclick="removeFromCart(${idx})" class="text-slate-500 hover:text-rose-400">✕</button>
                  </div>
                </div>
              `).join('')}
            </div>
            <div class="glass rounded-3xl p-6 space-y-4">
              <div class="flex justify-between text-sm font-black text-white"><span>Total:</span> <span class="text-emerald-400">₹${subtotal}</span></div>
              <button onclick="navigate('checkout')" class="w-full py-4 rounded-2xl bg-emerald-500 text-gray-950 font-black text-xs uppercase">Proceed To Checkout</button>
            </div>
          `}
        </div>
      `;
    }

    // =========================================================================
    // STORE CHECKOUT & PAYMENT FLOW
    // =========================================================================
    async function renderStoreCheckout(container) {
      if (!state.token) return renderCustomerAuthPrompt(container, 'checkout');
      if (!state.cart.length) return navigate('cart');

      const pRes = await fetch('/api/payment-methods');
      state.paymentSettings = await pRes.json();
      const subtotal = state.cart.reduce((a, b) => a + b.price, 0);

      container.innerHTML = `
        <div class="max-w-4xl mx-auto space-y-8">
          <div>
            <h1 class="text-2xl font-black text-white">Choose Payment Method</h1>
            <p class="text-xs text-slate-400">Select payment method and upload transfer proof for manual verification</p>
          </div>

          <div id="checkoutStep1" class="grid grid-cols-1 md:grid-cols-12 gap-8">
            <div class="md:col-span-7 space-y-4">
              
              <div onclick="selectPaymentMethod('UPI')" id="methodCardUPI" class="glass rounded-3xl p-6 cursor-pointer border-2 border-emerald-500/80 space-y-2">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <span class="text-2xl">💳</span>
                    <div>

    let selectedMethod = 'UPI';
    function selectPaymentMethod(m) {
      selectedMethod = m;
      if (m === 'UPI') {
        document.getElementById('methodCardUPI').className = 'glass rounded-3xl p-6 cursor-pointer border-2 border-emerald-500/80 space-y-2';
        document.getElementById('methodCardCrypto').className = 'glass rounded-3xl p-6 cursor-pointer border border-white/5 space-y-2';
        document.getElementById('radioUPI').className = 'w-4 h-4 rounded-full border-2 border-emerald-400 bg-emerald-400';
        document.getElementById('radioCrypto').className = 'w-4 h-4 rounded-full border-2 border-slate-600';
      } else {
        document.getElementById('methodCardCrypto').className = 'glass rounded-3xl p-6 cursor-pointer border-2 border-emerald-500/80 space-y-2';
        document.getElementById('methodCardUPI').className = 'glass rounded-3xl p-6 cursor-pointer border border-white/5 space-y-2';
        document.getElementById('radioCrypto').className = 'w-4 h-4 rounded-full border-2 border-emerald-400 bg-emerald-400';
        document.getElementById('radioUPI').className = 'w-4 h-4 rounded-full border-2 border-slate-600';
      }
    }

    async function applyStoreCoupon() {
      const code = document.getElementById('storeCouponInput').value.trim();
      const subtotal = state.cart.reduce((a, b) => a + b.price, 0);
      try {
        const res = await fetch('/api/cart/validate-coupon', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, subtotal })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        state.appliedCoupon = data;
        document.getElementById('storeCouponMsg').innerHTML = `<span class="text-emerald-400 font-bold">✓ Applied! Total: ₹${data.final_total}</span>`;
        document.getElementById('chkFinalAmount').textContent = `₹${data.final_total}`;
      } catch (err) {
        document.getElementById('storeCouponMsg').innerHTML = `<span class="text-rose-400 font-bold">✕ ${err.message}</span>`;
      }
    }

    async function startPaymentFlow() {
      const btn = document.getElementById('startPayBtn');
      btn.disabled = true;
      btn.textContent = 'Generating Transaction...';

      try {
        const res = await fetch('/api/checkout/initiate-order', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.token}`
          },
          body: JSON.stringify({
            items: state.cart,
            payment_method: selectedMethod,
            coupon_code: state.appliedCoupon ? state.appliedCoupon.code : ''
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        document.getElementById('checkoutStep1').classList.add('hidden');
        const step2 = document.getElementById('checkoutStep2');
        step2.classList.remove('hidden');

        const ps = state.paymentSettings;
        const txn = data.transaction;

        let detailsHTML = '';
        if (selectedMethod === 'UPI') {
          detailsHTML = `
            <div class="text-center space-y-4">
              <img src="${ps.upi_qr_url}" class="w-56 h-56 mx-auto rounded-2xl glass p-2 bg-white">
              <div class="space-y-1">
                <span class="text-[10px] text-slate-500 uppercase font-bold">UPI ID</span>
                <div class="font-mono text-emerald-400 text-sm font-bold">${ps.upi_id}</div>
                <button onclick="navigator.clipboard.writeText('${ps.upi_id}'); showToast('UPI ID copied!')" class="text-xs text-slate-400 hover:text-white underline">Copy UPI ID</button>
              </div>
              <div class="text-xs text-slate-400 max-w-sm mx-auto whitespace-pre-line text-left bg-surface-950 p-4 rounded-2xl">${ps.upi_instructions}</div>
            </div>
          `;
        } else {
          detailsHTML = `
            <div class="text-center space-y-4">
              <img src="${ps.crypto_qr_url}" class="w-56 h-56 mx-auto rounded-2xl glass p-2 bg-white">
              <div class="space-y-1">
                <span class="text-[10px] text-slate-500 uppercase font-bold">Deposit Wallet (${ps.crypto_currency} - ${ps.crypto_network})</span>
                <div class="font-mono text-emerald-400 text-xs font-bold break-all">${ps.crypto_wallet_address}</div>
                <button onclick="navigator.clipboard.writeText('${ps.crypto_wallet_address}'); showToast('Wallet address copied!')" class="text-xs text-slate-400 hover:text-white underline">Copy Wallet Address</button>
              </div>
              <div class="text-xs text-slate-400 max-w-sm mx-auto whitespace-pre-line text-left bg-surface-950 p-4 rounded-2xl">${ps.crypto_instructions}</div>
            </div>
          `;
        }

        step2.innerHTML = `
          <div class="glass rounded-3xl p-6 sm:p-10 space-y-6 max-w-2xl mx-auto">
            <div class="flex justify-between items-center border-b border-white/5 pb-4">
              <div>
                <span class="text-[10px] font-mono text-slate-500">TRANSACTION ID</span>
                <h3 class="text-base font-black text-white font-mono">${txn.txn_id}</h3>
              </div>
              <div class="text-right">
                <span class="text-[10px] text-slate-500">AMOUNT</span>
                <div class="text-lg font-black text-emerald-400 font-mono">₹${txn.amount}</div>
              </div>
            </div>

            ${detailsHTML}

            <form onsubmit="submitPaymentProof(event, '${txn.txn_id}')" class="space-y-4 pt-4 border-t border-white/5">
              <label class="text-xs font-bold text-white block">Upload Payment Proof Screenshot (JPG, PNG, WEBP)</label>
              <input type="file" id="proofFileInput" accept="image/png, image/jpeg, image/webp" required class="w-full text-xs text-slate-400 file:mr-4 file:py-3 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-500/10 file:text-emerald-400 hover:file:bg-emerald-500/20">
              
              <button type="submit" id="submitProofBtn" class="w-full py-4 rounded-2xl bg-emerald-500 text-gray-950 font-black text-xs uppercase tracking-wider">
                Submit Payment Proof for Verification
              </button>
            </form>
          </div>
        `;
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Proceed to Payment →';
        showToast(err.message, 'error');
      }
    }

    async function submitPaymentProof(e, txnId) {
      e.preventDefault();
      const fileInput = document.getElementById('proofFileInput');
      if (!fileInput.files.length) return;

      const btn = document.getElementById('submitProofBtn');
      btn.disabled = true;
      btn.textContent = 'Uploading Proof...';

      const formData = new FormData();
      formData.append('transaction_id', txnId);
      formData.append('screenshot', fileInput.files[0]);

      try {
        const res = await fetch('/api/checkout/upload-proof', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${state.token}` },
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        state.cart = [];
        state.appliedCoupon = null;
        localStorage.removeItem('nexus_cart');
        document.querySelectorAll('.cart-count-badge').forEach(b => b.textContent = '0');

        showToast('Proof submitted! Payment is being verified.');
        navigate('orders');
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Submit Payment Proof for Verification';
        showToast(err.message, 'error');
      }
    }

          body: JSON.stringify({ email: document.getElementById('cLogEmail').value, password: document.getElementById('cLogPass').value })

        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        state.token = data.token;

              <div class="flex items-center gap-2">

                <span class="text-xs font-bold text-emerald-400 font-mono">Online</span>
              </div>
            </header>

            <main id="adminMainContent" class="flex-1 p-4 sm:p-8 space-y-8 max-w-7xl w-full mx-auto"></main>
          </div>

        </div>
      `;

      switchAdminSection(state.adminSection || 'dashboard');
    }

    function switchAdminSection(sec) {
      state.adminSection = sec;
      closeAllDrawers();
      const content = document.getElementById('adminMainContent');
      if (!content) return;

      document.querySelectorAll('[id^="adnav-"]').forEach(b => b.classList.remove('bg-emerald-500/10', 'text-emerald-400'));
      const active = document.getElementById(`adnav-${sec}`);
      if (active) active.classList.add('bg-emerald-500/10', 'text-emerald-400');

      switch(sec) {
        case 'dashboard': renderAdminOverview(content); break;
        case 'transactions': renderAdminTransactions(content); break;
        case 'products': renderAdminProductsStudio(content); break;
        case 'payment-settings': renderAdminPaymentSettings(content); break;
      }
    }

    async function renderAdminOverview(container) {
      container.innerHTML = '<div class="text-center py-12 text-slate-500 font-mono">Refreshing live status & metrics...</div>';
      const [statsRes, liveRes] = await Promise.all([
        fetch('/api/admin/stats', { headers: { 'Authorization': `Bearer ${state.adminToken}` } }),
        fetch('/api/admin/live-status', { headers: { 'Authorization': `Bearer ${state.adminToken}` } })
      ]);
      const stats = await statsRes.json();
      const live = await liveRes.json();

      const pBadge = document.getElementById('pendingTxnCountBadge');
      if (pBadge) pBadge.textContent = stats.pendingPayments || '0';

      container.innerHTML = `
        <div class="space-y-6">
          
          <div class="admin-card rounded-3xl p-6 border border-emerald-500/30 bg-gradient-to-r from-emerald-950/20 to-admin-card">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <span class="w-3.5 h-3.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <div>
                  <h3 class="text-sm font-bold text-white">LIVE WEBSITE STATUS</h3>
                  <p class="text-xs text-slate-400">Real-time visitor presence</p>
                </div>
              </div>
              <div class="flex flex-wrap gap-2 font-mono text-xs">
                <div class="px-3 py-1.5 rounded-xl bg-surface-950 border border-admin-border"><span class="text-emerald-400 font-bold">${live.total_live_visitors}</span> Live Visitors</div>
                <div class="px-3 py-1.5 rounded-xl bg-surface-950 border border-admin-border"><span class="text-teal-400 font-bold">${live.product_viewers}</span> Viewing Products</div>
                <div class="px-3 py-1.5 rounded-xl bg-surface-950 border border-admin-border"><span class="text-amber-400 font-bold">${live.checkout_users}</span> At Checkout</div>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="admin-card rounded-2xl p-5"><span class="text-[10px] text-slate-500 font-mono uppercase">Total Revenue</span><div class="text-2xl font-black text-emerald-400 font-mono">₹${stats.totalRevenue}</div></div>
            <div class="admin-card rounded-2xl p-5"><span class="text-[10px] text-slate-500 font-mono uppercase">Pending Payments</span><div class="text-2xl font-black text-amber-400 font-mono">${stats.pendingPayments}</div></div>
            <div class="admin-card rounded-2xl p-5"><span class="text-[10px] text-slate-500 font-mono uppercase">Confirmed Payments</span><div class="text-2xl font-black text-white font-mono">${stats.confirmedPayments}</div></div>
            <div class="admin-card rounded-2xl p-5"><span class="text-[10px] text-slate-500 font-mono uppercase">Today's Orders</span><div class="text-2xl font-black text-white font-mono">${stats.todayOrders}</div></div>
          </div>

          <div class="admin-card rounded-3xl p-6 space-y-4">
            <h3 class="text-xs font-bold uppercase text-slate-400 font-mono">Live Activity Stream</h3>
            <div class="space-y-2 max-h-60 overflow-y-auto custom-scroll">
              ${(live.recent_activity || []).map(a => `
                <div class="p-3 rounded-xl bg-surface-950/80 border border-admin-border text-xs flex justify-between items-center">
                  <span class="text-slate-300">${a.text}</span>
                  <span class="font-mono text-[10px] text-slate-500">${new Date(a.created_at).toLocaleTimeString()}</span>
                </div>
              `).join('')}
            </div>
          </div>

        </div>
      `;
    }

    async function renderAdminTransactions(container) {
      container.innerHTML = '<div class="text-center py-12 text-slate-500 font-mono">Loading transaction queue...</div>';
      const res = await fetch('/api/admin/transactions', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
      const txns = await res.json();

      container.innerHTML = `
        <div class="space-y-6">
          <div>
            <h2 class="text-lg font-black text-white">Manual Payment Verifications</h2>
            <p class="text-xs text-slate-400">Verify screenshots to unlock customer digital keys</p>
          </div>

          <div class="admin-card rounded-3xl p-6">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="border-b border-admin-border text-slate-500 font-mono">
                    <th class="pb-3">TXN ID</th>
                    <th class="pb-3">Customer</th>
                    <th class="pb-3">Amount</th>
                    <th class="pb-3">Method</th>
                    <th class="pb-3">Status</th>
                    <th class="pb-3">Proof</th>
                    <th class="pb-3 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-admin-border font-mono">
                  ${txns.map(t => `
                    <tr>
                      <td class="py-3.5 font-bold text-white">${t.txn_id}</td>
                      <td class="py-3.5 text-slate-300">${t.customer_name}</td>
                      <td class="py-3.5 text-emerald-400 font-bold">₹${t.amount}</td>
                      <td class="py-3.5 text-slate-400">${t.payment_method}</td>
                      <td class="py-3.5">
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${
                          t.status === 'CONFIRMED' ? 'bg-emerald-500/10 text-emerald-400' :
                          t.status === 'PROCESSING' ? 'bg-amber-500/10 text-amber-400' :
                          t.status === 'REJECTED' ? 'bg-rose-500/10 text-rose-400' : 'bg-slate-500/10 text-slate-400'
                        }">${t.status}</span>
                      </td>
                      <td class="py-3.5">
                        ${t.proof_screenshot ? `
                          <button onclick="viewPaymentProofModal('${t.proof_screenshot}', '${t.txn_id}')" class="px-3 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-white font-bold text-[11px]">
                            🔍 View
                          </button>
                        ` : '<span class="text-slate-500">No proof</span>'}
                      </td>
                      <td class="py-3.5 text-right space-x-2">
                        ${t.status === 'PROCESSING' ? `
                          <button onclick="confirmTransaction('${t._id}')" class="px-3 py-1 rounded-lg bg-emerald-500 text-gray-950 font-black">Confirm</button>
                          <button onclick="rejectTransaction('${t._id}')" class="px-3 py-1 rounded-lg bg-rose-500/20 text-rose-400 font-bold">Reject</button>
                        ` : '<span class="text-slate-600">Settled</span>'}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function viewPaymentProofModal(imgUrl, txnId) {
      const modal = document.getElementById('globalModal');
      const content = document.getElementById('globalModalContent');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      content.innerHTML = `
        <button onclick="document.getElementById('globalModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400">✕</button>
        <h3 class="text-base font-bold text-white mb-2">Payment Proof Screenshot (${txnId})</h3>
        <div class="rounded-2xl overflow-hidden glass max-h-[70vh] flex items-center justify-center bg-black">
          <img src="${imgUrl}" class="max-h-[68vh] object-contain">
        </div>
      `;
    }

    async function confirmTransaction(id) {
      if (!confirm('Confirm payment and unlock credentials for customer?')) return;
      try {
        const res = await fetch(`/api/admin/transactions/${id}/confirm`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${state.adminToken}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showToast('Payment confirmed! Digital items unlocked.');
        renderAdminTransactions(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function rejectTransaction(id) {
      const reason = prompt('Enter rejection reason:', 'Payment screenshot invalid.');
      if (reason === null) return;

      try {
        const res = await fetch(`/api/admin/transactions/${id}/reject`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.adminToken}`
          },
          body: JSON.stringify({ reason })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showToast('Transaction rejected');
        renderAdminTransactions(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function renderAdminPaymentSettings(container) {
      container.innerHTML = '<div class="text-center py-12 text-slate-500 font-mono">Loading payment configurations...</div>';
      const res = await fetch('/api/admin/payment-settings', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
      const s = await res.json();

      container.innerHTML = `
        <div class="max-w-3xl space-y-6">
          <div>
            <h2 class="text-lg font-black text-white">Payment Gateway Settings</h2>
            <p class="text-xs text-slate-400">Configure UPI and Crypto details displayed to customers</p>
          </div>

          <form onsubmit="saveAdminPaymentSettings(event)" class="space-y-6 text-xs">
            <div class="admin-card rounded-3xl p-6 space-y-4">
              <h3 class="font-bold uppercase text-emerald-400 font-mono">1. UPI Configuration</h3>
              <div class="space-y-3">
                <input type="text" id="admUpiId" required value="${s.upi_id || ''}" placeholder="UPI ID (e.g. merchant@okaxis)" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-white font-mono">
                <input type="text" id="admUpiName" required value="${s.upi_name || ''}" placeholder="Payee Name" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-white">
                <input type="text" id="admUpiQr" required value="${s.upi_qr_url || ''}" placeholder="QR Code URL" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-white font-mono">
                <textarea id="admUpiInst" rows="3" placeholder="Instructions" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-white">${s.upi_instructions || ''}</textarea>
              </div>
            </div>

            <div class="admin-card rounded-3xl p-6 space-y-4">
              <h3 class="font-bold uppercase text-teal-400 font-mono">2. Crypto Configuration</h3>
              <div class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                  <input type="text" id="admCryptoCurr" required value="${s.crypto_currency || 'USDT'}" placeholder="Currency" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-white font-mono">
                  <input type="text" id="admCryptoNet" required value="${s.crypto_network || 'TRC20'}" placeholder="Network" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-white font-mono">
                </div>
                <input type="text" id="admCryptoWallet" required value="${s.crypto_wallet_address || ''}" placeholder="Wallet Address" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-white font-mono">
                <input type="text" id="admCryptoQr" required value="${s.crypto_qr_url || ''}" placeholder="Crypto QR Code URL" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-white font-mono">
                <textarea id="admCryptoInst" rows="3" placeholder="Instructions" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-white">${s.crypto_instructions || ''}</textarea>
              </div>
            </div>

            <button type="submit" class="w-full py-4 rounded-2xl bg-emerald-500 text-gray-950 font-black uppercase tracking-wider">
              Save Payment Settings
            </button>
          </form>
        </div>
      `;
    }

    async function saveAdminPaymentSettings(e) {
      e.preventDefault();
      const payload = {
        upi_id: document.getElementById('admUpiId').value,
        upi_name: document.getElementById('admUpiName').value,
        upi_qr_url: document.getElementById('admUpiQr').value,
        upi_instructions: document.getElementById('admUpiInst').value,
        crypto_currency: document.getElementById('admCryptoCurr').value,
        crypto_network: document.getElementById('admCryptoNet').value,
        crypto_wallet_address: document.getElementById('admCryptoWallet').value,
        crypto_qr_url: document.getElementById('admCryptoQr').value,
        crypto_instructions: document.getElementById('admCryptoInst').value
      };

      try {
        const res = await fetch('/api/admin/payment-settings', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.adminToken}`
          },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error((await res.json()).error);
        showToast('Payment settings saved!');
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function renderAdminProductsStudio(container) {
      const res = await fetch('/api/admin/products', { headers: { 'Authorization': `Bearer ${state.adminToken}` } });
      const products = await res.json();

      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <h2 class="text-lg font-black text-white">Product Studio</h2>
            <button onclick="openProductFormModal('new')" class="px-4 py-2.5 rounded-xl bg-emerald-500 text-gray-950 font-black text-xs uppercase">+ Add Product</button>
          </div>

          <div class="admin-card rounded-3xl p-6">
            <table class="w-full text-left text-xs font-mono">
              <thead><tr class="border-b border-admin-border text-slate-500"><th class="pb-2">Product</th><th class="pb-2">Price</th><th class="pb-2">Stock</th><th class="pb-2 text-right">Actions</th></tr></thead>
              <tbody class="divide-y divide-admin-border">
                ${products.map(p => `
                  <tr>
                    <td class="py-3 text-white font-bold">${p.name}</td>
                    <td class="py-3">₹${p.sale_price}</td>
                    <td class="py-3 ${p.stock_count > 0 ? 'text-emerald-400' : 'text-rose-400'}">${p.stock_count} units</td>
                    <td class="py-3 text-right space-x-2">
                      <button onclick="openProductInventoryModal('${p._id}', '${p.name.replace(/'/g, "\\'")}', '${p.delivery_type}')" class="text-teal-400">+ Stock</button>
                      <button onclick="deleteAdminProduct('${p._id}')" class="text-rose-400">Delete</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function openProductFormModal(id) {
      const modal = document.getElementById('globalModal');
      const content = document.getElementById('globalModalContent');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      content.innerHTML = `
        <button onclick="document.getElementById('globalModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400">✕</button>
        <h3 class="text-base font-black text-white mb-4">Add Digital Product</h3>
        <form onsubmit="submitAdminProduct(event)" class="space-y-3 text-xs">
          <input type="text" id="npTitle" required placeholder="Product Title" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-white">
          <input type="text" id="npShort" required placeholder="Short Tagline" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-white">
          <textarea id="npFull" rows="3" placeholder="Full Description" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-white"></textarea>
          <div class="grid grid-cols-2 gap-3">
            <input type="number" id="npPrice" required placeholder="Sale Price (₹)" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-white">
            <select id="npDeliv" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-white">
              <option value="EMAIL_PASSWORD">Email + Password</option>
              <option value="LICENSE_KEY">License Key</option>
              <option value="STANDARD_LINK">Standard Link</option>
            </select>
          </div>
          <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-500 text-gray-950 font-black uppercase">Create Product</button>
        </form>
      `;
    }

    async function submitAdminProduct(e) {
      e.preventDefault();
      try {
        const res = await fetch('/api/admin/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.adminToken}` },
          body: JSON.stringify({
            name: document.getElementById('npTitle').value,
            short_description: document.getElementById('npShort').value,
            description: document.getElementById('npFull').value,
            sale_price: Number(document.getElementById('npPrice').value),
            original_price: Number(document.getElementById('npPrice').value) * 1.5,
            delivery_type: document.getElementById('npDeliv').value
          })
        });
        if (!res.ok) throw new Error((await res.json()).error);
        showToast('Product added!');
        document.getElementById('globalModal').classList.add('hidden');
        renderAdminProductsStudio(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    function openProductInventoryModal(productId, productName, deliveryType) {
      const modal = document.getElementById('globalModal');
      const content = document.getElementById('globalModalContent');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      let fields = '';
      if (deliveryType === 'EMAIL_PASSWORD') {
        fields = `
          <input type="email" id="invEm" required placeholder="Account Email" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-white">
          <input type="text" id="invPw" required placeholder="Account Password" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-white">
        `;
      } else if (deliveryType === 'LICENSE_KEY') {
        fields = `<input type="text" id="invLk" required placeholder="License Key" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-white font-mono">`;
      } else {
        fields = `<input type="url" id="invUrl" required placeholder="Product URL" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-white/10 text-white">`;
      }

      content.innerHTML = `
        <button onclick="document.getElementById('globalModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400">✕</button>
        <h3 class="text-base font-bold text-white mb-2">Attach Stock: ${productName}</h3>
        <form onsubmit="submitInventoryStock(event, '${productId}', '${deliveryType}')" class="space-y-3 text-xs">
          ${fields}
          <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-500 text-gray-950 font-black uppercase">Attach Unit</button>
        </form>
      `;
    }

    async function submitInventoryStock(e, productId, deliveryType) {
      e.preventDefault();
      const payload = { delivery_type: deliveryType };
      if (deliveryType === 'EMAIL_PASSWORD') {
        payload.email = document.getElementById('invEm').value;
        payload.password = document.getElementById('invPw').value;
      } else if (deliveryType === 'LICENSE_KEY') {
        payload.license_key = document.getElementById('invLk').value;
      } else {
        payload.delivery_url = document.getElementById('invUrl').value;
      }

      try {
        const res = await fetch(`/api/admin/inventory/${productId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.adminToken}` },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error((await res.json()).error);
        showToast('Stock unit attached!');
        document.getElementById('globalModal').classList.add('hidden');
        renderAdminProductsStudio(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function deleteAdminProduct(id) {
      if (!confirm('Delete product?')) return;
      try {
        await fetch(`/api/admin/products/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${state.adminToken}` }
        });
        showToast('Product deleted');
        renderAdminProductsStudio(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    function adminSignOut() {
      state.adminToken = '';
      state.adminUsername = '';
      localStorage.removeItem('nexus_admin_token');
      localStorage.removeItem('nexus_admin_user');
      navigate('home');
    }

    document.addEventListener('DOMContentLoaded', () => {
      navigate('home');
    });
  </script>
</body>
</html>
