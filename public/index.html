<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS DIGITAL — Digital Goods & Account Slots</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: { 500: '#10b981', 600: '#059669' },
            surface: { 800: '#111827', 900: '#0b0f19', 950: '#030712' },
            admin: {
              sidebar: '#090d16',
              bg: '#05070d',
              card: '#0f1422',
              border: '#1c2438'
            }
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
    
    .glass {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .glass-card {
      background: linear-gradient(135deg, rgba(31, 41, 55, 0.45) 0%, rgba(17, 24, 39, 0.6) 100%);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      border-color: rgba(16, 185, 129, 0.4);
      transform: translateY(-4px);
    }

    .admin-card {
      background-color: #0f1422;
      border: 1px solid #1c2438;
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <div id="toastHub" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
  <div id="appBackdrop" onclick="closeAllDrawers()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden transition-opacity"></div>
  <div id="mainViewport" class="flex flex-1 min-h-screen"></div>

  <!-- Global Modal for Inspection & Studio Edit Forms -->
  <div id="globalModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass max-w-3xl w-full rounded-3xl p-6 relative max-h-[90vh] overflow-y-auto custom-scroll" id="globalModalContent"></div>
  </div>

  <script>
    const state = {
      sessionId: 'sess_' + Math.random().toString(36).substring(2, 12),
      user: JSON.parse(localStorage.getItem('nexus_user') || 'null'),
      token: localStorage.getItem('nexus_token') || '',
      adminToken: localStorage.getItem('nexus_admin_token') || '',
      adminUsername: localStorage.getItem('nexus_admin_user') || '',
      cart: JSON.parse(localStorage.getItem('nexus_cart') || '[]'),
      currentView: 'home',
      adminSection: 'dashboard',
      paymentSettings: null,
      slotFilterProduct: 'ALL',
      slotFilterStatus: 'ALL'
    };

    function showToast(message, type = 'success') {
      const hub = document.getElementById('toastHub');
      const toast = document.createElement('div');
      const colors = type === 'success' ? 'bg-emerald-500 text-gray-950' : 'bg-rose-500 text-white';
      toast.className = `px-5 py-3 rounded-2xl font-bold text-xs shadow-2xl flex items-center gap-2 transform transition-all duration-300 translate-y-[-10px] opacity-0 ${colors}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : '✕'}</span> <span>${message}</span>`;
      hub.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-[-10px]', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-x-full');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function closeAllDrawers() {
      document.getElementById('appBackdrop').classList.add('hidden');
      const cSide = document.getElementById('customerSidebar');
      if (cSide) cSide.classList.add('-translate-x-full');
      const aSide = document.getElementById('adminSidebar');
      if (aSide) aSide.classList.add('-translate-x-full');
      document.getElementById('globalModal').classList.add('hidden');
    }

    function toggleCustomerDrawer(open) {
      const side = document.getElementById('customerSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) { side.classList.remove('-translate-x-full'); drop.classList.remove('hidden'); }
      else { side.classList.add('-translate-x-full'); drop.classList.add('hidden'); }
    }

    function toggleAdminDrawer(open) {
      const side = document.getElementById('adminSidebar');
      const drop = document.getElementById('appBackdrop');
      if (open) { side.classList.remove('-translate-x-full'); drop.classList.remove('hidden'); }
      else { side.classList.add('-translate-x-full'); drop.classList.add('hidden'); }
    }

    function sendHeartbeat(action = '') {
      fetch('/api/presence/heartbeat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionId: state.sessionId,
          page: state.currentView,
          action
        })
      }).catch(() => {});
    }
    setInterval(sendHeartbeat, 15000);

    function navigate(view, params = {}) {
      state.currentView = view;
      closeAllDrawers();
      sendHeartbeat();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const viewport = document.getElementById('mainViewport');
      if (view === 'admin-center') {
        if (!state.adminToken) renderAdminLogin(viewport);
        else renderAdminSaaSLayout(viewport);
        return;
      }
      renderStorefrontLayout(viewport, view, params);
    }

    // =========================================================================
    // STOREFRONT LAYOUT & CATALOG
    // =========================================================================
    function renderStorefrontLayout(viewport, view, params) {
      viewport.innerHTML = `
        <div class="flex flex-1 min-h-screen relative w-full bg-surface-950">
          <aside id="customerSidebar" class="fixed lg:static top-0 bottom-0 left-0 w-64 bg-surface-900 border-r border-white/5 z-50 flex flex-col justify-between transition-transform duration-300 -translate-x-full lg:translate-x-0">
            <div>
              <div class="p-6 border-b border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
                  <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center font-black text-gray-950 shadow-lg shadow-emerald-500/20">N</div>
                  <div>
                    <span class="font-extrabold text-sm tracking-wider text-white block">NEXUS</span>
                    <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">DIGITAL VAULT</span>
                  </div>
                </div>
                <button onclick="toggleCustomerDrawer(false)" class="lg:hidden text-slate-400 p-1">✕</button>
              </div>

              <nav class="p-4 space-y-1.5 text-xs font-semibold">
                <button onclick="navigate('home')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>🏠</span> <span>Home</span></button>
                <button onclick="navigate('products')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>🛍</span> <span>All Products</span></button>
                <button onclick="navigate('cart')" class="w-full flex items-center justify-between px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all">
                  <div class="flex items-center gap-3"><span>🛒</span> <span>My Cart</span></div>
                  <span class="cart-count-badge px-2 py-0.5 rounded-full text-[10px] font-black bg-emerald-500 text-gray-950">${state.cart.length}</span>
                </button>
                <button onclick="navigate('orders')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>📦</span> <span>Purchased Items</span></button>
                <button onclick="navigate('account')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><span>👤</span> <span>${state.user ? state.user.name : 'My Account'}</span></button>
              </nav>
            </div>

            <div class="p-4 border-t border-white/5">
              <button onclick="navigate('admin-center')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold text-slate-400 bg-white/[0.03] hover:bg-emerald-500/10 hover:text-emerald-400 border border-white/5 transition-all">
                <span>🔐</span> <span>Admin Panel</span>
              </button>
            </div>
          </aside>

          <div class="flex-1 flex flex-col min-w-0">
            <header class="sticky top-0 z-30 glass border-b border-white/5 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <button onclick="toggleCustomerDrawer(true)" class="lg:hidden p-2 rounded-xl bg-white/5 text-slate-300">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div class="relative w-48 sm:w-80">
                  <input type="text" oninput="handleStoreSearch(this.value)" placeholder="Search products, accounts, keys..." class="w-full pl-9 pr-4 py-2 rounded-xl bg-surface-900 border border-white/10 text-xs text-white placeholder-slate-500 focus:border-emerald-500 outline-none">
                  <svg class="w-4 h-4 text-slate-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <button onclick="navigate('cart')" class="relative p-2.5 rounded-xl bg-surface-900 border border-white/5 text-slate-300">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                  <span class="cart-count-badge absolute -top-1 -right-1 w-5 h-5 rounded-full bg-emerald-500 text-gray-950 text-[10px] font-black flex items-center justify-center">${state.cart.length}</span>
                </button>
              </div>
            </header>

            <main id="storeContent" class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto space-y-8"></main>
          </div>
        </div>
      `;

      const storeContent = document.getElementById('storeContent');
      switch(view) {
        case 'home':
        case 'products': renderStoreProducts(storeContent, params); break;
        case 'product-details': renderStoreProductDetails(storeContent, params.id || params.slug); break;
        case 'cart': renderStoreCart(storeContent); break;
        case 'checkout': renderStoreCheckout(storeContent); break;
        case 'orders': renderStoreOrders(storeContent); break;
        case 'account': renderStoreAccount(storeContent); break;
      }
    }

    async function renderStoreProducts(container, filters = {}) {
      container.innerHTML = '<div class="text-center py-16 text-slate-500 font-bold animate-pulse">Loading catalog...</div>';
      let queryUrl = '/api/products?';
      if (filters.search) queryUrl += `search=${encodeURIComponent(filters.search)}&`;

      const res = await fetch(queryUrl);
      const products = await res.json();

      container.innerHTML = `
        <div class="space-y-6">
          <div>
            <h1 class="text-xl font-black text-white">${filters.title || 'Digital Products & Subscriptions'}</h1>
            <p class="text-xs text-slate-400">${products.length} products available for instant fulfillment</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            ${products.map(p => {
              const savings = p.original_price > p.sale_price ? p.original_price - p.sale_price : 0;
              return `
                <div class="glass-card rounded-3xl overflow-hidden flex flex-col justify-between border border-white/5 relative group cursor-pointer" onclick="navigate('product-details', { id: '${p._id}' })">
                  ${p.discount_percentage > 0 ? `
                    <span class="absolute top-3 left-3 z-10 px-2.5 py-1 rounded-full bg-rose-500 text-white font-black text-[10px] uppercase">
                      ${p.discount_percentage}% OFF
                    </span>
                  ` : ''}
                  <span class="absolute top-3 right-3 z-10 px-2.5 py-1 rounded-full bg-surface-950/80 border border-white/10 text-emerald-400 font-bold text-[9px] uppercase">
                    ${p.product_type === 'SUBSCRIPTION' ? '🔄 Subscription' : '⚡ One-Time'}
                  </span>

                  <div>
                    <div class="h-48 w-full overflow-hidden bg-surface-900">
                      <img src="${p.images && p.images[0] ? p.images[0] : 'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    </div>
                    <div class="p-5 space-y-2">
                      <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">${p.category || 'Digital Good'}</span>
                      <h3 class="text-sm font-bold text-white line-clamp-1 group-hover:text-emerald-400 transition-colors">${p.name}</h3>
                      <p class="text-xs text-slate-400 line-clamp-2">${p.short_description || p.description}</p>
                    </div>
                  </div>

                  <div class="px-5 pb-5 pt-2 flex items-center justify-between border-t border-white/5" onclick="event.stopPropagation()">
                    <div>
                      <div class="flex items-center gap-2">
                        <span class="text-base font-black text-white">₹${p.sale_price}</span>
                        ${p.original_price > p.sale_price ? `<span class="text-xs text-slate-500 line-through">₹${p.original_price}</span>` : ''}
                      </div>
                      ${savings > 0 ? `<span class="text-[10px] text-emerald-400 font-bold block">Save ₹${savings}</span>` : ''}
                    </div>
                    <button onclick="navigate('product-details', { id: '${p._id}' })" class="px-4 py-2 rounded-xl bg-emerald-500 text-gray-950 font-black text-xs uppercase shadow-lg shadow-emerald-500/20 active:scale-95">
                      View Details
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // DEDICATED CUSTOMER PRODUCT DETAILS PAGE
    // =========================================================================
    let selectedSubDuration = '1_MONTH';
    let currentSelectedPrice = 199;

    async function renderStoreProductDetails(container, identifier) {
      container.innerHTML = '<div class="text-center py-20 text-slate-500 font-bold animate-pulse">Loading product details...</div>';
      const res = await fetch(`/api/products/${identifier}`);
      const p = await res.json();
      if (!res.ok) {
        container.innerHTML = `<div class="glass p-8 text-center text-rose-400 text-xs">${p.error || 'Product not found'}</div>`;
        return;
      }

      selectedSubDuration = '1_MONTH';
      currentSelectedPrice = p.product_type === 'SUBSCRIPTION' ? (p.subscription_pricing?.one_month || p.sale_price) : p.sale_price;
      const imagesList = p.images && p.images.length ? p.images : ['https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800'];
      const savings = p.original_price > p.sale_price ? p.original_price - p.sale_price : 0;

      container.innerHTML = `
        <div class="space-y-12">
          <div class="flex items-center justify-between text-xs text-slate-400">
            <button onclick="navigate('products')" class="hover:text-white flex items-center gap-1">← Back to Catalog</button>
            <div class="flex items-center gap-2">
              <span class="text-emerald-400 font-bold">${p.category || 'Digital Good'}</span>
              <span>/</span>
              <span class="font-mono text-slate-500">SKU: ${p.sku}</span>
            </div>
          </div>
          
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <div class="lg:col-span-7 space-y-4">
              <div class="h-72 sm:h-96 rounded-3xl overflow-hidden glass border border-white/10 relative">
                <img id="detailMainImage" src="${imagesList[0]}" class="w-full h-full object-cover">
                ${p.discount_percentage > 0 ? `
                  <span class="absolute top-4 left-4 px-3 py-1.5 rounded-full bg-rose-500 text-white font-black text-xs uppercase shadow-xl">
                    ${p.discount_percentage}% OFF
                  </span>
                ` : ''}
              </div>

              ${imagesList.length > 1 ? `
                <div class="flex gap-3 overflow-x-auto pb-2 custom-scroll">
                  ${imagesList.map(img => `
                    <img onclick="document.getElementById('detailMainImage').src='${img}'" src="${img}" class="w-20 h-20 rounded-2xl object-cover glass cursor-pointer border border-white/10 hover:border-emerald-400 transition-all">
                  `).join('')}
                </div>
              ` : ''}
            </div>

            <div class="lg:col-span-5 space-y-6">
              <div>
                <span class="px-3 py-1 rounded-full ${p.product_type === 'SUBSCRIPTION' ? 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30'} border font-bold text-[10px] uppercase">
                  ${p.product_type === 'SUBSCRIPTION' ? '🔄 Subscription Product' : '⚡ One-Time Digital Purchase'}
                </span>
                <h1 class="text-2xl sm:text-3xl font-black text-white mt-2">${p.name}</h1>
                <p class="text-xs text-slate-400 mt-1">${p.short_description || ''}</p>
              </div>

              ${p.product_type === 'SUBSCRIPTION' ? `
                <div class="space-y-2">
                  <label class="text-xs font-bold text-slate-300">Choose Subscription Duration:</label>
                  <div class="grid grid-cols-3 gap-2">
                    <button onclick="pickDuration('1_MONTH', ${p.subscription_pricing?.one_month || 199})" id="dur-1_MONTH" class="dur-btn p-3 rounded-2xl border-2 border-emerald-500 bg-emerald-500/10 text-center">
                      <span class="text-xs font-black text-white block">1 Month</span>
                      <span class="text-[11px] font-mono text-emerald-400">₹${p.subscription_pricing?.one_month || 199}</span>
                    </button>
                    <button onclick="pickDuration('6_MONTHS', ${p.subscription_pricing?.six_months || 899})" id="dur-6_MONTHS" class="dur-btn p-3 rounded-2xl border border-white/10 glass text-center">
                      <span class="text-xs font-black text-white block">6 Months</span>
                      <span class="text-[11px] font-mono text-emerald-400">₹${p.subscription_pricing?.six_months || 899}</span>
                    </button>
                    <button onclick="pickDuration('1_YEAR', ${p.subscription_pricing?.one_year || 1499})" id="dur-1_YEAR" class="dur-btn p-3 rounded-2xl border border-white/10 glass text-center">
                      <span class="text-xs font-black text-white block">1 Year</span>
                      <span class="text-[11px] font-mono text-emerald-400">₹${p.subscription_pricing?.one_year || 1499}</span>
                    </button>
                  </div>
                </div>
              ` : ''}

              <div class="p-5 rounded-3xl glass border border-white/5 space-y-1">
                <div class="flex items-center gap-3">
                  <span class="text-3xl font-black text-white" id="displayActivePrice">₹${currentSelectedPrice}</span>
                  ${p.original_price > p.sale_price ? `<span class="text-sm text-slate-500 line-through">₹${p.original_price}</span>` : ''}
                  ${savings > 0 ? `<span class="px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-bold">You Save ₹${savings}</span>` : ''}
                </div>
                <span class="text-xs ${p.in_stock ? 'text-emerald-400' : 'text-rose-400'} font-bold block pt-1">
                  ${p.in_stock ? `● Available in Stock (${p.stock_count} slots ready)` : '✕ Out of Stock'}
                </span>
              </div>

              <div class="space-y-3">
                <button onclick="buyNowStore('${p._id}', '${p.name.replace(/'/g, "\\'")}', '${p.product_type}')" ${!p.in_stock ? 'disabled' : ''} class="w-full py-4 rounded-2xl ${p.in_stock ? 'bg-emerald-500 text-gray-950 font-black' : 'bg-gray-800 text-gray-500 cursor-not-allowed'} text-xs uppercase tracking-wider shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
                  ${p.in_stock ? '⚡ Buy Now & Pay (UPI / Crypto)' : 'Currently Out of Stock'}
                </button>
                <button onclick="addToCart('${p._id}', '${p.name.replace(/'/g, "\\'")}', ${currentSelectedPrice}, '${imagesList[0]}', '${p.delivery_type}')" ${!p.in_stock ? 'disabled' : ''} class="w-full py-4 rounded-2xl glass hover:bg-white/10 text-white font-bold text-xs uppercase tracking-wider transition-all">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8 space-y-8">
              <div class="glass rounded-3xl p-6 sm:p-8 space-y-4">
                <h3 class="text-sm font-black text-white uppercase tracking-wider">About This Product</h3>
                <div class="text-xs text-slate-300 leading-relaxed whitespace-pre-line">${p.description}</div>
              </div>

              ${p.features && p.features.length ? `
                <div class="glass rounded-3xl p-6 sm:p-8 space-y-4">
                  <h3 class="text-sm font-black text-white uppercase tracking-wider">Key Features</h3>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    ${p.features.map(f => `
                      <div class="flex items-center gap-3 p-3 rounded-2xl bg-surface-950 text-xs text-slate-300">
                        <span class="text-emerald-400 font-black">✓</span> <span>${f}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              ${p.whats_included && p.whats_included.length ? `
                <div class="glass rounded-3xl p-6 sm:p-8 space-y-4">
                  <h3 class="text-sm font-black text-white uppercase tracking-wider">What's Included</h3>
                  <div class="space-y-2">
                    ${p.whats_included.map(item => `
                      <div class="p-3.5 rounded-2xl bg-surface-950 text-xs text-slate-300 flex items-center gap-3">
                        <span class="text-emerald-400">📦</span> <span>${item}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>

            <div class="lg:col-span-4 space-y-6">
              ${p.specifications && p.specifications.length ? `
                <div class="glass rounded-3xl p-6 space-y-4">
                  <h3 class="text-sm font-black text-white uppercase tracking-wider">Product Specifications</h3>
                  <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                      <tbody class="divide-y divide-white/5">
                        ${p.specifications.map(s => `
                          <tr>
                            <td class="py-2.5 text-slate-400 font-medium">${s.label}</td>
                            <td class="py-2.5 text-white font-bold text-right">${s.value}</td>
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  </div>
                </div>

    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1280;
            let width = img.width;
            let height = img.height;
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

      btn.disabled = true;

      try {
        const base64Data = await compressImageFile(fileInput.files[0]);
        const res = await fetch('/api/checkout/upload-proof-json', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.token}`
          },
          body: JSON.stringify({
            transaction_id: txnId,
            screenshot_base64: base64Data

        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        state.cart = [];
        localStorage.removeItem('nexus_cart');
        showToast('Proof submitted! Payment is being verified.');
        navigate('orders');
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Submit Payment Proof for Verification';
        showToast(err.message, 'error');
      }
    }

    async function handleAdminAuth(e) {
      e.preventDefault();
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('admUser').value,
            password: document.getElementById('admPass').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        state.adminToken = data.token;
        state.adminUsername = data.username;
        localStorage.setItem('nexus_admin_token', data.token);
        localStorage.setItem('nexus_admin_user', data.username);
        showToast('Admin Authorized');
        navigate('admin-center');
      } catch (err) { showToast(err.message, 'error'); }

    async function handleSlotFormSubmit(e, slotId) {
      e.preventDefault();
      const isNew = slotId === 'new';

      const payload = {
        account_label: document.getElementById('slotFormLabel').value,
        email: document.getElementById('slotFormEmail').value,
        password: document.getElementById('slotFormPassword').value,
        status: document.getElementById('slotFormStatus').value,
        notes: document.getElementById('slotFormNotes').value
      };

      if (isNew) {
        payload.product_id = document.getElementById('slotFormProduct').value;
      }

      try {
        const url = isNew ? '/api/admin/slots' : `/api/admin/slots/${slotId}`;
        const method = isNew ? 'POST' : 'PUT';

        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.adminToken}` },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        showToast(isNew ? 'Account Slot created!' : 'Credentials updated & live-synced!');
        document.getElementById('globalModal').classList.add('hidden');
        renderAdminAccountSlots(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function viewProofModal(txnDbId, txnId) {
      const modal = document.getElementById('globalModal');
      const content = document.getElementById('globalModalContent');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      content.innerHTML = '<div class="text-center py-12 text-slate-400 font-mono">Loading proof...</div>';

      try {
        const res = await fetch(`/api/admin/transactions/${txnDbId}/proof`, {
          headers: { 'Authorization': `Bearer ${state.adminToken}` }
        });
        const data = await res.json();

        content.innerHTML = `
          <button onclick="document.getElementById('globalModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
          <h3 class="text-base font-bold text-white mb-3 font-mono">Payment Proof (${txnId})</h3>

            <img src="${data.proof_screenshot}" class="max-h-[70vh] w-auto object-contain rounded-xl shadow-2xl">
          </div>
        `;
      } catch (err) {
        content.innerHTML = `<div class="text-center py-8 text-rose-400">Error: ${err.message}</div>`;
      }
    }

    async function confirmAndAssignTransaction(id) {
      const selectEl = document.getElementById(`slotSelect-${id}`);
      const slot_id = selectEl ? selectEl.value : null;

      if (!confirm('Confirm this payment, bind the selected account slot, and activate the customer subscription?')) return;

      try {
        const res = await fetch(`/api/admin/transactions/${id}/confirm-and-assign`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.adminToken}`
          },
          body: JSON.stringify({ slot_id })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        showToast('Subscription activated and account slot bound!');
        renderAdminTransactions(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function rejectTransaction(id) {
      const reason = prompt('Enter rejection reason:', 'Payment screenshot invalid.');
      if (reason === null) return;

      try {
        const res = await fetch(`/api/admin/transactions/${id}/reject`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.adminToken}`
          },
          body: JSON.stringify({ reason })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showToast('Transaction rejected');
        renderAdminTransactions(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    function calculateStudioDiscount() {
      const orig = Number(document.getElementById('studioOrigPrice').value) || 0;
      const sale = Number(document.getElementById('studioSalePrice').value) || 0;
      const disc = orig > sale ? Math.round(((orig - sale) / orig) * 100) : 0;
      const savings = Math.max(0, orig - sale);

      document.getElementById('studioDiscPercent').textContent = `${disc}% OFF`;
      document.getElementById('studioSavingsText').textContent = `Save ₹${savings}`;
    }

    function toggleStudioType(val) {
      if (val === 'SUBSCRIPTION') document.getElementById('studioSubDurations').classList.remove('hidden');
      else document.getElementById('studioSubDurations').classList.add('hidden');
    }

    function updateStudioImgPreview(val) {
      const first = val.split(',')[0]?.trim();
      if (first) document.getElementById('studioPreviewImg').src = first;
    }

    async function handleStudioImageFile(input) {
      if (!input.files || !input.files[0]) return;
      try {
        const base64 = await compressImageFile(input.files[0]);
        document.getElementById('studioPreviewImg').src = base64;
        const current = document.getElementById('studioImagesText').value.trim();
        document.getElementById('studioImagesText').value = current ? `${base64}, ${current}` : base64;
        showToast('Image uploaded and set as main product image!');
      } catch (err) { showToast('Image upload error: ' + err.message, 'error'); }
    }

    async function handleMasterProductSubmit(e, productId) {
      e.preventDefault();
      const isNew = productId === 'new';
      const pType = document.getElementById('studioProductType').value;
      const imagesList = document.getElementById('studioImagesText').value.split(',').map(s => s.trim()).filter(Boolean);

      const specs = [];
      document.querySelectorAll('.spec-row').forEach(row => {
        const label = row.querySelector('.spec-label')?.value.trim();
        const value = row.querySelector('.spec-value')?.value.trim();
        if (label && value) specs.push({ label, value });
      });

      const payload = {
        name: document.getElementById('studioName').value,
        short_description: document.getElementById('studioShortDesc').value,
        description: document.getElementById('studioFullDesc').value,
        category: document.getElementById('studioCategory').value,
        sku: document.getElementById('studioSku').value,
        product_type: pType,
        original_price: Number(document.getElementById('studioOrigPrice').value),
        sale_price: Number(document.getElementById('studioSalePrice').value),
        subscription_pricing: {
          one_month: Number(document.getElementById('studioPrice1M')?.value || 199),
          six_months: Number(document.getElementById('studioPrice6M')?.value || 899),
          one_year: Number(document.getElementById('studioPrice1Y')?.value || 1499)
        },
        images: imagesList.length ? imagesList : ['https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800'],
        features: document.getElementById('studioFeatures').value.split('\n').map(s => s.trim()).filter(Boolean),
        whats_included: document.getElementById('studioIncluded').value.split('\n').map(s => s.trim()).filter(Boolean),
        specifications: specs,
        delivery_type: document.getElementById('studioDelivType').value,
        status: document.getElementById('studioStatus').value
      };

      try {
        const url = isNew ? '/api/admin/products' : `/api/admin/products/${productId}`;
        const method = isNew ? 'POST' : 'PUT';

        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.adminToken}` },
          body: JSON.stringify(payload)
        });
        const saved = await res.json();
        if (!res.ok) throw new Error(saved.error);

        showToast(isNew ? 'Product created successfully!' : 'Product updated in database!');
        document.getElementById('globalModal').classList.add('hidden');
        renderAdminProductsStudio(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function duplicateProduct(id) {
      try {
        const res = await fetch(`/api/admin/products/${id}/duplicate`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${state.adminToken}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showToast('Product cloned as Draft!');
        renderAdminProductsStudio(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function deleteAdminProduct(id) {
      if (!confirm('Delete product and all its slots?')) return;
      try {
        await fetch(`/api/admin/products/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${state.adminToken}` }
        });
        showToast('Deleted');
        renderAdminProductsStudio(document.getElementById('adminMainContent'));
      } catch (err) { showToast(err.message, 'error'); }
    }

    // =========================================================================
    // ADMIN PAYMENT SETTINGS (WITH DIRECT QR UPLOAD)
    // =========================================================================

          <div>
            <h2 class="text-lg font-black text-white font-sans">Payment Gateway & QR Codes</h2>
            <p class="text-xs text-slate-400 font-mono">Upload your UPI QR Code image or paste URL</p>
          </div>

          <form onsubmit="saveAdminPaymentSettings(event)" class="space-y-6 text-xs font-mono">
            <div class="admin-card rounded-3xl p-6 space-y-4">
              <h3 class="font-bold text-emerald-400 uppercase">1. UPI Configuration</h3>
              <div class="space-y-3">
                <div>
                  <label class="text-[10px] text-slate-400 block mb-1">UPI ID (VPA)</label>
                  <input type="text" id="admUpiId" required value="${s.upi_id || ''}" placeholder="e.g. merchant@okaxis" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-white">

                <div>
                  <label class="text-[10px] text-slate-400 block mb-1">UPI QR Code Image</label>
                  <div class="flex flex-col sm:flex-row gap-3 items-center">
                    <img id="upiQrPreviewImg" src="${s.upi_qr_url || 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi'}" class="w-24 h-24 rounded-2xl bg-white p-1 border border-white/20 object-contain shadow-lg">
                    
                    <div class="flex-1 w-full space-y-2">
                      <label class="w-full py-2.5 px-4 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center gap-2 cursor-pointer font-bold transition-all">
                        <span>📁</span> <span>Upload QR Code Image</span>
                        <input type="file" id="upiQrFileInput" accept="image/*" class="hidden" onchange="handleQrFileSelection(this, 'upi')">
                      </label>
                      
                      <input type="text" id="admUpiQr" value="${s.upi_qr_url || ''}" oninput="document.getElementById('upiQrPreviewImg').src=this.value" placeholder="Or paste image URL" class="w-full px-3 py-2 rounded-xl bg-surface-950 border border-admin-border text-[11px] text-slate-400">
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="admin-card rounded-3xl p-6 space-y-4">
              <h3 class="font-bold text-teal-400 uppercase">2. Crypto Configuration</h3>
              <div class="space-y-3">
                <div>
                  <label class="text-[10px] text-slate-400 block mb-1">Wallet Address (USDT TRC20)</label>
                  <input type="text" id="admCryptoWallet" required value="${s.crypto_wallet_address || ''}" placeholder="Wallet Address" class="w-full px-4 py-3 rounded-xl bg-surface-950 border border-admin-border text-white">
                </div>

                <div>
                  <label class="text-[10px] text-slate-400 block mb-1">Crypto QR Code Image</label>
                  <div class="flex flex-col sm:flex-row gap-3 items-center">
                    <img id="cryptoQrPreviewImg" src="${s.crypto_qr_url || 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=crypto'}" class="w-24 h-24 rounded-2xl bg-white p-1 border border-white/20 object-contain shadow-lg">
                    
                    <div class="flex-1 w-full space-y-2">
                      <label class="w-full py-2.5 px-4 rounded-xl bg-teal-500/10 hover:bg-teal-500/20 text-teal-400 border border-teal-500/30 flex items-center justify-center gap-2 cursor-pointer font-bold transition-all">
                        <span>📁</span> <span>Upload Crypto QR Image</span>
                        <input type="file" id="cryptoQrFileInput" accept="image/*" class="hidden" onchange="handleQrFileSelection(this, 'crypto')">
                      </label>
                      
                      <input type="text" id="admCryptoQr" value="${s.crypto_qr_url || ''}" oninput="document.getElementById('cryptoQrPreviewImg').src=this.value" placeholder="Or paste image URL" class="w-full px-3 py-2 rounded-xl bg-surface-950 border border-admin-border text-[11px] text-slate-400">
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <button type="submit" class="w-full py-4 rounded-2xl bg-emerald-500 text-gray-950 font-black uppercase tracking-wider font-sans shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
              Save Payment Settings
            </button>
          </form>
        </div>
      `;
    }

    async function handleQrFileSelection(input, type) {
      if (!input.files || !input.files[0]) return;
      try {
        const base64Data = await compressImageFile(input.files[0]);
        if (type === 'upi') {
          document.getElementById('admUpiQr').value = base64Data;
          document.getElementById('upiQrPreviewImg').src = base64Data;
        } else {
          document.getElementById('admCryptoQr').value = base64Data;
          document.getElementById('cryptoQrPreviewImg').src = base64Data;
        }
        showToast('QR Image processed and ready to save!');
      } catch (err) {
        showToast('Error reading image: ' + err.message, 'error');
      }
    }

    async function saveAdminPaymentSettings(e) {
      e.preventDefault();
      try {
        const res = await fetch('/api/admin/payment-settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.adminToken}` },
          body: JSON.stringify({
            upi_id: document.getElementById('admUpiId').value,
            upi_qr_url: document.getElementById('admUpiQr').value,
            crypto_wallet_address: document.getElementById('admCryptoWallet').value,
            crypto_qr_url: document.getElementById('admCryptoQr').value
          })
        });
        if (!res.ok) throw new Error((await res.json()).error);
        showToast('Payment settings saved successfully!');
      } catch (err) { showToast(err.message, 'error'); }
    }

    // =========================================================================

    // =========================================================================

                <div class="w-full bg-surface-950 rounded-full h-1.5 overflow-hidden">
                  <div class="bg-emerald-500 h-full rounded-full" style="width: ${Math.min(100, Math.round((data.server.service_memory_rss_mb / 512) * 100))}%"></div>

                  <span>OS: ${data.server.os_mem_percent}%</span>

              <div class="admin-card rounded-2xl p-5 space-y-2">

    async function runSystemHealthCheck() {
      const modal = document.getElementById('globalModal');
      const content = document.getElementById('globalModalContent');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      content.innerHTML = '<div class="text-center py-12 text-slate-400 font-mono animate-pulse">Running health checks...</div>';

      try {
        const res = await fetch('/api/admin/system/health-check', {
          headers: { 'Authorization': `Bearer ${state.adminToken}` }
        });
        const data = await res.json();
        const c = data.checks;

        content.innerHTML = `
          <button onclick="document.getElementById('globalModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
          <div class="space-y-5 font-mono">
            <div>
              <h3 class="text-base font-bold text-white font-sans">Full Subsystem Health Results</h3>
              <p class="text-xs text-slate-400">Timestamp: ${new Date(data.timestamp).toLocaleTimeString()}</p>
            </div>

            <div class="space-y-2.5 text-xs">
              <div class="p-3.5 rounded-2xl bg-surface-950 border border-admin-border flex justify-between items-center">
                <span>Frontend Layer</span>
                <span class="text-emerald-400 font-bold">🟢 ${c.frontend.status} (${c.frontend.latency_ms}ms)</span>

              <div class="p-3.5 rounded-2xl bg-surface-950 border border-admin-border flex justify-between items-center">
                <span>Backend Express Engine</span>
                <span class="text-emerald-400 font-bold">🟢 ${c.backend.status} (${c.backend.uptime_sec}s uptime)</span>
              </div>

                <span>MongoDB Atlas Cluster</span>

              </div>

                <span>Digital Delivery Stock Queue</span>
                <span class="${c.digital_delivery.stock_ready ? 'text-emerald-400' : 'text-amber-400'} font-bold">

    function adminSignOut() {
      state.adminToken = '';
      state.adminUsername = '';
      localStorage.removeItem('nexus_admin_token');
      localStorage.removeItem('nexus_admin_user');
      navigate('home');
    }

    document.addEventListener('DOMContentLoaded', () => {
      navigate('home');
    });
  </script>
